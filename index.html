<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04010c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NolBowling</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
    background: #04010c;
    overflow: hidden;
    font-family: 'Press Start 2P', monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    height: 100dvh;
    width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 35%, #230754 0%, #09021c 55%, #03000a 100%);
  }
  #stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    box-shadow: 0 0 50px rgba(255, 0, 255, 0.35), 0 0 0 3px #ff00ff, 0 0 0 6px rgba(0, 255, 255, 0.28);
    border-radius: 16px;
    cursor: pointer;
  }
  #crt {
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: 16px;
    background:
      radial-gradient(circle at center, transparent 62%, rgba(0, 0, 0, 0.42) 100%),
      repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.16) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }
  .arcade-input {
    display: none;
    position: absolute;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #0b0428;
    border-radius: 8px;
    font-family: 'Press Start 2P', monospace;
    text-align: center;
    text-transform: uppercase;
    outline: none;
    z-index: 30;
    user-select: text;
    -webkit-user-select: text;
    touch-action: manipulation;
    padding: 0 8px;
  }
  .arcade-input::placeholder {
    color: rgba(255, 255, 255, 0.32);
  }
  .arcade-input:focus {
    background: #140842;
  }
</style>
</head>

  const W = 480, H = 800;
  const isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  const Q = isTouchDevice
    ? Math.min(1.5, Math.max(1, window.devicePixelRatio || 1))
    : Math.min(2, Math.max(1, window.devicePixelRatio || 1));
  cv.width = Math.round(W * Q);

  const ballSpriteCache = new Map();

  let deviceKind = isTouchDevice ? 'mobile' : 'pc';

  function detectDeviceKind() {
    const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    const ratio = vw / Math.max(1, vh);
    if (isTouchDevice && vw < 720) {
      deviceKind = 'mobile';
    } else if (!isTouchDevice && vw >= 720 && ratio >= 1.15) {
      deviceKind = 'pc';
    } else {
      deviceKind = 'other';
    }
  }

  function fit() {
    detectDeviceKind();
    const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    const isMobile = vw < 600 || vh > vw * 1.25;
    const scaleFactor = isMobile ? 0.994 : 0.975;
    const s = Math.min(vw / W, vh / H) * scaleFactor;
    stage.style.width = Math.max(240, Math.floor(W * s)) + 'px';
    stage.style.height = Math.max(400, Math.floor(H * s)) + 'px';
  }
  window.addEventListener('resize', fit);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
  fit();
  try { document.fonts.load("10px 'Press Start 2P'"); } catch (e) {}

  const LL = 90, LR = 390, BR = 16, PR = 12;
  const FONT = "'Press Start 2P', monospace";
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const MODES = [

  const SKINS = [
    { id: 'cyan', name: 'CYBER CYAN', label: 'CYAN', c1: '#ffffff', c2: '#00ffff', c3: '#6600ff', glow: '#00ffff', trail: '#00ffff', req: 0 },
    { id: 'magenta', name: 'PLASMA PINK', label: 'PINK', c1: '#ffffff', c2: '#ff22ee', c3: '#660044', glow: '#ff00ff', trail: '#ff44ff', req: 0 },
    { id: 'gold', name: 'SOLAR GOLD', label: 'GOLD', c1: '#ffffdd', c2: '#ffcc00', c3: '#cc4400', glow: '#ffaa00', trail: '#ffdd00', req: 3 },
    { id: 'matrix', name: 'VOID MATRIX', label: 'MATRIX', c1: '#ccffcc', c2: '#00ff66', c3: '#003311', glow: '#00ff88', trail: '#00ff66', req: 10 },
    { id: 'nebula', name: 'COSMIC NEBULA', label: 'NEBULA', c1: '#ffd6ff', c2: '#9b5de5', c3: '#1b0938', glow: '#c77dff', trail: '#b5179e', req: 5 },
    { id: 'lava', name: 'MAGMA CORE', label: 'MAGMA', c1: '#fff099', c2: '#ff5400', c3: '#370617', glow: '#ff6d00', trail: '#ff4800', req: 8 },
    { id: 'ice', name: 'CRYO FROST', label: 'CRYO', c1: '#ffffff', c2: '#48cae4', c3: '#023e8a', glow: '#90e0ef', trail: '#48cae4', req: 2 },
    { id: 'ylazia', name: 'YLAZIA', label: 'YLAZIA', c1: '#ff66dd', c2: '#7a0bc0', c3: '#090114', glow: '#ff22bb', trail: '#e0119d', req: 0 },
    { id: 'coralens', name: 'CORALENS', label: 'CORALENS', c1: '#ffd1a3', c2: '#ff7b29', c3: '#7a2500', glow: '#ff8c42', trail: '#ff7b29', req: 0 },
    { id: 'oathnet', name: 'OATHNET', label: 'OATHNET', c1: '#ffffff', c2: '#5d34d9', c3: '#1d1c29', glow: '#7b4dff', trail: '#7b4dff', req: 0 },
    { id: 'france', name: 'FRANCE', label: 'FRANCE', c1: '#ffffff', c2: '#0055a4', c3: '#ef4135', glow: '#4da6ff', trail: '#ffffff', req: 0 },
    { id: 'mexique', name: 'MEXIQUE', label: 'MEXIQUE', c1: '#ffffff', c2: '#006847', c3: '#ce1126', glow: '#00d97e', trail: '#ff4444', req: 0 },
    { id: 'pologne', name: 'POLOGNE', label: 'POLOGNE', c1: '#ffffff', c2: '#dc143c', c3: '#8b001e', glow: '#ff4d6d', trail: '#ff4d6d', req: 0 },
    { id: 'bretagne', name: 'BRETAGNE (BZH)', label: 'BZH', c1: '#ffffff', c2: '#111111', c3: '#000000', glow: '#ffffff', trail: '#ffffff', req: 0 },
    { id: 'rennes', name: 'STADE RENNAIS', label: 'RENNES', c1: '#ff3b3b', c2: '#d5001c', c3: '#111111', glow: '#ff2a3c', trail: '#ff2a3c', req: 0 },
    { id: 'nc', name: 'NOUVELLE-CALEDONIE', label: 'NC', c1: '#ffd200', c2: '#0035ad', c3: '#009543', glow: '#ffd200', trail: '#ffd200', req: 0 }
  ];

  const BOT_LEVELS = [
    { n: 'ROOKIE', desc: 'IA DEBUTANTE • ERREURS FREQUENTES', errPos: 34, errAng: 0.16, errPow: 0.24, spinSkill: 0.25 },
    { n: 'PRO', desc: 'IA EQUILIBREE • VISE LES SPARES', errPos: 14, errAng: 0.065, errPow: 0.09, spinSkill: 0.65 },
    { n: 'CYBER PRO', desc: 'IA EXPERTE • POCHE 1-3 & EFFET', errPos: 5, errAng: 0.022, errPow: 0.035, spinSkill: 0.92 }
  ];

  const PLAYER_COLORS = ['#00ffff', '#ff00ff', '#ffff00', '#00ff88'];

  let stats = {
    best: 0,
    strikes: 0,
    spares: 0,
    maxStreak: 0,
    games: 0,
    skin: 0,
    nick: ''
  };
  try {
    const saved = JSON.parse(localStorage.getItem('nb_stats_v2') || 'null');
    if (saved) stats = { ...stats, ...saved };
    else {
      const oldBest = +localStorage.getItem('nb_best') || 0;
      if (oldBest > 0) stats.best = oldBest;
    }
  } catch (e) {}

  function saveStats() {
    try { localStorage.setItem('nb_stats_v2', JSON.stringify(stats)); } catch (e) {}
  }

  const STARS = Array.from({ length: 30 }, () => ({
    x: Math.random() * W,
    y: 88 + Math.random() * 135,
    s: Math.random() * 1.7 + 0.6,
    ph: Math.random() * 6.28
  }));

  /* ==========================================================================
     2. ETAT DU JEU, SCROLL LISTE BOULES, PSEUDOS, FIREBASE & P2P
     ========================================================================== */
  let st = 'menu';
  let tk = 0;
  let mode = 0, np = 1, mrow = 0;
  let playType = 'solo';
  let localPlayers = 2;
  let onlineCapacity = 2;
  let botDiff = 1;

  let ballMenuOpen = false;
  let ballScrollPx = 0;
  let ballScrollVel = 0;
  let ballDragActive = false;
  let ballDragLastY = 0;
  let ballDragMoved = false;
  let ballScrollLocked = false;
  let lastDropdownMetrics = { boxX: 22, boxY: 220, boxW: W - 44, boxH: 480, listTop: 264, listH: 420, maxScroll: 0 };

  function cleanNickChars(raw) {
    return String(raw || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toUpperCase()
      .replace(/[^A-Z0-9_-]/g, '')
      .slice(0, 10);
  }

  function sanitizeNick(raw, fallback = 'JOUEUR') {
    const clean = cleanNickChars(raw);
    return clean.length > 0 ? clean : fallback;
  }

  let myNick = sanitizeNick(stats.nick, 'JOUEUR');
  let onlineCount = 1;
  const publicRooms = new Map();
  let lastPublishedRoomCode = '';

  const nickInputEl = document.getElementById('nickInput');
  const roomInputEl = document.getElementById('roomInput');

  nickInputEl.value = stats.nick ? myNick : '';
  nickInputEl.addEventListener('input', () => {
    const filtered = cleanNickChars(nickInputEl.value);
    if (nickInputEl.value !== filtered) {
      const pos = nickInputEl.selectionStart || filtered.length;
      nickInputEl.value = filtered;
      try { nickInputEl.setSelectionRange(pos, pos); } catch (e) {}
    }
    if (filtered.length > 0) {
      myNick = filtered;
      stats.nick = myNick;
      saveStats();
    }
  });

  nickInputEl.addEventListener('blur', () => {
    const finalNick = sanitizeNick(nickInputEl.value, 'JOUEUR');
    myNick = finalNick;
    nickInputEl.value = finalNick;
    stats.nick = myNick;
    saveStats();
  });

  roomInputEl.addEventListener('input', () => {
    const filtered = String(roomInputEl.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
    if (roomInputEl.value !== filtered) roomInputEl.value = filtered;
  });

  let NF = 0, FIN = false;
  let PL = [], cp = 0, fi = 0, fr = [], sb = 10, turnChg = false, level = 1;
  let pins = [], ball = null, bumpers = [], parts = [], texts = [], trails = [];
  let shake = 0, flash = 0, flashCol = '#fff';
  let overAt = 0;
  let aimA = 0, aimPh = 0, powPh = 0, power = 0, aimLock = 0;
  let px = 240, ptrX = 240, steerOn = false, keys = {};
  let calmT = 0, settleT = 0, wait = 0;
  let msg = '', msgSub = '', msgC = '#ff0', msgT = 0;
  let gutter = false;
  let mute = false, musicOn = true;
  let hits = [], mx = -1, my = -1, ptrDown = false, sx = 0, sy = 0, moved = false, hitBtn = false;
  let swipeMode = false, swipeStartY = 0, swipeStartX = 0, swipeTime = 0;
  let copiedToast = 0;
  let botPlan = null;
  let autoStartTimer = null;
  let disconnectReturnTimer = null;

  let peer = null;
  const hostConns = [];
  let guestConn = null;
  let mySlot = 0;
  let remoteSkin = -1; // peau de la boule du joueur qui lance en ce moment (reçue par réseau)
  let netRole = null;
  let netStatus = 'PRET A CONNECTER';
  let roomCode = '';
  let onlineSub = 'lobby';
  let lobbyScroll = 0;
  let netSyncTimer = 0;
  let roomRoster = [];

  let sweeper = { active: false, t: 0, dur: 52, resetRack: false, cleared: false };

  function haptic(pattern = 15) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
  }

  function clearPendingTimers() {
    if (autoStartTimer) { clearTimeout(autoStartTimer); autoStartTimer = null; }
    if (disconnectReturnTimer) { clearTimeout(disconnectReturnTimer); disconnectReturnTimer = null; }
  }

  /* --- Authentification anonyme Firebase (API REST) --- */
  const fbAuth = { uid: null, idToken: null, refreshToken: null, expiresAt: 0, pending: null };

  async function fbSignIn() {
    if (fbAuth.pending) return fbAuth.pending;
    fbAuth.pending = (async () => {
      try {
        let data = null;
        let saved = null;
        try { saved = localStorage.getItem('nb_fb_refresh'); } catch (e) {}

        if (saved) {
          const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${FB_API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(saved)
          });
          if (r.ok) {
            const j = await r.json();
            data = { idToken: j.id_token, refreshToken: j.refresh_token, localId: j.user_id, expiresIn: j.expires_in };
          }
        }

        if (!data) {
          const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FB_API_KEY}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ returnSecureToken: true })
          });
          if (!r.ok) return false;
          data = await r.json();
        }

        if (!data || !data.idToken || !data.localId) return false;
        fbAuth.idToken = data.idToken;
        fbAuth.refreshToken = data.refreshToken;
        fbAuth.uid = data.localId;
        fbAuth.expiresAt = Date.now() + (Number(data.expiresIn) || 3600) * 1000;
        try { localStorage.setItem('nb_fb_refresh', data.refreshToken); } catch (e) {}
        return true;
      } catch (e) {
        return false;
      }
    })();
    const res = await fbAuth.pending;
    fbAuth.pending = null;
    return res;
  }

  async function fbEnsureAuth() {
    if (fbAuth.idToken && Date.now() < fbAuth.expiresAt - 120000) return true;
    return fbSignIn();
  }

  async function fbPut(path, data) {
    try {
      if (!(await fbEnsureAuth())) return;
      await fetch(`${DB_URL}/${path}.json?auth=${encodeURIComponent(fbAuth.idToken)}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
        keepalive: true
      });
    } catch (e) {}
  }

  function fbDelete(path) {
    const send = () => {
      try {
        fetch(`${DB_URL}/${path}.json?auth=${encodeURIComponent(fbAuth.idToken)}`, {
          method: 'DELETE',
          keepalive: true
        }).catch(() => {});
      } catch (e) {}
    };
    if (fbAuth.idToken && Date.now() < fbAuth.expiresAt) send();
    else fbEnsureAuth().then(ok => { if (ok) send(); });
  }

  async function fbPutOwn(folder, data) {
    if (!(await fbEnsureAuth()) || !fbAuth.uid) return;
    return fbPut(`${folder}/${fbAuth.uid}`, data);
  }

  function fbDeleteOwn(folder) {
    if (fbAuth.uid) fbDelete(`${folder}/${fbAuth.uid}`);
  }

  function publishRoomToFirebase(roomObj) {
    if (!roomObj || !roomObj.code) return;
    const payload = {
      code: roomObj.code,
      host: sanitizeNick(roomObj.host, 'HOTE'),
      count: Number(roomObj.count) || 1,
      max: Number(roomObj.max) || 2,
      mode: Number(roomObj.mode) || 0,
      ts: Date.now()
    };
    lastPublishedRoomCode = payload.code;
    publicRooms.set(payload.code, payload);
    fbPutOwn('rooms', payload);
  }

  function removeRoomFromFirebase(code) {
    const target = code || lastPublishedRoomCode;
    if (!target) return;
    if (target === lastPublishedRoomCode) lastPublishedRoomCode = '';
    publicRooms.delete(target);
    fbDeleteOwn('rooms');
  }

  async function syncFirebaseLobby() {
    const now = Date.now();
    try {
      const [roomsRes, presRes] = await Promise.all([
        fetch(`${DB_URL}/rooms.json`, { cache: 'no-store' }),
        fetch(`${DB_URL}/presence.json`, { cache: 'no-store' })
      ]);

      if (roomsRes.ok) {
        const roomsData = await roomsRes.json();
        publicRooms.clear();
        if (roomsData && typeof roomsData === 'object') {
          Object.entries(roomsData).forEach(([key, r]) => {
            if (!r || typeof r !== 'object') return;
            const age = now - (Number(r.ts) || 0);
            if (age > 25000) {
              fbDelete(`rooms/${key}`);
              return;
            }
            const code = String(r.code || '').toUpperCase();
            if (!/^[A-HJ-NP-Z2-9]{4}$/.test(code)) return;
            const count = Number(r.count) || 1;
            const max = Number(r.max) || 2;
            if (count < max) {
              publicRooms.set(code, {
                code,
                host: sanitizeNick(r.host, 'HOTE'),
                count,
                max,
                mode: Number(r.mode) || 0,
                ts: Number(r.ts) || now
              });
            }
          });
        }
      }

      if (presRes.ok) {
        const presData = await presRes.json();
        let active = 0;
        if (presData && typeof presData === 'object') {
          Object.entries(presData).forEach(([id, p]) => {
            const ts = typeof p === 'object' && p ? Number(p.ts) || 0 : Number(p) || 0;
            if (now - ts > 25000) {
              fbDelete(`presence/${id}`);
            } else {
              active++;
            }
          });
        }
        onlineCount = Math.max(1, active);
      }
    } catch (e) {}
  }

  function sendPresencePing() {
    fbPutOwn('presence', {
      ts: Date.now(),
      nick: myNick
    });
  }

  function initFirebaseRealtime() {
    sendPresencePing();
    syncFirebaseLobby();

    setInterval(() => {
      sendPresencePing();
      if (netRole === 'host' && onlineSub === 'hosting' && roomCode && roomRoster.length < onlineCapacity) {
        publishRoomToFirebase({
          code: roomCode,
          host: myNick,
          count: roomRoster.length,
          max: onlineCapacity,
          mode
        });
      }
    }, 5000);

    setInterval(() => {
      if (st === 'menu' || st === 'online') {
        syncFirebaseLobby();
      }
    }, 1000);

    window.addEventListener('beforeunload', () => {
      if (netRole === 'host' && roomCode) {
        removeRoomFromFirebase(roomCode);
      } else if (lastPublishedRoomCode) {
        removeRoomFromFirebase(lastPublishedRoomCode);
      }
      fbDeleteOwn('presence');
    });
  }

  setTimeout(initFirebaseRealtime, 150);

  function getActivePublicRooms() {
    const now = Date.now();
    const list = [];
    publicRooms.forEach((r, code) => {
      if (!r || now - (r.ts || 0) > 25000) {
        publicRooms.delete(code);
      } else if (r.count < r.max) {
        list.push(r);
      }
    });
    list.sort((a, b) => (b.ts || 0) - (a.ts || 0));
    return list;
  }

  /* ==========================================================================
     3. AUDIO SYNTHWAVE (WEB AUDIO API)
     ========================================================================== */
  let ac = null;
  let rollNode = null, rollGain = null, rollFilter = null;
  let musicTimer = null, musicStep = 0;

  function initAudio() {
    if (!ac) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) ac = new Ctx();
    }
    if (ac && ac.state === 'suspended') {
      ac.resume().catch(() => {});
    }
    setupRollSound();
  }

  function setupRollSound() {
    if (!ac || rollNode) return;
    try {
      const bufferSize = ac.sampleRate * 2;
      const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      rollNode = ac.createBufferSource();
      rollNode.buffer = buffer;
      rollNode.loop = true;

      rollFilter = ac.createBiquadFilter();
      rollFilter.type = 'lowpass';
      rollFilter.frequency.value = 120;

      rollGain = ac.createGain();
      rollGain.gain.value = 0.0001;

      rollNode.connect(rollFilter);
      rollFilter.connect(rollGain);
      rollGain.connect(ac.destination);
      rollNode.start();
    } catch (e) {}
  }

  function updateRollAudio() {
    if (!ac || !rollGain || !rollFilter) return;
    const T = ac.currentTime;
    if (!mute && st === 'roll' && ball && ball.rolling && !gutter) {
      const sp = Math.hypot(ball.vx, ball.vy);
      const norm = clamp(sp / 16, 0, 1);
      rollGain.gain.setTargetAtTime(0.02 + norm * 0.055, T, 0.05);
      rollFilter.frequency.setTargetAtTime(90 + norm * 240, T, 0.05);
    } else {
      rollGain.gain.setTargetAtTime(0.0001, T, 0.06);
    }
  }

  function tone(f, d = 0.1, ty = 'square', v = 0.06, sl = 0) {
    if (mute) return;
    try {
      initAudio();
      if (!ac) return;
      const o = ac.createOscillator();
      const n = ac.createGain();
      const T = ac.currentTime;
      o.type = ty;
      o.frequency.setValueAtTime(f, T);
      if (sl) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + sl), T + d);
      n.gain.setValueAtTime(v, T);
      n.gain.exponentialRampToValueAtTime(0.001, T + d);
      o.connect(n);
      n.connect(ac.destination);
      o.start();
      o.stop(T + d);
    } catch (e) {}
  }

  const arp = (a, s = 65, ty = 'square', v = 0.065) =>
    a.forEach((f, i) => setTimeout(() => tone(f, 0.15, ty, v), i * s));

  const BASS_SEQ = [
    110, 110, 220, 110, 130.81, 130.81, 261.63, 130.81,
    87.31, 87.31, 174.61, 87.31, 98.00, 98.00, 196.00, 146.83
  ];
  const LEAD_SEQ = [
    440, 0, 523.25, 0, 659.25, 0, 587.33, 523.25,
    349.23, 0, 440, 0, 392.00, 0, 493.88, 0
  ];

  function startMusicLoop() {
    if (musicTimer) return;
    musicTimer = setInterval(() => {
      if (mute || !musicOn || !ac || ac.state !== 'running') return;
      const step = musicStep % 16;
      const bass = BASS_SEQ[step];
      if (bass) tone(bass, 0.14, 'sawtooth', 0.015);
      if (st !== 'roll') {
        const lead = LEAD_SEQ[step];
        if (lead && (musicStep % 32 >= 16 || step % 4 === 0)) {
          tone(lead, 0.18, 'triangle', 0.014);
        }
      }
      musicStep++;
    }, 175);
  }
  startMusicLoop();

  /* ==========================================================================
     4. REGLES DE BOWLING & CALCUL DU SCORE
     ========================================================================== */
  const f0 = v => (v === 0 ? '.' : '' + v);

  function calc(p) {
    const r = p.rolls;
    const out = [];
    let i = 0, tot = 0;

    for (let f = 0; i < r.length && (!FIN || f < NF); f++) {
      const c = { m: [], t: null };
      if (FIN && f === NF - 1) {
        const s = r.slice(i);
        const [a, b, d] = s;
        c.m = [a === 10 ? 'X' : f0(a)];
        if (b !== undefined) {
          c.m.push(a === 10 ? (b === 10 ? 'X' : f0(b)) : (a + b === 10 ? '/' : f0(b)));
        }
        if (d !== undefined) {
          c.m.push(
            a === 10
              ? (b === 10 ? (d === 10 ? 'X' : f0(d)) : (b + d === 10 ? '/' : f0(d)))
              : (d === 10 ? 'X' : f0(d))
          );
        }
        tot += s.reduce((x, y) => x + y, 0);
        c.t = tot;
        i = r.length;
      } else if (r[i] === 10) {
        c.m = ['X'];
        if (r[i + 2] !== undefined) {
          tot += 10 + r[i + 1] + r[i + 2];
          c.t = tot;
        }
        i++;
      } else if (r[i + 1] !== undefined) {
        const s = r[i] + r[i + 1];
        if (s === 10) {
          c.m = [f0(r[i]), '/'];
          if (r[i + 2] !== undefined) {
            tot += 10 + r[i + 2];
            c.t = tot;
          }
        } else {
          c.m = [f0(r[i]), f0(r[i + 1])];
          tot += s;
          c.t = tot;
        }
        i += 2;
      } else {
        c.m = [f0(r[i])];
        i++;
      }
      out.push(c);
    }
    return { fr: out, tot };
  }

  const total = p => calc(p).tot + p.bonus;

  /* ==========================================================================
     5. MULTIJOUEUR P2P (1 A 4 JOUEURS), ANTI-TRICHE, PHYSIQUE & DEROULEMENT
     ========================================================================== */
  const isBotTurn = () => {
    if (playType === 'bot' && cp === 1) return true;
    if (playType === 'online' && roomRoster[cp] && roomRoster[cp].isBot) return true;
    return false;
  };
  const isMyNetTurn = () => {
    if (playType !== 'online') return true;
    if (roomRoster[cp] && roomRoster[cp].isBot) return netRole === 'host';
    return cp === mySlot;
  };
  const canLocalControl = () => !isBotTurn() && isMyNetTurn();

  const netSec = {
    lastMsgByPeer: new Map(),
    warnByPeer: new Map(),
    turnLaunchSeen: false,
    turnResSeen: false,
    lastLaunchMeta: null
  };

  function resetNetTurnSecurity() {
    netSec.turnLaunchSeen = false;
    netSec.turnResSeen = false;
    netSec.lastLaunchMeta = null;
    remoteSkin = -1;
  }

  function flagNetCheater(conn, reason) {
    if (!conn) return;
    const id = conn.peer || 'unknown';
    const count = (netSec.warnByPeer.get(id) || 0) + 1;
    netSec.warnByPeer.set(id, count);
    if (count >= 3) {
      try {
        conn.send({ type: 'kicked', reason: reason || 'ACTION INVALIDE' });
        conn.close();
      } catch (e) {}
    }
  }

  // Renvoie :
  //   true  = paquet accepté
  //   false = paquet invalide / malveillant (compte comme avertissement, 3 = exclusion)
  //   null  = paquet ignoré SANS sanction (arrivé en retard ou dans le désordre :
  //           le canal PeerJS n'est pas ordonné par défaut, ça arrive à des joueurs honnêtes)
  function validateNetPacket(d, senderPeerId = null) {
    if (!d || typeof d !== 'object' || typeof d.type !== 'string') return false;

    if (netRole === 'host' && senderPeerId) {
      // Un invité ne peut envoyer QUE ces types. start / lobby_state / full / kicked
      // sont réservés au host (sinon un invité pourrait fermer la salle de tout le monde).
      if (!['hello', 'rematch', 'aim', 'launch', 'roll_sync', 'throw_res'].includes(d.type)) return false;

      const slotEntry = roomRoster.find(r => r.peerId === senderPeerId);
      if (!slotEntry) return null;

      if (d.type === 'hello') {
        return (st === 'online' && onlineSub === 'hosting' && typeof d.nick === 'string') ? true : null;
      }
      if (d.type === 'rematch') {
        return st === 'over' ? true : null;
      }
      // ce n'est pas son tour (ou tour d'un bot) : on ignore
      if (slotEntry.slot !== cp || isBotTurn()) return null;
    }

    if (d.type === 'aim') {
      if (!Number.isFinite(d.px) || !Number.isFinite(d.aimA) || !Number.isFinite(d.power)) return false;
      if (d.px < LL + BR || d.px > LR - BR) return false;
      if (Math.abs(d.aimA) > 0.45) return false;
      if (d.power < 0 || d.power > 1.02) return false;
      if (d.aimLock !== 0 && d.aimLock !== 1) return false;
      return st === 'aim' ? true : null;
    }

    if (d.type === 'launch') {
      if (!Number.isFinite(d.px) || !Number.isFinite(d.vx) || !Number.isFinite(d.vy)) return false;
      if (!Number.isFinite(d.aimA) || !Number.isFinite(d.power)) return false;
      if (d.px < LL + BR || d.px > LR - BR) return false;
      if (Math.abs(d.aimA) > 0.45) return false;
      if (d.power < 0 || d.power > 1.01) return false;
      const expectedSpeed = 7.2 + clamp(d.power, 0, 1) * 9.2;
      const actualSpeed = Math.hypot(d.vx, d.vy);
      if (Math.abs(actualSpeed - expectedSpeed) > 0.35 || d.vy >= -5.5) return false;
      if (Math.abs(d.spin || 0) > 1.05) return false;
      return (st === 'aim' && !netSec.turnLaunchSeen) ? true : null;
    }

    if (d.type === 'roll_sync') {
      if (st !== 'roll' || !netSec.turnLaunchSeen) return null;
      if (!Number.isFinite(d.bx) || !Number.isFinite(d.by) || !Number.isFinite(d.vx) || !Number.isFinite(d.vy)) return false;
      // roll_sync ne sert qu'à recaler la boule : une valeur hors limites est simplement ignorée
      if (d.bx < 20 || d.bx > 460 || d.by < 0 || d.by > 760) return null;
      if (Math.hypot(d.vx, d.vy) > 19.5) return null;
      if (Math.abs(d.spin || 0) > 1.05) return null;
      return true;
    }

    if (d.type === 'throw_res') {
      if (!Array.isArray(d.pins) || d.pins.length > 20) return false;
      for (let i = 0; i < d.pins.length; i++) {
        if (!d.pins[i] || typeof d.pins[i] !== 'object') return false;
      }
      if (pins.length && d.pins.length !== pins.length) return false;
      // NB : on ne compare PAS avec l'état local des quilles : chaque client simule la
      // boule de son côté, donc l'état local peut légitimement différer du résultat du lanceur.
      return ((st === 'roll' || st === 'between') && !netSec.turnResSeen) ? true : null;
    }

    return ['full', 'kicked', 'lobby_state', 'start', 'rematch'].includes(d.type);
  }

  // index de peau valide (0..SKINS.length-1) ou -1
  function validSkinIdx(v) {
    return Number.isInteger(v) && v >= 0 && v < SKINS.length ? v : -1;
  }

  // peau à annoncer aux autres pour le lancer en cours : la mienne si c'est mon tour,
  // sinon celle du roster (cas d'un bot joué par le host)
  function netSkinForTurn() {
    if (cp === mySlot) return stats.skin;
    const e = roomRoster[cp];
    return e && Number.isInteger(e.skin) ? e.skin : stats.skin;
  }

  function cleanGameMsg(d) {
    if (!d || typeof d !== 'object') return d;
    if (d.type === 'aim') {
      return {
        type: 'aim',
        px: clamp(Number(d.px) || 240, LL + BR + 4, LR - BR - 4),
        aimLock: d.aimLock ? 1 : 0,
        aimA: clamp(Number(d.aimA) || 0, -0.42, 0.42),
        power: clamp(Number(d.power) || 0, 0, 1),
        skin: validSkinIdx(d.skin)
      };
    }
    if (d.type === 'launch') {
      return {
        type: 'launch',
        px: clamp(Number(d.px) || 240, LL + BR + 4, LR - BR - 4),
        vx: Number(d.vx) || 0,
        vy: Number(d.vy) || -8,
        spin: clamp(Number(d.spin) || 0, -1, 1),
        aimA: clamp(Number(d.aimA) || 0, -0.42, 0.42),
        power: clamp(Number(d.power) || 0, 0, 1),
        perfect: !!d.perfect,
        skin: validSkinIdx(d.skin)
      };
    }
    if (d.type === 'roll_sync') {
      return {
        type: 'roll_sync',
        bx: clamp(Number(d.bx) || 240, LL - 24, LR + 24),
        by: clamp(Number(d.by) || 400, 20, 745),
        vx: clamp(Number(d.vx) || 0, -18, 18),
        vy: clamp(Number(d.vy) || -8, -18, 4),
        spin: clamp(Number(d.spin) || 0, -1, 1)
      };
    }
    if (d.type === 'throw_res') {
      return {
        type: 'throw_res',
        gutter: !!d.gutter,
        pins: Array.isArray(d.pins) ? d.pins.map(p => ({ down: !!p.down, gone: !!p.gone })) : []
      };
    }
    return d;
  }

  function netBroadcastFromHost(data, excludeConn = null) {
    for (let i = 0; i < hostConns.length; i++) {
      const c = hostConns[i];
      if (c && c.open && c !== excludeConn) {
        try { c.send(data); } catch (e) {}
      }
    }
  }

  function netSend(data) {
    if (playType !== 'online') return;
    if (netRole === 'host') {
      netBroadcastFromHost(data);
    } else if (netRole === 'guest' && guestConn && guestConn.open) {
      try { guestConn.send(data); } catch (e) {}
    }
  }

  function closeNetwork() {
    clearPendingTimers();
    nickInputEl.style.display = 'none';
    roomInputEl.style.display = 'none';
    if (netRole === 'host' && roomCode) {
      removeRoomFromFirebase(roomCode);
    }
    while (hostConns.length) {
      const c = hostConns.pop();
      try { c.close(); } catch (e) {}
    }
    if (guestConn) { try { guestConn.close(); } catch (e) {} guestConn = null; }
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    netSec.lastMsgByPeer.clear();
    netSec.warnByPeer.clear();
    resetNetTurnSecurity();
    netRole = null;
    mySlot = 0;
    roomCode = '';
    roomRoster = [];
    onlineSub = 'lobby';
    lobbyScroll = 0;
  }

  function openMentionsLegalesPage() {
    ballMenuOpen = false;
    closeNetwork();
    window.location.href = 'mentions-legales.html';
  }

  function genCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  function syncLobbyRoster() {
    roomRoster.forEach((p, idx) => { p.slot = idx; });
    netBroadcastFromHost({
      type: 'lobby_state',
      roster: roomRoster.map(r => ({ nick: r.nick, slot: r.slot, isBot: !!r.isBot, peerId: r.peerId, skin: Number.isInteger(r.skin) ? r.skin : 0 })),
      max: onlineCapacity,
      mode
    });
    if (roomRoster.length >= onlineCapacity) {
      removeRoomFromFirebase(roomCode);
      if (!autoStartTimer) {
        autoStartTimer = setTimeout(() => {
          autoStartTimer = null;
          if (st === 'online' && onlineSub === 'hosting') {
            launchOnlineMatch();
          }
        }, 650);
      }
    } else {
      publishRoomToFirebase({
        code: roomCode,
        host: myNick,
        count: roomRoster.length,
        max: onlineCapacity,
        mode
      });
    }
  }

  function launchOnlineMatch() {
    if (netRole !== 'host') return;
    clearPendingTimers();
    removeRoomFromFirebase(roomCode);
    while (roomRoster.length < onlineCapacity && roomRoster.length > 1) {
      roomRoster.push({
        nick: 'BOT ' + roomRoster.length,
        slot: roomRoster.length,
        isBot: true,
        peerId: null,
        skin: (roomRoster.length * 3) % SKINS.length
      });
    }
    roomRoster.forEach((p, idx) => { p.slot = idx; });
    netBroadcastFromHost({
      type: 'start',
      mode,
      roster: roomRoster.map(r => ({ nick: r.nick, slot: r.slot, isBot: !!r.isBot, peerId: r.peerId, skin: Number.isInteger(r.skin) ? r.skin : 0 }))
    });
    startGame(true);
  }

  function bindHostClient(c) {
    c.on('open', () => {
      if (st !== 'online' || onlineSub !== 'hosting' || roomRoster.length >= onlineCapacity) {
        try { c.send({ type: 'full' }); c.close(); } catch (e) {}
        return;
      }
      hostConns.push(c);
      const slotIdx = roomRoster.length;
      roomRoster.push({ nick: 'JOUEUR ' + (slotIdx + 1), slot: slotIdx, isBot: false, peerId: c.peer, skin: 0 });
      arp([523.25, 659.25], 55);
      haptic(20);
      syncLobbyRoster();
    });

    c.on('data', d => {
      if (!d || typeof d !== 'object') return;
      const now = performance.now();
      const lastT = netSec.lastMsgByPeer.get(c.peer) || 0;
      // Anti-flood : limite la fréquence des paquets entrants
      if (d.type !== 'throw_res' && d.type !== 'launch' && now - lastT < 16) return;
      netSec.lastMsgByPeer.set(c.peer, now);

      const verdict = validateNetPacket(d, c.peer);
      if (!verdict) {
        // false = triche / paquet malformé -> avertissement ; null = simplement ignoré
        if (verdict === false) {
          console.warn('[NolBowling] Paquet refuse de ' + c.peer + ' : type=' + d.type + ' (etat=' + st + ', cp=' + cp + ')');
          flagNetCheater(c, 'PAQUET SUSPECT BLOQUE');
        }
        return;
      }

      if (d.type === 'hello') {
        const item = roomRoster.find(r => r.peerId === c.peer);
        if (item) {
          if (d.nick) item.nick = sanitizeNick(String(d.nick).slice(0, 64), 'JOUEUR');
          if (Number.isInteger(d.skin) && d.skin >= 0 && d.skin < SKINS.length) {
            item.skin = d.skin;
          }
          syncLobbyRoster();
        }
      } else {
        const msg = cleanGameMsg(d);
        netBroadcastFromHost(msg, c);
        handleNetData(msg);
      }
    });

    c.on('close', () => {
      const cIdx = hostConns.indexOf(c);
      if (cIdx !== -1) hostConns.splice(cIdx, 1);
      if (st === 'online' && onlineSub === 'hosting') {
        const rIdx = roomRoster.findIndex(r => r.peerId === c.peer);
        if (rIdx !== -1) roomRoster.splice(rIdx, 1);
        syncLobbyRoster();
      } else if (playType === 'online' && st !== 'menu' && st !== 'over') {
        say('UN JOUEUR A QUITTE', '#f35', 140, 'RETOUR AU MENU');
        if (!disconnectReturnTimer) {
          disconnectReturnTimer = setTimeout(() => {
            disconnectReturnTimer = null;
            closeNetwork();
            st = 'menu';
          }, 1800);
        }
      }
    });
  }

  function setupGuestConn(connection) {
    guestConn = connection;
    const connTimeout = setTimeout(() => {
      if (playType === 'online' && st === 'online' && (!guestConn || !guestConn.open)) {
        netStatus = 'DELAI DEPASSE - REESSAIE';
        tone(150, 0.2, 'sawtooth');
      }
    }, 6500);

    guestConn.on('open', () => {
      clearTimeout(connTimeout);
      netStatus = 'CONNECTE AU SALON !';
      arp([523.25, 659.25, 783.99], 60);
      haptic([20, 40, 20]);
      netSend({ type: 'hello', nick: myNick, skin: stats.skin });
    });
    guestConn.on('data', d => {
      if (netRole === 'guest' && !validateNetPacket(d)) return;
      handleNetData(d);
    });
    guestConn.on('close', () => {
      clearTimeout(connTimeout);
      if (playType === 'online' && st !== 'menu' && st !== 'over') {
        say('HOTE DECONNECTE', '#f35', 140, 'RETOUR AU MENU');
        if (!disconnectReturnTimer) {
          disconnectReturnTimer = setTimeout(() => {
            disconnectReturnTimer = null;
            closeNetwork();
            st = 'menu';
          }, 1800);
        }
      }
      netStatus = 'CONNEXION FERMEE';
    });
    guestConn.on('error', () => {
      clearTimeout(connTimeout);
      netStatus = 'SALON INTROUVABLE';
    });
  }

  function handleNetData(d) {
    if (!d || typeof d !== 'object') return;
    if (d.type === 'kicked') {
      closeNetwork();
      st = 'online';
      onlineSub = 'lobby';
      netStatus = 'EXCLUS : ' + (d.reason || 'TRICHE DETECTEE');
      tone(130, 0.35, 'sawtooth');
      return;
    }
    if (d.type === 'full') {
      netStatus = 'SALON DEJA COMPLET !';
      onlineSub = 'lobby';
      tone(150, 0.25, 'sawtooth');
    } else if (d.type === 'lobby_state') {
      roomRoster = Array.isArray(d.roster) ? d.roster : [];
      onlineCapacity = d.max || onlineCapacity;
      if (typeof d.mode === 'number') mode = d.mode;
      const me = roomRoster.find(r => r.peerId === (peer && peer.id));
      if (me) mySlot = me.slot;
      netStatus = `SALON (${roomRoster.length}/${onlineCapacity}) - EN ATTENTE...`;
    } else if (d.type === 'start') {
      clearPendingTimers();
      roomRoster = Array.isArray(d.roster) ? d.roster : [];
      const me = roomRoster.find(r => r.peerId === (peer && peer.id));
      if (me) mySlot = me.slot;
      mode = typeof d.mode === 'number' ? d.mode : mode;
      roomInputEl.style.display = 'none';
      nickInputEl.style.display = 'none';
      startGame(true);
    } else if (d.type === 'aim') {
      if (!isMyNetTurn() && st === 'aim' && validateNetPacket(d)) {
        if (validSkinIdx(d.skin) >= 0) remoteSkin = d.skin;
        px = clamp(d.px, LL + BR + 4, LR - BR - 4);
        if (ball) ball.x = px;
        aimLock = d.aimLock;
        aimA = clamp(d.aimA, -0.42, 0.42);
        power = clamp(d.power, 0, 1);
      }
    } else if (d.type === 'launch') {
      if (!isMyNetTurn() && st === 'aim' && ball && validateNetPacket(d)) {
        netSec.turnLaunchSeen = true;
        if (validSkinIdx(d.skin) >= 0) remoteSkin = d.skin;
        px = clamp(d.px, LL + BR + 4, LR - BR - 4);
        ball.x = px;
        ball.y = 735;
        const safePow = clamp(d.power, 0, 1);
        const safeAng = clamp(d.aimA, -0.42, 0.42);
        const s = 7.2 + safePow * 9.2;
        ball.vx = Math.sin(safeAng) * s;
        ball.vy = -Math.cos(safeAng) * s;
        ball.spin = clamp(d.spin || 0, -1, 1);
        ball.rolling = true;
        aimA = safeAng;
        power = safePow;
        netSec.lastLaunchMeta = { pow: safePow, ang: safeAng };
        st = 'roll';
        settleT = 0;
        sb = pins.filter(p => !p.gone).length;
        tone(180, 0.35, 'sawtooth', 0.08, -100);
        const isActuallyPerfect = safePow > 0.86 && safePow < 0.98;
        if (d.perfect && isActuallyPerfect) {
          say('PUISSANCE PARFAITE', '#0f8', 55, !FIN ? '+25 PTS BONUS' : 'TRAJECTOIRE OPTIMALE');
          if (!FIN && PL[cp]) PL[cp].bonus += 25;
        }
      }
    } else if (d.type === 'roll_sync') {
      if (!isMyNetTurn() && st === 'roll' && ball && ball.rolling && validateNetPacket(d)) {
        // Lissage anti-téléportation : limite les écarts brusques
        const maxJump = 48;
        if (Math.hypot(d.bx - ball.x, d.by - ball.y) < maxJump) {
          ball.x = clamp(d.bx, LL - 24, LR + 24);
          ball.y = clamp(d.by, 20, 745);
          ball.vx = clamp(d.vx, -18, 18);
          ball.vy = clamp(d.vy, -18, 4);
          ball.spin = clamp(d.spin, -1, 1);
        }
      }
    } else if (d.type === 'throw_res') {
      if (!isMyNetTurn() && validateNetPacket(d)) {
        netSec.turnResSeen = true;
        if (st === 'roll') {
          endThrow(d);
        } else if (st === 'between') {
          pins.forEach((p, idx) => {
            if (d.pins && d.pins[idx]) {
              p.down = !!d.pins[idx].down;
              p.gone = !!d.pins[idx].gone;
            }
          });
        }
      }
    } else if (d.type === 'rematch') {
      if (netRole === 'guest') {
        startGame(true);
      }
    }
  }

  function commitNickField(fallback = 'JOUEUR') {
    myNick = sanitizeNick(nickInputEl.value, fallback);
    nickInputEl.value = myNick;
    stats.nick = myNick;
    saveStats();
    sendPresencePing();
  }

  function hostRoom() {
    commitNickField('JOUEUR 1');
    closeNetwork();
    if (onlineCapacity === 1) {
      netRole = 'host';
      mySlot = 0;

    });

        });

          removeRoomFromFirebase(roomCode);

  function rack() {

        pins.push({
          id: num++,
          row: i,
          col: j,
          x, y, ox: x, oy: y,
          vx: 0, vy: 0,
          down: false,
          gone: false,
          hit: false,
          imp: 0,
          ang: 0,
          dir: 1,

  function setBumpers() {

      bumpers.push({
        cx: 240,
        x: 240,
        y,

  function planBotShot() {
    const cfg = BOT_LEVELS[botDiff];
    const standing = pins.filter(p => !p.gone);
    let targetX = 240;

    if (standing.length === 10) {
      targetX = 250;
    } else if (standing.length > 0) {
      targetX = standing.reduce((acc, p) => acc + p.ox, 0) / standing.length;
    }

    const randErr = () => (Math.random() - 0.5) * 2;
    const chosenPx = clamp(targetX + randErr() * cfg.errPos * 0.6, LL + BR + 12, LR - BR - 12);
    const dx = targetX - chosenPx;
    const dy = 250 - 735;
    const idealAngle = clamp(Math.atan2(dx, -dy) + randErr() * cfg.errAng, -0.38, 0.38);
    const idealPower = clamp(0.91 + randErr() * cfg.errPow, 0.5, 0.99);
    const idealSpin = clamp((-idealAngle * 0.95 + randErr() * (1 - cfg.spinSkill) * 0.5) * cfg.spinSkill, -0.85, 0.85);

    botPlan = {
      timer: 0,
      targetPx: chosenPx,
      targetAng: idealAngle,
      targetPow: idealPower,
      targetSpin: idealSpin,
      phase: 'move'
    };
  }

  function burst(x, y, n, col, s = 4) {
    const maxParts = isTouchDevice ? 45 : 90;
    if (parts.length > maxParts) parts.splice(0, parts.length - maxParts);
    const count = Math.min(n, isTouchDevice ? 9 : 16);

      parts.push({
        x, y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v,

  function launch() {

      });

  }

  function collide(a, b, ma, mb, e) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const d = Math.hypot(dx, dy);
    const R = a.r + b.r;
    if (d >= R || d === 0) return 0;

    const nx = dx / d;
    const ny = dy / d;
    const ov = R - d;
    const tm = ma + mb;

    a.x -= nx * ov * mb / tm;
    a.y -= ny * ov * mb / tm;
    b.x += nx * ov * ma / tm;
    b.y += ny * ov * ma / tm;

    const vn = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
    if (vn > 0) {
      const j = (1 + e) * vn / (1 / ma + 1 / mb);
      a.vx -= j * nx / ma;
      a.vy -= j * ny / ma;
      b.vx += j * nx / mb;
      b.vy += j * ny / mb;
      return vn;
    }
    return 0.01;
  }

  function checkSplit(standing) {
    if (standing.length < 2 || standing.length > 4) return false;
    const headPinUp = standing.some(p => p.id === 1);
    if (headPinUp) return false;
    let maxDist = 0;
    for (let i = 0; i < standing.length; i++) {
      for (let j = i + 1; j < standing.length; j++) {
        const d = Math.hypot(standing[i].ox - standing[j].ox, standing[i].oy - standing[j].oy);
        if (d > maxDist) maxDist = d;
      }
    }
    return maxDist >= 68;
  }

  function triggerSweeper(resetRack) {
    sweeper.active = true;
    sweeper.t = 0;
    sweeper.resetRack = resetRack;
    sweeper.cleared = false;
  }

  function endThrow(netOverride = null) {
    if (netOverride && netOverride.pins) {
      pins.forEach((p, idx) => {
        if (netOverride.pins[idx]) {
          p.down = netOverride.pins[idx].down;
          p.gone = netOverride.pins[idx].gone;
        }
      });
      gutter = !!netOverride.gutter;
    } else if (playType === 'online' && isMyNetTurn()) {
      netSend({
        type: 'throw_res',
        gutter,
        pins: pins.map(p => ({ down: p.down, gone: p.gone }))
      });
    }

    const dn = pins.filter(p => p.down && !p.gone);
    const n = dn.length;
    const standing = pins.filter(p => !p.down && !p.gone);
    const left = standing.length;
    const pl = PL[cp];
    if (!pl) return;

    pl.rolls.push(n);
    fr.push(n);

    let done = false;
    let reset = false;

    if (FIN && fi === NF - 1) {
      const t = fr.length, a = fr[0];
      if (t === 1) {
        reset = a === 10;
        done = false;
      } else if (t === 2) {
        if (a === 10) {
          reset = fr[1] === 10;
          done = false;
        } else if (a + fr[1] === 10) {
          reset = true;
          done = false;
        } else {
          done = true;
        }
      } else {
        done = true;
      }
    } else {
      done = left === 0 || fr.length === 2;
    }

    const isStrike = sb === 10 && n === 10;
    const isSpare = !isStrike && sb < 10 && left === 0;

    if (isStrike) {
      pl.strikes++;
      pl.streak++;
      if (pl.streak > pl.bestStreak) pl.bestStreak = pl.streak;
      if (np === 1) {
        stats.strikes++;
        if (pl.streak > stats.maxStreak) stats.maxStreak = pl.streak;
      }

      const streakNames = ['', 'STRIKE !!!', 'DOUBLE STRIKE !!', 'TURKEY !!!', 'FOUR BAGGER !!', 'MEGA STREAK !!'];
      const title = streakNames[Math.min(pl.streak, streakNames.length - 1)];
      let sub = '';
      if (!FIN && pl.streak > 1) {
        const comboBonus = (pl.streak - 1) * 50;
        pl.bonus += comboBonus;
        sub = 'SERIE x' + pl.streak + ' (+' + comboBonus + ' PTS)';
      } else if (ball && ball.bumperHits > 0 && !FIN) {
        const bBonus = ball.bumperHits * 30;
        pl.bonus += bBonus;
        sub = 'RICOCHET BONUS +' + bBonus;
