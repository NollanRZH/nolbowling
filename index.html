      say(title, '#ff0', 115, sub);
      shake = 22;
      flash = 0.4;
      flashCol = '#ff00ff';
      haptic([40, 30, 60]);
      arp([523.25, 659.25, 783.99, 1046.5, 1318.5], 55, 'sawtooth', 0.075);
      for (let i = 0; i < 4; i++) {
        setTimeout(() => {
          burst(80 + Math.random() * 320, 150 + Math.random() * 230, 18, ['#f0f', '#0ff', '#ff0', '#0f8'][i % 4], 6);
        }, i * 110);
      }
    } else if (isSpare) {
      pl.spares++;
      pl.streak = 0;
      if (np === 1) stats.spares++;
      say('SPARE !', '#0ff', 95, 'BELLE RECUPERATION');
      shake = 10;
      flash = 0.28;
      flashCol = '#00ffff';
      haptic([25, 30, 35]);
      arp([440, 554.37, 659.25, 880], 65, 'square', 0.07);
      burst(240, 250, 20, '#0ff', 5);
    } else {
      if (done) {
        pl.streak = 0;
        pl.opens++;
      }
      if (n === 0) {
        say(gutter ? 'GOUTTIERE...' : 'RATE...', '#f35', 75, gutter ? 'GARDE LE CENTRE !' : '');
        tone(140, 0.38, 'sawtooth', 0.08, -85);
        haptic(45);
      } else if (!done && checkSplit(standing)) {
        const is710 = standing.length === 2 && standing.some(p => p.id === 7) && standing.some(p => p.id === 10);
        say(is710 ? 'SPLIT 7-10 !' : 'SPLIT !', '#ff6600', 85, n + ' QUILLE' + (n > 1 ? 'S' : '') + ' • BONNE CHANCE');
        arp([330, 293.66, 261.63], 70, 'triangle', 0.06);
      } else {
        say(n + (n > 1 ? ' QUILLES' : ' QUILLE'), '#fff', 55, left > 0 && !done ? left + ' RESTANTE' + (left > 1 ? 'S' : '') : '');
        tone(480 + n * 42, 0.12);
      }
    }

    if (n > 0) pop(240, 295, '+' + n, isStrike ? '#ff0' : '#0ff');

    if (!FIN && np === 1) {
      const t = total(pl);
      if (t > stats.best) stats.best = t;
    }
    saveStats();

    const oldL = level;
    let shouldResetRack = false;

    if (done) {
      fr = [];
      cp++;
      if (cp >= np) {
        cp = 0;
        fi++;
      }
      turnChg = playType === 'local' && np > 1;
      shouldResetRack = true;
      level = FIN ? 1 : 1 + Math.floor(fi / 2);
      setBumpers();
      if (level > oldL) {
        setTimeout(() => {
          if (st !== 'menu' && st !== 'over') {
            say('NIVEAU ' + level + ' !', '#f0f', 95, 'OBSTACLES & VITESSE +');
            arp([392, 493.88, 587.33, 783.99], 85, 'triangle', 0.075);
          }
        }, 750);
      }
    } else if (reset) {
      shouldResetRack = true;
    }

    triggerSweeper(shouldResetRack);
    if (ball) ball.x = -100;
    st = 'between';
    wait = 96;
  }

  function ballPins() {
    if (!ball || !ball.rolling || gutter) return;
    for (let i = 0; i < pins.length; i++) {
      const p = pins[i];
      if (p.gone) continue;
      const o = { x: p.x, y: p.y, r: PR, vx: p.vx, vy: p.vy };
      const v = collide(ball, o, 3.1, 1, 0.56);
      if (v) {
        p.x = o.x; p.y = o.y;
        const latBoost = clamp(ball.spin * 0.45, -0.45, 0.45);
        p.vx = o.vx * 0.86 + latBoost * v * 0.35;
        p.vy = o.vy * 0.92;
        ball.vx *= 0.94;
        ball.vy *= 0.95;

        if (v > 0.35) {
          p.imp += v * 0.85;
          p.wob = Math.min(3.5, Math.max(p.wob, v / 3.2));
          if (!p.hit) {
            p.hit = true;
            burst(p.x, p.y, 5, '#fff', 3.2);
            tone(280 + Math.random() * 480, 0.075, 'square', 0.055);
          }
          shake = Math.max(shake, Math.min(8, v * 0.95));
        }
      }
    }
  }

  function ballBumpers() {
    if (!ball || !ball.rolling || gutter) return;
    for (let i = 0; i < bumpers.length; i++) {
      const b = bumpers[i];
      if (b.hitCd > 0) b.hitCd--;
      const bo = { x: b.x, y: b.y, r: b.r, vx: 0, vy: 0 };
      const v = collide(ball, bo, 1, 100, 0.92);
      if (v > 0 && b.hitCd === 0) {
        b.hitCd = 14;
        ball.bumperHits++;
        if (ball.vy > -4.5) ball.vy = -6.5;
        burst(b.x, b.y, 12, '#f0f', 4.5);
        pop(b.x, b.y - 10, '+30', '#f0f');
        if (!FIN && PL[cp]) PL[cp].bonus += 30;
        tone(880, 0.12, 'sawtooth', 0.07, 220);
        haptic(18);
        shake = Math.max(shake, 6);
      }
    }
  }

  function pinPhysics() {
    const live = [];
    for (let i = 0; i < pins.length; i++) {
      if (!pins[i].gone) live.push(pins[i]);
    }
    for (let i = 0; i < live.length; i++) {
      for (let j = i + 1; j < live.length; j++) {
        const a = live[i], b = live[j];
        const A = { x: a.x, y: a.y, r: PR, vx: a.vx, vy: a.vy };
        const B = { x: b.x, y: b.y, r: PR, vx: b.vx, vy: b.vy };
        const v = collide(A, B, 1, 1, 0.64);
        if (v) {
          a.x = A.x; a.y = A.y; a.vx = A.vx; a.vy = A.vy;
          b.x = B.x; b.y = B.y; b.vx = B.vx; b.vy = B.vy;
          if (v > 0.35) {
            a.imp += v * 0.78;
            b.imp += v * 0.78;
            a.wob = Math.max(a.wob, Math.min(3.5, v / 3.2));
            b.wob = Math.max(b.wob, Math.min(3.5, v / 3.2));
          }
          if (v > 1.6) tone(240 + Math.random() * 420, 0.05, 'square', 0.03);
        }
      }
    }

    for (let i = 0; i < live.length; i++) {
      const p = live[i];
      p.x += p.vx / 3;
      p.y += p.vy / 3;
      if (p.x < 64) { p.x = 64; p.vx = Math.abs(p.vx) * 0.4; }
      if (p.x > 416) { p.x = 416; p.vx = -Math.abs(p.vx) * 0.4; }
      if (p.y < 46) { p.y = 46; p.vy = Math.abs(p.vy) * 0.4; }

      if (!p.down && (p.imp > 4.65 || Math.hypot(p.x - p.ox, p.y - p.oy) > 19.5)) {
        p.down = true;
        p.dir = p.vx < 0 ? -1 : 1;
        burst(p.x, p.y, 7, '#ff0', 3.2);
      }
      if (p.down) p.ang += (p.dir * 1.55 - p.ang) * 0.045;
      else p.wob *= 0.975;
    }
  }

  function update() {
    tk++;
    for (let i = 0; i < bumpers.length; i++) {
      const b = bumpers[i];
      b.x = b.cx + Math.sin((tk / 60) * b.sp + b.ph) * b.amp;
    }

    if (ballMenuOpen && !ballDragActive && Math.abs(ballScrollVel) > 0.15) {
      ballScrollPx = clamp(ballScrollPx + ballScrollVel, 0, lastDropdownMetrics.maxScroll);
      ballScrollVel *= 0.88;
      if (ballScrollPx <= 0 || ballScrollPx >= lastDropdownMetrics.maxScroll) {
        ballScrollVel = 0;
      }
    }

    if (shake > 0) shake *= 0.9;
    if (flash > 0) flash = Math.max(0, flash - 0.025);
    if (msgT > 0) msgT--;
    if (copiedToast > 0) copiedToast--;

    if (sweeper.active) {
      sweeper.t++;
      const half = sweeper.dur / 2;
      if (sweeper.t >= half && !sweeper.cleared) {
        sweeper.cleared = true;
        for (let i = 0; i < pins.length; i++) {
          if (pins[i].down) pins[i].gone = true;
        }
        if (sweeper.resetRack) rack();
      }
      if (sweeper.t >= sweeper.dur) {
        sweeper.active = false;
      }
    }

    if (st === 'aim' && ball) {
      if (isBotTurn() && botPlan) {
        botPlan.timer++;
        if (botPlan.phase === 'move') {
          px += (botPlan.targetPx - px) * 0.14;
          ball.x = px;
          aimPh += 0.045 * spd();
          aimA = Math.sin(aimPh) * 0.42;
          if (Math.abs(px - botPlan.targetPx) < 1.5 && botPlan.timer > 32) {
            px = botPlan.targetPx;
            ball.x = px;
            botPlan.phase = 'angle';
          }
        } else if (botPlan.phase === 'angle') {
          aimPh += 0.045 * spd();
          aimA = Math.sin(aimPh) * 0.42;
          if (Math.abs(aimA - botPlan.targetAng) < 0.035 || botPlan.timer > 110) {
            aimA = botPlan.targetAng;
            aimLock = 1;
            powPh = 0;
            tone(660, 0.08, 'square', 0.07);
            botPlan.phase = 'power';
          }
        } else if (botPlan.phase === 'power') {
          powPh += 0.072 * spd();
          power = (Math.sin(powPh - 1.57) + 1) / 2;
          if (Math.abs(power - botPlan.targetPow) < 0.045 || botPlan.timer > 185) {
            power = botPlan.targetPow;
            launch();
          }
        }
        if (playType === 'online' && netRole === 'host' && tk % 3 === 0) {
          netSend({ type: 'aim', px, aimLock, aimA, power, skin: netSkinForTurn() });
        }
      } else if (canLocalControl()) {
        if (aimLock === 0) {
          if (keys.ArrowLeft || keys.a || keys.A) px -= 4.2;
          if (keys.ArrowRight || keys.d || keys.D) px += 4.2;
          px = clamp(px, LL + BR + 4, LR - BR - 4);
          ball.x = px;
          aimPh += 0.045 * spd();
          aimA = Math.sin(aimPh) * 0.42;
        } else {
          powPh += 0.072 * spd();
          power = (Math.sin(powPh - 1.57) + 1) / 2;
        }
        if (playType === 'online' && tk % 3 === 0) {
          netSend({ type: 'aim', px, aimLock, aimA, power, skin: netSkinForTurn() });
        }
      }
    }

    if (st === 'roll' && ball) {
      settleT++;
      let steer = 0;
      if (isBotTurn() && botPlan) {
        steer = clamp((botPlan.targetSpin - ball.spin) * 2.5, -1, 1);
      } else if (canLocalControl()) {
        const kb = (keys.ArrowRight || keys.d || keys.D ? 1 : 0) - (keys.ArrowLeft || keys.a || keys.A ? 1 : 0);
        steer = kb || (steerOn ? clamp((ptrX - ball.x) / 85, -1, 1) : 0);
      }

      if (ball.rolling && !gutter) {
        if ((ball.y > 290 && canLocalControl()) || isBotTurn()) {
          ball.spin = clamp(ball.spin + steer * 0.026, -1, 1);
        }
        ball.vx += ball.spin * (ball.y > 470 ? 0.007 : 0.085);
        ball.rot += Math.hypot(ball.vx, ball.vy) * 0.045;
      }

      if (playType === 'online' && isMyNetTurn()) {
        netSyncTimer++;
        if (netSyncTimer % 2 === 0) {
          netSend({
            type: 'roll_sync',
            bx: ball.x,
            by: ball.y,
            vx: ball.vx,
            vy: ball.vy,
            spin: ball.spin
          });
        }
      }

      for (let s = 0; s < 3; s++) {
        if (ball.rolling) {
          ball.x += ball.vx / 3;
          ball.y += ball.vy / 3;

          if (!gutter && (ball.x < LL || ball.x > LR)) {
            gutter = true;
            tone(110, 0.32, 'sawtooth', 0.075, -45);
          }
          if (gutter) {
            const tx = ball.x < 240 ? LL - 17 : LR + 17;
            ball.x += ((tx - ball.x) * 0.22) / 3;
            ball.vx = 0;
            if (ball.vy > -5.5) ball.vy = -5.5;
          }
          ballBumpers();
          ballPins();
        }
        pinPhysics();
      }

      for (let i = 0; i < pins.length; i++) {
        const p = pins[i];
        const k = p.down ? 0.955 : 0.98;
        p.vx *= k;
        p.vy *= k;
        p.imp *= 0.985;
      }

      ball.vx *= 0.9975;
      ball.vy *= 0.9975;
      const sp = Math.hypot(ball.vx, ball.vy);

      if (ball.rolling && (ball.y < 28 || sp < 0.4)) {
        ball.rolling = false;
        ball.x = -100;
        ball.vx = ball.vy = 0;
      }

      const calm = pins.every(p => p.gone || Math.hypot(p.vx, p.vy) < 0.15);
      if (!ball.rolling && calm) calmT++;
      else calmT = 0;

      if (playType === 'online' && !isMyNetTurn()) {
        if (settleT > 760) endThrow();
      } else if (calmT > 24 || settleT > 700) {
        endThrow();
      }
    }

    if (st === 'between') {
      wait--;
      if (wait <= 0) {
        if (FIN && fi >= NF) {
          if (np === 1) stats.games++;
          saveStats();
          st = 'over';
          overAt = tk;
          arp([523.25, 659.25, 783.99, 1046.5], 105, 'triangle', 0.08);
        } else if (turnChg) {
          turnChg = false;
          st = 'pass';
          tone(440, 0.15, 'triangle', 0.07);
        } else {
          newThrow();
        }
      }
    }

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.06;
      p.l--;
      if (p.l <= 0) parts.splice(i, 1);
    }

    for (let i = texts.length - 1; i >= 0; i--) {
      const t = texts[i];
      t.y -= 0.75;
      t.l--;
      if (t.l <= 0) texts.splice(i, 1);
    }

    if (ball && ball.rolling) {
      const sk = getActiveBallSkin();
      const stepMod = isTouchDevice ? 3 : 2;
      if (tk % stepMod === 0) {
        trails.push({ x: ball.x, y: ball.y, r: ball.r, l: 11, c: gutter ? '#f35' : sk.trail });
        if (trails.length > (isTouchDevice ? 5 : 8)) trails.shift();
        const maxParts = isTouchDevice ? 45 : 90;
        if (parts.length < maxParts) {
          parts.push({
            x: ball.x + (Math.random() - 0.5) * 8,
            y: ball.y + 8,
            vx: (Math.random() - 0.5) * 0.8,
            vy: 0.6,
            l: 14,
            c: gutter ? '#f35' : sk.trail,
            s: 2.5
          });
        }
      }
    }

    for (let i = trails.length - 1; i >= 0; i--) {
      trails[i].l--;
      if (trails[i].l <= 0) trails.splice(i, 1);
    }

    updateRollAudio();
  }

  /* ==========================================================================
     6. RENDU OPTIMISE, TROUS UNIFORMES & LISTE DES BOULES ADAPTEE
     ========================================================================== */
  const VS = 1.25, S0 = 1 / 2.2;
  function P(x, y) {
    const T = clamp((y - 40) / 700, 0, 1.05);
    const s = 1 / (1 + 1.2 * (1 - T));
    return [240 + (x - 240) * s * VS, 92 + 608 * (s - S0) / (1 - S0), s * VS];
  }

  function txt(s, x, y, size, col, al = 'center', glow = false, out = false) {
    g.font = size + 'px ' + FONT;
    g.textAlign = al;
    if (out) {
      g.lineWidth = 5;
      g.strokeStyle = '#05010f';
      g.lineJoin = 'round';
      g.strokeText(s, x, y);
    }
    g.fillStyle = col;
    if (glow && !isTouchDevice) {
      g.shadowColor = col;
      g.shadowBlur = 10;
    }
    g.fillText(s, x, y);
    if (glow && !isTouchDevice) g.shadowBlur = 0;
  }

  function quad(ctx, a, fill) {
    ctx.beginPath();
    a.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
    ctx.closePath();
    ctx.fillStyle = fill;
    ctx.fill();
  }

  function line(ctx, a, b, col, w, blur = 0) {
    ctx.strokeStyle = col;
    ctx.lineWidth = w;
    if (blur && !isTouchDevice) {
      ctx.shadowColor = col;
      ctx.shadowBlur = blur;
    }
    ctx.beginPath();
    ctx.moveTo(a[0], a[1]);
    ctx.lineTo(b[0], b[1]);
    ctx.stroke();
    if (blur && !isTouchDevice) ctx.shadowBlur = 0;
  }

  function btn(x, y, w, h, l, sel, fn, sz = 9, c = '#0ff', locked = false, noTapSelect = false) {
    hits.push({ x, y, w, h, fn, noTapSelect });
    const hv = mx >= x && mx <= x + w && my >= y && my <= y + h;
    g.fillStyle = locked ? '#ffffff08' : (sel ? c : (hv ? '#ffffff2c' : '#ffffff12'));
    g.fillRect(x, y, w, h);
    g.strokeStyle = locked ? '#666' : c;
    g.lineWidth = hv || sel ? 2.5 : 1.5;
    g.strokeRect(x, y, w, h);
    if (l) {
      txt(l, x + w / 2, y + h / 2 + sz / 2 - 1, sz, locked ? '#777' : (sel ? '#05010f' : '#fff'), 'center', false);
    }
  }

  function drawStandardBallHoles(ctx, r, locked = false) {
    const holes = [
      { x: -r * 0.22, y: -r * 0.38, hr: r * 0.12 },
      { x: r * 0.20, y: -r * 0.38, hr: r * 0.12 },
      { x: -r * 0.02, y: r * 0.36, hr: r * 0.145 }
    ];
    for (let i = 0; i < holes.length; i++) {
      const h = holes[i];
      ctx.fillStyle = locked ? 'rgba(220, 220, 220, 0.35)' : 'rgba(255, 255, 255, 0.45)';
      ctx.beginPath();
      ctx.arc(h.x, h.y, h.hr * 1.18, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#090212';
      ctx.beginPath();
      ctx.arc(h.x, h.y, h.hr, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function buildStaticLaneCache() {
    const off = document.createElement('canvas');
    off.width = Math.round(W * Q);
    off.height = Math.round(H * Q);
    const ctx = off.getContext('2d');
    ctx.setTransform(Q, 0, 0, Q, 0, 0);

    const bg = ctx.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0e032e');
    bg.addColorStop(0.28, '#2b0963');
    bg.addColorStop(0.55, '#190542');
    bg.addColorStop(1, '#060117');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const cx = 240, cy = 145, R = 68;
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx, cy, R, Math.PI, 0);
    ctx.closePath();
    ctx.clip();

    const sunGr = ctx.createLinearGradient(0, cy - R, 0, cy);
    sunGr.addColorStop(0, '#ffff44');
    sunGr.addColorStop(0.5, '#ff44aa');
    sunGr.addColorStop(1, '#aa00ff');
    ctx.fillStyle = sunGr;
    ctx.fillRect(cx - R, cy - R, R * 2, R);

    ctx.fillStyle = '#180542';
    for (let i = 0; i < 6; i++) {
      const y = cy - 6 - i * 10;
      ctx.fillRect(cx - R, y, R * 2, 1.5 + i * 0.45);
    }
    ctx.restore();

    ctx.strokeStyle = '#ff00ff44';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(0, 148); ctx.lineTo(45, 118); ctx.lineTo(95, 142); ctx.lineTo(140, 124); ctx.lineTo(175, 148);
    ctx.moveTo(305, 148); ctx.lineTo(345, 122); ctx.lineTo(395, 140); ctx.lineTo(440, 114); ctx.lineTo(480, 148);
    ctx.stroke();

    quad(ctx, [P(LL - 34, 40), P(LL, 40), P(LL, 740), P(LL - 34, 740)], '#04010d');
    quad(ctx, [P(LR, 40), P(LR + 34, 40), P(LR + 34, 740), P(LR, 740)], '#04010d');

    const gr = ctx.createLinearGradient(0, 92, 0, 700);
    gr.addColorStop(0, '#180747');
    gr.addColorStop(0.45, '#3b1485');
    gr.addColorStop(1, '#5d21c2');
    quad(ctx, [P(LL, 40), P(LR, 40), P(LR, 740), P(LL, 740)], gr);

    const oilGr = ctx.createLinearGradient(0, 260, 0, 740);
    oilGr.addColorStop(0, 'rgba(0, 255, 255, 0.02)');
    oilGr.addColorStop(0.5, 'rgba(0, 255, 255, 0.09)');
    oilGr.addColorStop(1, 'rgba(255, 0, 255, 0.14)');
    quad(ctx, [P(LL + 35, 470), P(LR - 35, 470), P(LR - 25, 740), P(LL + 25, 740)], oilGr);

    for (let i = 1; i < 6; i++) {
      line(ctx, P(LL + i * 50, 40), P(LL + i * 50, 740), '#ffffff18', 1);
    }

    ctx.fillStyle = '#ff0c';
    for (let i = 0; i < 7; i++) {
      const [x, y, s] = P(LL + 37.5 * (i + 1), 470 + Math.abs(i - 3) * 16);
      const z = 7 * s;
      ctx.beginPath();
      ctx.moveTo(x, y - z * 1.7);
      ctx.lineTo(x - z, y + z * 0.5);
      ctx.lineTo(x + z, y + z * 0.5);
      ctx.closePath();
      ctx.fill();
    }

    ctx.fillStyle = '#fff9';
    [1, 2, 3, 4, 5].forEach(i => {
      const [x, y, s] = P(LL + i * 50, 590);
      ctx.beginPath();
      ctx.arc(x, y, 2.3 * s, 0, 7);
      ctx.fill();
    });

    line(ctx, P(LL, 40), P(LL, 740), '#0ff', 4, 8);
    line(ctx, P(LR, 40), P(LR, 740), '#0ff', 4, 8);
    line(ctx, P(LL, 690), P(LR, 690), '#f0f', 4, 8);
    quad(ctx, [P(LL, 470), P(LR, 470), P(LR, 740), P(LL, 740)], '#ffffff09');

    const a = P(LL - 34, 40), b = P(LR + 34, 40);
    ctx.fillStyle = '#07021a';
    ctx.fillRect(a[0], 86, b[0] - a[0], a[1] - 86);
    ctx.strokeStyle = '#ff00ff88';
    ctx.lineWidth = 2;
    ctx.strokeRect(a[0], 86, b[0] - a[0], a[1] - 86);

    staticLaneCanvas = off;
  }

  function drawLane() {
    if (!staticLaneCanvas) buildStaticLaneCache();
    g.save();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.drawImage(staticLaneCanvas, 0, 0);
    g.restore();

    for (let i = 0; i < STARS.length; i++) {
      const stStar = STARS[i];
      const a = 0.35 + 0.65 * Math.abs(Math.sin(tk * 0.04 + stStar.ph));
      g.fillStyle = `rgba(255, 255, 255, ${a.toFixed(2)})`;
      g.fillRect(stStar.x, stStar.y, stStar.s, stStar.s);
    }

    g.strokeStyle = gutter ? '#ff2244cc' : '#ff00ff88';
    g.lineWidth = 2;
    for (let k = 0; k < 14; k++) {
      const y = 740 - ((k * 50 + tk * 3.2) % 700);
      if (y < 60) continue;
      [LL - 17, LR + 17].forEach(x => {
        const a = P(x - 9, y + 8), b = P(x, y), c = P(x + 9, y + 8);
        g.beginPath();
        g.moveTo(a[0], a[1]);
        g.lineTo(b[0], b[1]);
        g.lineTo(c[0], c[1]);
        g.stroke();
      });
    }

    for (let k = 0; k < 5; k++) {
      const y = 40 + ((tk * 2.4 + k * 140) % 700);
      line(g, P(LL, y), P(LR, y), '#ffffff0e', 2);
    }
  }

  function drawSweeper() {
    if (!sweeper.active) return;
    const prog = Math.sin((sweeper.t / sweeper.dur) * Math.PI);
    const wy = 160 + prog * 135;
    const left = P(LL - 10, wy);
    const right = P(LR + 10, wy);
    const h = 16 * left[2];

    g.fillStyle = '#120536';
    g.strokeStyle = '#00ffff';
    g.lineWidth = 2.5;
    g.fillRect(left[0], left[1] - h, right[0] - left[0], h);
    g.strokeRect(left[0], left[1] - h, right[0] - left[0], h);

    g.fillStyle = '#ff00ff';
    const seg = (right[0] - left[0]) / 8;
    for (let i = 0; i < 8; i += 2) {
      g.fillRect(left[0] + i * seg + 4, left[1] - h + 3, seg - 8, h - 6);
    }
  }

  function drawPin(p) {
    const [x0, y0, s] = P(p.x, p.y);
    const r = PR * s;

    g.fillStyle = 'rgba(0, 0, 0, 0.5)';
    g.beginPath();
    g.ellipse(x0, y0 + r * 0.25, r * 1.15, r * 0.45, 0, 0, 7);
    g.fill();

    g.save();
    g.translate(x0, y0);
    g.rotate(p.down ? p.ang : Math.sin(tk * 0.6) * p.wob * 0.12);
    if (p.down) g.globalAlpha = 0.88;

    const h = r * 3.45;
    const gr = g.createLinearGradient(-r, 0, r, 0);
    gr.addColorStop(0, '#c8d6e5');
    gr.addColorStop(0.4, '#ffffff');
    gr.addColorStop(1, '#8395a7');
    g.fillStyle = gr;

    g.beginPath();
    g.ellipse(0, -h * 0.34, r * 0.9, h * 0.34, 0, 0, 7);
    g.fill();
    g.beginPath();
    g.arc(0, -h * 0.84, r * 0.5, 0, 7);
    g.fill();

    g.fillStyle = '#ff1e56';
    g.beginPath();
    g.ellipse(0, -h * 0.66, r * 0.7, r * 0.2, 0, 0, 7);
    g.fill();
    g.beginPath();
    g.ellipse(0, -h * 0.58, r * 0.8, r * 0.14, 0, 0, 7);
    g.fill();

    g.restore();
  }

  function drawBumper(b) {
    const [x, y, s] = P(b.x, b.y);
    const r = b.r * s;
    const pulse = b.hitCd > 0 ? 1.25 : 1 + Math.sin(tk * 0.15) * 0.06;

    g.fillStyle = 'rgba(0,0,0,0.5)';
    g.beginPath();
    g.ellipse(x, y + r * 0.6, r * 1.15, r * 0.45, 0, 0, 7);
    g.fill();

    const gr = g.createRadialGradient(x - r * 0.3, y - r * 0.5, 2, x, y - r * 0.3, r * 1.15 * pulse);
    gr.addColorStop(0, '#ffffff');
    gr.addColorStop(0.35, b.hitCd > 0 ? '#ffff00' : '#ff44ff');
    gr.addColorStop(1, '#8800aa');
    g.fillStyle = gr;
    g.beginPath();
    g.arc(x, y - r * 0.3, r * pulse, 0, 7);
    g.fill();

    g.strokeStyle = '#fff';
    g.lineWidth = 1.5;
    g.stroke();
  }

  function drawYlaziaSurface(cx, cy, r, rotAngle, locked = false) {
    g.save();
    g.translate(cx, cy);

    const baseGr = g.createRadialGradient(-r * 0.32, -r * 0.38, r * 0.08, 0, 0, r);
    if (locked) {
      baseGr.addColorStop(0, '#555555');
      baseGr.addColorStop(0.55, '#2b2b2b');
      baseGr.addColorStop(1, '#111111');
    } else {
      baseGr.addColorStop(0, '#4f0c82');
      baseGr.addColorStop(0.45, '#1d0338');
      baseGr.addColorStop(0.85, '#090114');
      baseGr.addColorStop(1, '#19032e');
    }
    g.fillStyle = baseGr;
    g.beginPath();
    g.arc(0, 0, r, 0, Math.PI * 2);
    g.fill();

    g.save();
    g.beginPath();
    g.arc(0, 0, r * 0.99, 0, Math.PI * 2);
    g.clip();

    g.save();
    g.rotate(rotAngle);

    if (!locked) {
      const swirl1 = g.createRadialGradient(-r * 0.45, r * 0.35, r * 0.04, -r * 0.25, r * 0.25, r * 0.85);
      swirl1.addColorStop(0, 'rgba(255, 20, 175, 0.88)');
      swirl1.addColorStop(0.45, 'rgba(155, 15, 220, 0.52)');
      swirl1.addColorStop(1, 'rgba(15, 2, 30, 0)');
      g.fillStyle = swirl1;
      g.beginPath();
      g.arc(-r * 0.25, r * 0.25, r * 0.85, 0, Math.PI * 2);
      g.fill();

      const swirl2 = g.createRadialGradient(r * 0.42, -r * 0.38, r * 0.04, r * 0.35, -r * 0.25, r * 0.78);
      swirl2.addColorStop(0, 'rgba(235, 30, 210, 0.82)');
      swirl2.addColorStop(0.5, 'rgba(110, 10, 185, 0.45)');
      swirl2.addColorStop(1, 'rgba(10, 1, 22, 0)');
      g.fillStyle = swirl2;
      g.beginPath();
      g.arc(r * 0.35, -r * 0.25, r * 0.78, 0, Math.PI * 2);
      g.fill();
    }

    g.save();
    g.beginPath();
    g.moveTo(-r * 0.64, -r * 0.66);
    g.lineTo(r * 0.10, -r * 0.24);
    g.lineTo(r * 0.06, -r * 0.48);
    g.lineTo(r * 0.52, -r * 0.08);
    g.lineTo(r * 0.46, -r * 0.28);
    g.lineTo(r * 0.86, r * 0.24);
    g.lineTo(r * 0.30, -r * 0.04);
    g.lineTo(r * 0.34, r * 0.16);
    g.lineTo(-r * 0.10, -r * 0.18);
    g.lineTo(-r * 0.05, r * 0.02);
    g.closePath();

    const boltGr = g.createLinearGradient(-r * 0.5, -r * 0.6, r * 0.8, r * 0.2);
    if (locked) {
      boltGr.addColorStop(0, '#888888');
      boltGr.addColorStop(1, '#444444');
    } else {
      boltGr.addColorStop(0, '#ff4dc4');
      boltGr.addColorStop(0.5, '#e60099');
      boltGr.addColorStop(1, '#ff1aa3');
    }
    g.fillStyle = boltGr;
    g.fill();

    g.lineJoin = 'miter';
    g.miterLimit = 4;
    g.lineWidth = Math.max(1.1, r * 0.075);
    g.strokeStyle = locked ? '#999999' : '#f4e6ff';
    g.stroke();
    g.restore();

    drawStandardBallHoles(g, r, locked);
    g.restore();

    g.save();
    g.translate(-r * 0.30, -r * 0.54);
    g.rotate(-0.38);
    const spec1 = g.createLinearGradient(0, -r * 0.12, 0, r * 0.12);
    spec1.addColorStop(0, 'rgba(255, 255, 255, 0.92)');
    spec1.addColorStop(1, 'rgba(255, 220, 255, 0.22)');
    g.fillStyle = spec1;
    g.fillRect(-r * 0.16, -r * 0.10, r * 0.32, r * 0.20);
    g.restore();

    g.restore();

    g.strokeStyle = locked ? 'rgba(130,130,130,0.4)' : 'rgba(255, 110, 230, 0.45)';
    g.lineWidth = Math.max(0.8, r * 0.04);
    g.beginPath();
    g.arc(0, 0, r, 0, Math.PI * 2);
    g.stroke();

    g.restore();
  }

  function drawBretonErmine(ctx, hx, hy, size, col) {
    ctx.fillStyle = col;
    const dotR = size * 0.21;
    ctx.beginPath();
    ctx.moveTo(hx, hy - size * 0.68);
    ctx.lineTo(hx + dotR, hy - size * 0.44);
    ctx.lineTo(hx, hy - size * 0.20);
    ctx.lineTo(hx - dotR, hy - size * 0.44);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(hx - size * 0.46, hy - size * 0.24);
    ctx.lineTo(hx - size * 0.22, hy - size * 0.36);
    ctx.lineTo(hx - size * 0.14, hy - size * 0.12);
    ctx.lineTo(hx - size * 0.38, hy - size * 0.04);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(hx + size * 0.46, hy - size * 0.24);
    ctx.lineTo(hx + size * 0.22, hy - size * 0.36);
    ctx.lineTo(hx + size * 0.14, hy - size * 0.12);
    ctx.lineTo(hx + size * 0.38, hy - size * 0.04);
    ctx.closePath();
    ctx.fill();

    ctx.beginPath();
    ctx.moveTo(hx, hy - size * 0.08);
    ctx.lineTo(hx + size * 0.38, hy + size * 0.78);
    ctx.lineTo(hx + size * 0.13, hy + size * 0.62);
    ctx.lineTo(hx, hy + size * 0.88);
    ctx.lineTo(hx - size * 0.13, hy + size * 0.62);
    ctx.lineTo(hx - size * 0.38, hy + size * 0.78);
    ctx.closePath();
    ctx.fill();
  }

  function getSpecialBallSprite(type, locked) {
    const key = `${type}_${locked ? 1 : 0}`;
    if (ballSpriteCache.has(key)) return ballSpriteCache.get(key);

    const S = 144;
    const r = 64;
    const cx = S / 2;
    const cy = S / 2;
    const off = document.createElement('canvas');
    off.width = S;
    off.height = S;
    const ctx = off.getContext('2d');

    ctx.save();
    ctx.translate(cx, cy);

    ctx.save();
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.clip();

    if (type === 'oathnet') {
      // Fond sombre violet / ardoise
      const bgGr = ctx.createRadialGradient(-r * 0.25, -r * 0.3, r * 0.1, 0, 0, r);
      bgGr.addColorStop(0, locked ? '#555555' : '#312352');
      bgGr.addColorStop(0.6, locked ? '#2c2c2c' : '#181426');
      bgGr.addColorStop(1, locked ? '#141414' : '#0b0914');
      ctx.fillStyle = bgGr;
      ctx.fillRect(-r, -r, r * 2, r * 2);

      const darkOutline = locked ? '#1f1f1f' : '#1d1c29';
      const whiteSide = locked ? '#a8a8a8' : '#ffffff';
      const sw = r * 0.68;
      const sh = r * 0.78;

      function shieldPath() {
        ctx.beginPath();
        ctx.moveTo(0, -sh);
        ctx.lineTo(sw, -sh * 0.56);
        ctx.lineTo(sw, sh * 0.14);
        ctx.quadraticCurveTo(sw * 0.94, sh * 0.66, 0, sh);
        ctx.quadraticCurveTo(-sw * 0.94, sh * 0.66, -sw, sh * 0.14);
        ctx.lineTo(-sw, -sh * 0.56);
        ctx.closePath();
      }

      // Halo violet discret derrière le bouclier
      if (!locked) {
        ctx.save();
        ctx.shadowColor = '#7b4dff';
        ctx.shadowBlur = 14;
        shieldPath();
        ctx.fillStyle = darkOutline;
        ctx.fill();
        ctx.restore();
      }

      ctx.save();
      shieldPath();
      ctx.clip();

      // Moitié droite blanche
      ctx.fillStyle = whiteSide;
      ctx.fillRect(-sw, -sh, sw * 2, sh * 2);

      // Moitié gauche violette avec pointe centrale vers la droite
      const purpGr = ctx.createLinearGradient(-sw, -sh, 0, sh);
      purpGr.addColorStop(0, locked ? '#6e6e6e' : '#653ae6');
      purpGr.addColorStop(0.55, locked ? '#4d4d4d' : '#4a23b8');
      purpGr.addColorStop(1, locked ? '#323232' : '#321485');
      ctx.fillStyle = purpGr;
      ctx.beginPath();
      ctx.moveTo(-sw, -sh);
      ctx.lineTo(0, -sh);
      ctx.lineTo(0, -sh * 0.16);
      ctx.lineTo(sw * 0.18, 0);
      ctx.lineTo(0, sh * 0.16);
      ctx.lineTo(0, sh);
      ctx.lineTo(-sw, sh);
      ctx.closePath();
      ctx.fill();

      // Ligne centrale sombre brisée entre le violet et le blanc
      ctx.strokeStyle = darkOutline;
      ctx.lineWidth = r * 0.085;
      ctx.lineJoin = 'miter';
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, -sh);
      ctx.lineTo(0, -sh * 0.16);
      ctx.lineTo(sw * 0.18, 0);
      ctx.lineTo(0, sh * 0.16);
      ctx.lineTo(0, sh);
      ctx.stroke();

      // 3 pistes de circuit imprimé à gauche (avec cercles)
      const nodes = [
        { y: -sh * 0.25, nx: -sw * 0.36 },
        { y: 0, nx: -sw * 0.28 },
        { y: sh * 0.25, nx: -sw * 0.36 }
      ];
      const nodeR = r * 0.075;
      nodes.forEach(n => {
        ctx.strokeStyle = darkOutline;
        ctx.lineWidth = r * 0.07;
        ctx.beginPath();
        ctx.moveTo(-sw, n.y);
        ctx.lineTo(n.nx - nodeR * 0.85, n.y);
        ctx.stroke();

        ctx.fillStyle = locked ? '#585858' : '#572fd1';
        ctx.beginPath();
        ctx.arc(n.nx, n.y, nodeR, 0, Math.PI * 2);
        ctx.fill();
        ctx.lineWidth = r * 0.062;
        ctx.stroke();
      });

      // Fissures / éclairs sombres sur la partie droite blanche
      ctx.strokeStyle = darkOutline;
      ctx.lineWidth = r * 0.072;
      ctx.lineJoin = 'miter';
      ctx.lineCap = 'round';

      // Fissure haute
      ctx.beginPath();
      ctx.moveTo(sw * 0.56, -sh * 0.65);
      ctx.lineTo(sw * 0.28, -sh * 0.34);
      ctx.lineTo(sw * 0.25, -sh * 0.20);
      ctx.stroke();

      // Fissure principale diagonale à droite
      ctx.beginPath();
      ctx.moveTo(sw, -sh * 0.10);
      ctx.lineTo(sw * 0.52, -sh * 0.08);
      ctx.lineTo(sw * 0.42, sh * 0.05);
      ctx.lineTo(sw * 0.22, sh * 0.07);
      ctx.lineTo(sw * 0.14, sh * 0.26);
      ctx.stroke();

      ctx.restore();

      // Contour extérieur épais du bouclier
      shieldPath();
      ctx.strokeStyle = darkOutline;
      ctx.lineWidth = r * 0.095;
      ctx.lineJoin = 'round';
      ctx.stroke();
    } else if (type === 'coralens') {
      const cGr = ctx.createRadialGradient(-r * 0.28, -r * 0.32, r * 0.08, 0, 0, r);
      cGr.addColorStop(0, locked ? '#888888' : '#ffb870');
      cGr.addColorStop(0.5, locked ? '#555555' : '#ff6f1e');
      cGr.addColorStop(1, locked ? '#222222' : '#7a2200');
      ctx.fillStyle = cGr;
      ctx.fillRect(-r, -r, r * 2, r * 2);

      const apR = r * 0.72;
      const innerR = apR * 0.46;
      const bladeCol = locked ? '#d0d0d0' : '#ffffff';
      const lineCol = locked ? '#333333' : '#6e1e00';

      ctx.save();
      ctx.strokeStyle = bladeCol;
      ctx.lineWidth = r * 0.048;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.arc(0, 0, apR, 0.52, Math.PI * 2 - 0.52);
      ctx.stroke();

      ctx.lineWidth = r * 0.032;
      ctx.beginPath();
      ctx.arc(0, 0, apR * 0.89, 0.55, Math.PI * 2 - 0.55);
      ctx.stroke();

      const numBlades = 7;
      const startA = 0.62;
      const endA = Math.PI * 2 - 0.58;
      const stepA = (endA - startA) / numBlades;

      for (let b = 0; b < numBlades; b++) {
        const a1 = startA + b * stepA;
        const a2 = a1 + stepA * 0.94;
        const ia1 = a1 - 0.32;
        const ia2 = a2 - 0.32;

        const rOut = apR * 0.83;
        const ox1 = Math.cos(a1) * rOut;
        const oy1 = Math.sin(a1) * rOut;
        const ox2 = Math.cos(a2) * rOut;
        const oy2 = Math.sin(a2) * rOut;

        const ix1 = Math.cos(ia1) * innerR;
        const iy1 = Math.sin(ia1) * innerR;
        const ix2 = Math.cos(ia2) * innerR;
        const iy2 = Math.sin(ia2) * innerR;

        ctx.beginPath();
        ctx.moveTo(ox1, oy1);
        ctx.arc(0, 0, rOut, a1, a2);
        ctx.quadraticCurveTo(
          (ox2 + ix2) * 0.52 - Math.sin(a2) * r * 0.06,
          (oy2 + iy2) * 0.52 + Math.cos(a2) * r * 0.06,
          ix2,
          iy2
        );
        ctx.arc(0, 0, innerR, ia2, ia1, true);
        ctx.quadraticCurveTo(
          (ox1 + ix1) * 0.52 - Math.sin(a1) * r * 0.06,
          (oy1 + iy1) * 0.52 + Math.cos(a1) * r * 0.06,
          ox1,
          oy1
        );
        ctx.closePath();

        ctx.fillStyle = bladeCol;
        ctx.fill();
        ctx.strokeStyle = lineCol;
        ctx.lineWidth = r * 0.028;
        ctx.stroke();
      }
      ctx.restore();
    } else if (type === 'nebula') {
      const nGr = ctx.createRadialGradient(-r * 0.25, -r * 0.25, r * 0.05, 0, 0, r);
      nGr.addColorStop(0, locked ? '#777' : '#ff85a1');
      nGr.addColorStop(0.45, locked ? '#444' : '#7209b7');
      nGr.addColorStop(1, locked ? '#1a1a1a' : '#120326');
      ctx.fillStyle = nGr;
      ctx.fillRect(-r, -r, r * 2, r * 2);

      ctx.strokeStyle = locked ? 'rgba(200,200,200,0.2)' : 'rgba(72, 202, 228, 0.55)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.62, 0.2, Math.PI * 1.45);
      ctx.stroke();
    } else if (type === 'lava') {
      const lGr = ctx.createRadialGradient(0, 0, r * 0.1, 0, 0, r);
      lGr.addColorStop(0, locked ? '#888' : '#ffea00');
      lGr.addColorStop(0.45, locked ? '#555' : '#ff5400');
      lGr.addColorStop(1, locked ? '#1c1c1c' : '#2b040c');
      ctx.fillStyle = lGr;
      ctx.fillRect(-r, -r, r * 2, r * 2);

      ctx.strokeStyle = locked ? '#222' : '#180206';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(-r * 0.8, -r * 0.2);
      ctx.lineTo(-r * 0.2, r * 0.05);
      ctx.lineTo(r * 0.35, -r * 0.35);
      ctx.lineTo(r * 0.85, r * 0.15);
      ctx.stroke();
    } else if (type === 'ice') {
      const iGr = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.05, 0, 0, r);
      iGr.addColorStop(0, locked ? '#999' : '#ffffff');
      iGr.addColorStop(0.5, locked ? '#555' : '#48cae4');
      iGr.addColorStop(1, locked ? '#222' : '#023e8a');
      ctx.fillStyle = iGr;
      ctx.fillRect(-r, -r, r * 2, r * 2);

      ctx.strokeStyle = locked ? 'rgba(255,255,255,0.2)' : 'rgba(255, 255, 255, 0.55)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-r * 0.55, -r * 0.55);
      ctx.lineTo(r * 0.55, r * 0.55);
      ctx.moveTo(r * 0.55, -r * 0.55);
      ctx.lineTo(-r * 0.55, r * 0.55);
      ctx.stroke();
    } else if (type === 'france' || type === 'mexique') {
      const leftCol = locked ? '#444444' : (type === 'france' ? '#0047ab' : '#006847');
      const midCol = locked ? '#888888' : '#f8f9fa';
      const rightCol = locked ? '#555555' : (type === 'france' ? '#e62e2d' : '#ce1126');

      ctx.fillStyle = midCol;
      ctx.fillRect(-r, -r, r * 2, r * 2);

      ctx.fillStyle = leftCol;
      ctx.beginPath();
      ctx.moveTo(-r, -r);
      ctx.lineTo(-r * 0.34, -r);
      ctx.quadraticCurveTo(-r * 0.24, 0, -r * 0.34, r);
      ctx.lineTo(-r, r);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = rightCol;
      ctx.beginPath();
      ctx.moveTo(r, -r);
      ctx.lineTo(r * 0.34, -r);
      ctx.quadraticCurveTo(r * 0.24, 0, r * 0.34, r);
      ctx.lineTo(r, r);
      ctx.closePath();
      ctx.fill();

      if (type === 'mexique') {
        ctx.fillStyle = locked ? '#666666' : '#c8962e';
        ctx.beginPath();
        ctx.arc(0, -r * 0.02, r * 0.17, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = locked ? '#444444' : '#006847';
        ctx.lineWidth = r * 0.075;
        ctx.beginPath();
        ctx.arc(0, r * 0.03, r * 0.22, 0.25, Math.PI - 0.25);
        ctx.stroke();
      }
    } else if (type === 'pologne') {
      ctx.fillStyle = locked ? '#888888' : '#f8f9fb';
      ctx.fillRect(-r, -r, r * 2, r);
      ctx.fillStyle = locked ? '#484848' : '#dc143c';
      ctx.fillRect(-r, 0, r * 2, r);
    } else if (type === 'bretagne') {
      const blackB = locked ? '#252525' : '#0b0b0f';
      const whiteB = locked ? '#929292' : '#ffffff';

      ctx.fillStyle = whiteB;
      ctx.fillRect(-r, -r, r * 2, r * 2);

      const bandH = (r * 2) / 9;
      ctx.fillStyle = blackB;
      for (let bIdx = 0; bIdx < 9; bIdx += 2) {
        ctx.fillRect(-r, -r + bIdx * bandH, r * 2.02, bandH + 0.5);
      }

      const cantX = -r;
      const cantY = -r;
      const cantW = r * 1.04;
      const cantH = bandH * 5;
      ctx.fillStyle = whiteB;
      ctx.fillRect(cantX, cantY, cantW, cantH);

      ctx.strokeStyle = locked ? '#555555' : 'rgba(0,0,0,0.22)';
      ctx.lineWidth = 1.2;
      ctx.strokeRect(cantX, cantY, cantW, cantH);

      const hSize = r * 0.135;
      [0.22, 0.44, 0.66, 0.88].forEach(fx => {
        drawBretonErmine(ctx, cantX + cantW * fx, cantY + cantH * 0.21, hSize, blackB);
      });
      [0.33, 0.55, 0.77].forEach(fx => {
        drawBretonErmine(ctx, cantX + cantW * fx, cantY + cantH * 0.52, hSize, blackB);
      });
      [0.22, 0.44, 0.66, 0.88].forEach(fx => {
        drawBretonErmine(ctx, cantX + cantW * fx, cantY + cantH * 0.82, hSize, blackB);
      });
    } else if (type === 'rennes') {
      const redSR = locked ? '#666666' : '#d5001c';
      const blkSR = locked ? '#222222' : '#0f0f13';
      const whtSR = locked ? '#999999' : '#ffffff';
      const gldSR = locked ? '#888888' : '#f4c430';

      const stripeW = (r * 2) / 5;
      for (let sIdx = 0; sIdx < 5; sIdx++) {
        ctx.fillStyle = sIdx % 2 === 0 ? redSR : blkSR;
        ctx.fillRect(-r + sIdx * stripeW, -r, stripeW + 0.5, r * 2);
      }

      const ew = r * 0.56;
      const eh = r * 0.64;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(-ew, -eh * 0.82);
      ctx.lineTo(ew, -eh * 0.82);
      ctx.lineTo(ew, eh * 0.12);
      ctx.quadraticCurveTo(ew, eh * 0.68, 0, eh * 0.96);
      ctx.quadraticCurveTo(-ew, eh * 0.68, -ew, eh * 0.12);
      ctx.closePath();

      ctx.save();
      ctx.clip();
      ctx.fillStyle = redSR;
      ctx.fillRect(-ew, -eh, ew, eh * 2);
      ctx.fillStyle = blkSR;
      ctx.fillRect(0, -eh, ew, eh * 2);

      ctx.fillStyle = whtSR;
      ctx.fillRect(-ew, -eh * 0.82, ew * 2, eh * 0.44);

      drawBretonErmine(ctx, -ew * 0.52, -eh * 0.59, r * 0.095, blkSR);
      drawBretonErmine(ctx, 0, -eh * 0.59, r * 0.095, blkSR);
      drawBretonErmine(ctx, ew * 0.52, -eh * 0.59, r * 0.095, blkSR);

      ctx.fillStyle = whtSR;
      ctx.beginPath();
      ctx.arc(0, eh * 0.24, r * 0.21, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = blkSR;
      ctx.lineWidth = 2.2;
      ctx.stroke();

      ctx.fillStyle = blkSR;
      ctx.beginPath();
      ctx.arc(0, eh * 0.24, r * 0.075, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      ctx.strokeStyle = gldSR;
      ctx.lineWidth = 4.5;
      ctx.stroke();
      ctx.strokeStyle = whtSR;
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.restore();
    } else if (type === 'nc') {
      const blueNC = locked ? '#3b3b3b' : '#0035ad';
      const redNC = locked ? '#585858' : '#ed2939';
      const greenNC = locked ? '#464646' : '#009543';
      const sunNC = locked ? '#888888' : '#ffd200';
      const inkNC = locked ? '#1c1c1c' : '#111115';

      const third = (r * 2) / 3;
      ctx.fillStyle = blueNC;
      ctx.fillRect(-r, -r, r * 2, third + 0.5);
      ctx.fillStyle = redNC;
      ctx.fillRect(-r, -r + third, r * 2, third + 0.5);
      ctx.fillStyle = greenNC;
      ctx.fillRect(-r, -r + third * 2, r * 2, third + 0.5);

      const sx = -r * 0.16;
      const sy = 0;
      const sr = r * 0.46;

      ctx.fillStyle = sunNC;
      ctx.beginPath();
      ctx.arc(sx, sy, sr, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = inkNC;
      ctx.lineWidth = r * 0.075;
      ctx.stroke();

      ctx.strokeStyle = inkNC;
      ctx.lineCap = 'round';
      ctx.lineWidth = r * 0.08;
      ctx.beginPath();
      ctx.moveTo(sx, sy - sr * 0.85);
      ctx.lineTo(sx, sy + sr * 0.88);
      ctx.stroke();

      ctx.fillStyle = inkNC;
      ctx.beginPath();
      ctx.moveTo(sx, sy - sr * 0.86);
      ctx.lineTo(sx - sr * 0.22, sy - sr * 0.46);
      ctx.lineTo(sx + sr * 0.22, sy - sr * 0.46);
      ctx.closePath();
      ctx.fill();

      ctx.beginPath();
      ctx.arc(sx, sy - sr * 0.12, sr * 0.20, 0, Math.PI * 2);
      ctx.arc(sx, sy + sr * 0.30, sr * 0.24, 0, Math.PI * 2);
      ctx.fill();

      ctx.lineWidth = r * 0.065;
      ctx.beginPath();
      ctx.moveTo(sx - sr * 0.36, sy - sr * 0.30);
      ctx.lineTo(sx + sr * 0.36, sy - sr * 0.30);
      ctx.moveTo(sx - sr * 0.42, sy + sr * 0.62);
      ctx.quadraticCurveTo(sx, sy + sr * 0.48, sx + sr * 0.42, sy + sr * 0.62);
      ctx.stroke();
    }

    drawStandardBallHoles(ctx, r, locked);
    ctx.restore();

    const shadeGr = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
    shadeGr.addColorStop(0, 'rgba(255, 255, 255, 0.36)');
    shadeGr.addColorStop(0.55, 'rgba(0, 0, 0, 0)');
    shadeGr.addColorStop(1, 'rgba(0, 0, 0, 0.54)');
    ctx.fillStyle = shadeGr;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = 'rgba(255, 255, 255, 0.82)';
    ctx.beginPath();
    ctx.ellipse(-r * 0.32, -r * 0.48, r * 0.20, r * 0.10, -0.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = locked ? 'rgba(130,130,130,0.4)' : 'rgba(255, 255, 255, 0.52)';
    ctx.lineWidth = 2.4;
    ctx.beginPath();
    ctx.arc(0, 0, r - 1, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
    ballSpriteCache.set(key, off);
    return off;
  }

  function drawSpecialBallSurface(cx, cy, r, rotAngle, type, locked = false) {
    const sprite = getSpecialBallSprite(type, locked);
    const scale = (r * 2) / 128;
    g.save();
    g.translate(cx, cy);
    g.rotate(rotAngle);
    g.drawImage(sprite, -72 * scale, -72 * scale, 144 * scale, 144 * scale);
    g.restore();
  }

  function drawSkinPreview(sk, cx, cy, r, locked, rotAngle = 0) {
    if (sk.id === 'ylazia') {
      drawYlaziaSurface(cx, cy, r, rotAngle, locked);
      return;
    }
    if (['oathnet', 'coralens', 'nebula', 'lava', 'ice', 'france', 'mexique', 'pologne', 'bretagne', 'rennes', 'nc'].includes(sk.id)) {
      drawSpecialBallSurface(cx, cy, r, rotAngle, sk.id, locked);
      return;
    }
    const gr = g.createRadialGradient(cx - r * 0.35, cy - r * 0.35, r * 0.1, cx, cy, r);
    gr.addColorStop(0, locked ? '#777' : sk.c1);
    gr.addColorStop(0.42, locked ? '#444' : sk.c2);
    gr.addColorStop(1, locked ? '#222' : sk.c3);
    g.fillStyle = gr;
    g.beginPath();
    g.arc(cx, cy, r, 0, Math.PI * 2);
    g.fill();

    g.save();
    g.translate(cx, cy);
    g.rotate(rotAngle);
    drawStandardBallHoles(g, r, locked);
    g.restore();
  }

  function drawBall() {
    if (!ball || !isFinite(ball.x) || !isFinite(ball.y) || ball.x < 0) return;
    const sk = getActiveBallSkin();

    for (let i = 0; i < trails.length; i++) {
      const tr = trails[i];
      const [tx, ty, ts] = P(tr.x, tr.y);
      const rad = tr.r * ts * (tr.l / 14) * 0.85;
      g.globalAlpha = (tr.l / 14) * 0.32;
      g.fillStyle = tr.c;
      g.beginPath();
      g.arc(tx, ty - rad * 0.3, rad, 0, 7);
      g.fill();
    }
    g.globalAlpha = 1;

    const [x, y, s] = P(ball.x, ball.y);
    const r = BR * s;

    g.fillStyle = sk.id === 'ylazia' ? 'rgba(95, 8, 120, 0.55)' : 'rgba(0, 0, 0, 0.55)';
    g.beginPath();
    g.ellipse(x, y + r * 0.7, r * 1.18, r * 0.46, 0, 0, 7);
    g.fill();

    if (sk.id === 'ylazia') {
      drawYlaziaSurface(x, y - r * 0.3, r, ball.rot * 0.45 + ball.spin * 0.5, false);
      return;
    }

    if (['oathnet', 'coralens', 'nebula', 'lava', 'ice', 'france', 'mexique', 'pologne', 'bretagne', 'rennes', 'nc'].includes(sk.id)) {
      drawSpecialBallSurface(x, y - r * 0.3, r, ball.rot * 0.45 + ball.spin * 0.5, sk.id, false);
      return;
    }

    const gr = g.createRadialGradient(x - r * 0.35, y - r * 0.8, 2, x, y - r * 0.3, r * 1.2);
    gr.addColorStop(0, sk.c1);
    gr.addColorStop(0.32, sk.c2);
    gr.addColorStop(1, sk.c3);
    g.fillStyle = gr;
    g.beginPath();
    g.arc(x, y - r * 0.3, r, 0, 7);
    g.fill();

    g.save();
    g.translate(x, y - r * 0.3);
    g.rotate(ball.rot + ball.spin * 0.6);
    drawStandardBallHoles(g, r, false);
    g.restore();
  }

  function drawAim() {
    if (!ball) return;
    const dx = Math.sin(aimA), dy = -Math.cos(aimA);
    const col = aimLock ? '#ff0' : '#0f8';
    const pts = [];

    g.fillStyle = col;
    for (let i = 1; i <= 14; i++) {
      const wy = ball.y + dy * i * 22;
      if (wy < 60) break;
      const [x, y, s] = P(ball.x + dx * i * 22, wy);
      pts.push([x, y - 4]);
      if (i < 14) {
        g.beginPath();
        g.arc(x, y - 4, Math.max(1.5, (3.6 - i * 0.1) * s * 1.1), 0, 7);
        g.fill();
      }
    }

    if (pts.length > 2) {
      const a = pts[pts.length - 2];
      const b = pts[pts.length - 1];
      const an = Math.atan2(b[1] - a[1], b[0] - a[0]);
      g.save();
      g.translate(b[0], b[1]);
      g.rotate(an);
      g.beginPath();
      g.moveTo(10, 0);
      g.lineTo(-5, -7);
      g.lineTo(-5, 7);
      g.closePath();
      g.fill();
      g.restore();
    }
  }

    g.fillRect(rx, ry, rw, rh);

    [
      '1. PLACE LA BOULE • 2. BLOQUE L ANGLE',

    ].forEach((s, i) => txt(s, W / 2, 688 + i * 19, 6.8, '#fff9', 'center', false));

    if (ballMenuOpen) {
      drawBallDropdown();
    }
  }

  function copyRoomCode() {
    if (!roomCode) return;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(roomCode).catch(() => {});
    } else {
      const ta = document.createElement('textarea');
      ta.value = roomCode;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }
    copiedToast = 110;
    tone(880, 0.1, 'triangle', 0.07);
    haptic(15);
  }

  function drawOnline() {
    overlay(0.93);
    txt('MULTIJOUEUR EN LIGNE', W / 2, 72, 17, '#0f8', 'center', true);
    txt(onlineCount + (onlineCount > 1 ? ' JOUEURS ACTIFS SUR LE SITE' : ' JOUEUR ACTIF SUR LE SITE'), W / 2, 98, 7, '#0ff', 'center', false);

    txt('TON PSEUDO :', W / 2, 134, 7.5, '#f0f', 'center', false);

    if (onlineSub === 'lobby') {
      txt('CREER UN SALON (' + MODES[mode].n + ') :', W / 2, 224, 7.2, '#ff0', 'center', false);
      [1, 2, 3, 4].forEach((cnt, i) => {
        btn(24 + i * 110, 236, 102, 34, cnt + (cnt === 1 ? ' JOUEUR' : ' J.'), onlineCapacity === cnt, () => {
          onlineCapacity = cnt;
          tone(540, 0.06);
        }, 7.2, '#ff0');
      });

      const createLabel = onlineCapacity === 1 ? 'LANCER SOLO EN LIGNE' : `CREER SALON (${onlineCapacity} JOUEURS)`;
      btn(40, 280, 400, 44, createLabel, true, hostRoom, 10, '#0ff');

      g.fillStyle = '#ffffff0a';
      g.fillRect(24, 342, W - 48, 250);
      g.strokeStyle = '#0f86';
      g.lineWidth = 1.5;
      g.strokeRect(24, 342, W - 48, 250);

      const rooms = getActivePublicRooms();
      const maxScroll = Math.max(0, rooms.length - 3);
      if (lobbyScroll > maxScroll) lobbyScroll = maxScroll;

      txt(`SALONS DISPO (${rooms.length})`, 144, 364, 7.5, '#0f8', 'center', false);

      btn(W - 134, 348, 102, 26, 'ACTUALISER', false, () => {
        sendPresencePing();
        syncFirebaseLobby();
        tone(520, 0.05);
      }, 6.5, '#0ff');

      if (rooms.length > 3) {
        btn(252, 348, 32, 26, '▲', false, () => {
          lobbyScroll = Math.max(0, lobbyScroll - 1);
          tone(480, 0.04);
        }, 7, '#ff0');
        btn(288, 348, 32, 26, '▼', false, () => {
          lobbyScroll = Math.min(maxScroll, lobbyScroll + 1);
          tone(480, 0.04);
        }, 7, '#ff0');
      }

      if (rooms.length === 0) {
        txt('AUCUN SALON PUBLIC POUR L INSTANT', W / 2, 445, 7, '#fff8', 'center', false);
        txt('CREE UN SALON CI-DESSUS POUR ETRE', W / 2, 470, 6.5, '#0ff9', 'center', false);
        txt('VISIBLE PAR LES AUTRES JOUEURS !', W / 2, 488, 6.5, '#0ff9', 'center', false);
      } else {
        const visible = rooms.slice(lobbyScroll, lobbyScroll + 3);
        visible.forEach((r, idx) => {
          const ry = 380 + idx * 66;
          const mName = MODES[r.mode] ? MODES[r.mode].n : 'INFINI';
          g.fillStyle = '#140842';
          g.fillRect(36, ry, W - 72, 56);
          g.strokeStyle = '#f0f8';
          g.lineWidth = 1.5;
          g.strokeRect(36, ry, W - 72, 56);

          txt(r.host || 'HOTE', 48, ry + 22, 8.5, '#fff', 'left', false);
          txt(`${mName} • ${r.count}/${r.max} JOUEURS`, 48, ry + 42, 6.5, '#ff0', 'left', false);

          btn(W - 154, ry + 10, 108, 36, 'REJOINDRE', false, () => {
            nickInputEl.style.display = 'none';
            connectToRoomCode(r.code);
          }, 7.2, '#0f8');
        });
      }

      btn(40, 606, 400, 40, 'REJOINDRE AVEC UN CODE', false, openJoinRoom, 8.5, '#f0f');
    } else if (onlineSub === 'hosting') {
      txt(`SALON ${roomRoster.length}/${onlineCapacity} • ${MODES[mode].n}`, W / 2, 226, 8.5, '#ff0', 'center', false);

      for (let i = 0; i < onlineCapacity; i++) {
        const sy = 244 + i * 44;
        const p = roomRoster[i];
        const col = PLAYER_COLORS[i % PLAYER_COLORS.length];
        g.fillStyle = p ? '#140842' : '#ffffff08';
        g.fillRect(50, sy, W - 100, 36);
        g.strokeStyle = p ? col : '#ffffff33';
        g.lineWidth = 1.5;
        g.strokeRect(50, sy, W - 100, 36);

        txt('J' + (i + 1), 64, sy + 23, 8, col, 'left', false);
        if (p) {
          txt(p.nick + (i === 0 ? ' (HOTE)' : ''), 105, sy + 23, 8, '#fff', 'left', false);
          txt('PRET', W - 64, sy + 23, 7, '#0f8', 'right', false);
        } else {
          txt('EN ATTENTE...', 105, sy + 23, 7.5, '#fff6', 'left', false);
        }
      }

      const codeY = 250 + onlineCapacity * 44;
      txt('CODE SALON : ' + (roomCode || '....'), W / 2, codeY + 14, 11, '#0ff', 'center', false);
      btn(110, codeY + 26, 260, 34, copiedToast > 0 ? 'CODE COPIE !' : 'COPIER LE CODE', false, copyRoomCode, 8, '#0f8');

      if (roomRoster.length >= 2 && roomRoster.length < onlineCapacity) {
        btn(70, codeY + 70, 340, 42, 'LANCER MAINTENANT', true, launchOnlineMatch, 9.5, '#ff0');
      } else {
        txt('DEMARRAGE AUTO DES QUE COMPLET !', W / 2, codeY + 86, 6.8, '#0f8', 'center', false);
      }
    } else if (onlineSub === 'joining') {
      txt('SAISIS LE CODE DU SALON :', W / 2, 315, 9, '#fff', 'center', false);
      btn(110, 425, 260, 48, 'CONNECTER', true, joinRoomSubmit, 12, '#0f8');
      txt(netStatus, W / 2, 505, 8, '#ff0', 'center', false);
    }

    btn(110, 668, 260, 44, 'RETOUR MENU', false, () => {
      closeNetwork();
      st = 'menu';
      tone(440, 0.06);
    }, 10, '#f0f');
  }

  function drawStats() {
    overlay(0.92);
    txt('STATISTIQUES', W / 2, 130, 22, '#0ff', 'center', true);
    txt('CARRIERE ARCADE', W / 2, 162, 9, '#f0f', 'center', false);

    const rows = [
      ['RECORD MODE INFINI', String(stats.best).padStart(5, '0'), '#ff0'],
      ['TOTAL STRIKES (X)', String(stats.strikes), '#f0f'],
      ['TOTAL SPARES (/)', String(stats.spares), '#0ff'],
      ['MEILLEURE SERIE X', String(stats.maxStreak), '#0f8'],
      ['PARTIES TERMINEES', String(stats.games), '#fff']
    ];

    rows.forEach(([label, val, col], i) => {
      const y = 235 + i * 68;
      g.fillStyle = '#ffffff0d';
      g.fillRect(36, y - 24, W - 72, 48);
      g.strokeStyle = col + '66';
      g.lineWidth = 1.5;
      g.strokeRect(36, y - 24, W - 72, 48);
      txt(label, 52, y + 4, 8, '#ddd', 'left', false);
      txt(val, W - 52, y + 6, 13, col, 'right', false);
    });

    txt('DEBLOQUE DES BOULES EN FAISANT DES STRIKES !', W / 2, 600, 7, '#ff0', 'center', false);
    btn(110, 650, 260, 50, 'RETOUR MENU', true, () => { st = 'menu'; tone(440, 0.06); }, 11, '#0ff');
  }

  function drawPass() {
    overlay(0.84);
    const col = PLAYER_COLORS[cp % PLAYER_COLORS.length];
    txt('JOUEUR ' + (cp + 1), W / 2, 320, 36, col, 'center', true);
    txt('A TOI DE JOUER !', W / 2, 376, 12, '#ff0', 'center', false);
    txt('PASSE L APPAREIL AU JOUEUR ' + (cp + 1), W / 2, 420, 8, '#fff', 'center', false);
    if (Math.floor(tk / 28) % 2 === 0) {
      txt('TOUCHE OU ESPACE POUR LANCER', W / 2, 500, 9.5, '#0ff', 'center', false);
    }
  }

  function shareScore(scoreVal) {
    const modeName = MODES[mode].n;
    const text = `NolBowling (${modeName}) : ${scoreVal} pts ! Peux-tu battre mon score ?`;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => {});
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }
    copiedToast = 110;
    tone(880, 0.1, 'triangle', 0.07);
    haptic(15);
  }

  function drawOver() {
    overlay(0.91);
    txt(FIN && fi >= NF ? 'PARTIE TERMINEE' : 'FIN DE PARTIE', W / 2, 82, 20, '#ff0', 'center', true);

    const tt = PL.length ? PL.map(total) : [0];
    const top = Math.max(...tt);
    const compact = np > 2;
    const cardH = compact ? 66 : 96;
    const gap = compact ? 74 : 114;
    const startY = compact ? 132 : 175;

    PL.forEach((p, i) => {
      const y = startY + i * gap;
      const win = np > 1 && tt[i] === top && tt.filter(v => v === top).length === 1;
      const col = PLAYER_COLORS[i % PLAYER_COLORS.length];

      g.fillStyle = '#ffffff0c';
      g.fillRect(36, y - 18, W - 72, cardH);
      g.strokeStyle = win ? '#ff0' : col + '88';
      g.lineWidth = win ? 2.5 : 1.5;
      g.strokeRect(36, y - 18, W - 72, cardH);

      if (compact) {
        txt(playerLabel(i, false), 52, y + 4, 8.5, col, 'left', false);
        txt(String(tt[i]), W - 52, y + 8, 16, win ? '#ff0' : '#fff', 'right', true);
        txt(`STRIKES: ${p.strikes} • SPARES: ${p.spares} • SERIE: ${p.bestStreak}`, 52, y + 30, 6, '#ccc', 'left', false);
      } else {
        txt(playerLabel(i, false), W / 2, y + 2, 9.5, col, 'center', false);
        txt(String(tt[i]), W / 2, y + 36, 24, win || np === 1 ? '#ff0' : '#fff', 'center', true);
        txt(`STRIKES: ${p.strikes}  •  SPARES: ${p.spares}  •  SERIE: ${p.bestStreak}`, W / 2, y + 62, 6.8, '#ccc', 'center', false);
      }
    });

    const bannerY = Math.min(510, startY + PL.length * gap + 4);
    if (np > 1) {
      let w = '';
      if (tt.filter(v => v === top).length > 1) {
        w = 'EGALITE PARFAITE !';
      } else {
        const winIdx = tt.indexOf(top);
        w = playerLabel(winIdx, false) + ' GAGNE !';
      }
      txt(w, W / 2, bannerY, 9.5, '#0f8', 'center', false);
    } else if (!FIN && total(PL[0]) >= stats.best && stats.best > 0) {
      txt('* NOUVEAU RECORD PERSONNEL ! *', W / 2, bannerY, 9, '#0f8', 'center', false);
    }

    const btnBaseY = Math.max(525, bannerY + 22);
    btn(90, btnBaseY, 300, 48, 'REJOUER', Math.floor(tk / 28) % 2 === 0, () => startGame(false), 14, '#ff0');
    btn(90, btnBaseY + 58, 300, 40, copiedToast > 0 ? 'SCORE COPIE !' : 'COPIER LE SCORE', false, () => shareScore(top), 9.5, '#0f8');
    btn(90, btnBaseY + 108, 300, 40, 'MENU PRINCIPAL', false, () => {
      if (playType === 'online') closeNetwork();
      st = 'menu';
    }, 10, '#0ff');
  }

  function draw() {
    g.setTransform(Q, 0, 0, Q, 0, 0);
    hits = [];
    g.save();

    if (shake > 0.5) {
      g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    drawLane();
    if (st === 'aim') drawAim();

    const items = [];
    for (let i = 0; i < pins.length; i++) {
      const p = pins[i];
      if (!p.gone) items.push([p.y, () => drawPin(p)]);
    }
    for (let i = 0; i < bumpers.length; i++) {
      const b = bumpers[i];
      items.push([b.y, () => drawBumper(b)]);
    }
    if (ball) items.push([ball.y, drawBall]);
    items.sort((a, b) => a[0] - b[0]);
    for (let i = 0; i < items.length; i++) items[i][1]();

    drawSweeper();

    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      const [x, y, s] = P(p.x, p.y);
      g.globalAlpha = clamp(p.l / 22, 0, 1);
      g.fillStyle = p.c;
      g.fillRect(x, y - 8 * s, p.s * s * 1.5, p.s * s * 1.5);
    }
    g.globalAlpha = 1;

    for (let i = 0; i < texts.length; i++) {
      const t = texts[i];
      const [x, y] = P(t.x, t.y);
      g.globalAlpha = clamp(t.l / 22, 0, 1);
      txt(t.t, x, y - 30, 13, t.c, 'center', false, true);
    }
    g.globalAlpha = 1;

    if (flash > 0) {
      g.fillStyle = flashCol;
      g.globalAlpha = flash * 0.35;
      g.fillRect(0, 0, W, H);
      g.globalAlpha = 1;
    }

    g.restore();

    if (st !== 'menu' && st !== 'stats' && st !== 'online') {
      hud();
      drawPinRadar();
    }

    if (msgT > 0 && st !== 'over') {
      const sc = 1 + Math.sin(msgT / 4) * 0.04 + (msgT > 85 ? (msgT - 85) * 0.025 : 0);
      g.save();
      g.translate(W / 2, 375);
      g.scale(sc, sc);
      g.globalAlpha = clamp(msgT / 18, 0, 1);
      const sz = msg.length > 10 ? (msg.length > 15 ? 15 : 20) : 28;
      txt(msg, 0, 0, sz, msgC, 'center', false, true);
      if (msgSub) {
        txt(msgSub, 0, 26, 8.5, '#fff', 'center', false, true);
      }
      g.restore();
    }

    if (st === 'menu') drawMenu();
    if (st === 'stats') drawStats();
    if (st === 'online') drawOnline();
    if (st === 'pass') drawPass();
    if (st === 'over') drawOver();
  }

  /* ==========================================================================
     7. CONTROLES PC & MOBILE (SCROLL ANTI-FAUX-TAP, CLIC/TAP & SWIPE)
     ========================================================================== */
  function cpos(e) {
    const r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return;
    mx = ((e.clientX - r.left) / r.width) * W;
    my = ((e.clientY - r.top) / r.height) * H;
  }

  function ptr(move) {
    if (!canLocalControl()) return;
    const k = P(240, ball ? ball.y : 735)[2];
    ptrX = 240 + (mx - 240) / k;
    if (move && st === 'aim' && aimLock === 0) {
      px = clamp(ptrX, LL + BR + 4, LR - BR - 4);
      if (ball) ball.x = px;
    }
    if (st === 'roll') steerOn = true;
  }

  cv.addEventListener('wheel', e => {
    if (st === 'menu' && ballMenuOpen) {
      e.preventDefault();
      ballScrollVel = 0;
      ballScrollPx = clamp(ballScrollPx + e.deltaY * 0.65, 0, lastDropdownMetrics.maxScroll);
    }
  }, { passive: false });

  cv.addEventListener('pointermove', e => {
    cpos(e);

    if (st === 'menu' && ballMenuOpen && ballDragActive) {
      const dy = my - ballDragLastY;
      const distFromStart = Math.hypot(mx - sx, my - sy);
      if (distFromStart > 14) {
        ballDragMoved = true;
        ballScrollLocked = true;
        moved = true;
      }
      if (ballScrollLocked) {
        ballScrollPx = clamp(ballScrollPx - dy, 0, lastDropdownMetrics.maxScroll);
        ballScrollVel = -dy * 0.65;
      }
      ballDragLastY = my;
      return;
    }

    if (Math.abs(mx - sx) > 10 || Math.abs(my - sy) > 10) moved = true;
    if (e.pointerType === 'mouse' || ptrDown) {
      if (!swipeMode) ptr(true);
    }
  });

  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    initAudio();
    cpos(e);
    ptrDown = true;
    sx = mx;
    sy = my;
    moved = false;
    hitBtn = false;
    swipeMode = false;
    ballDragActive = false;
    ballDragMoved = false;

    if (st === 'menu' && ballMenuOpen) {
      const m = lastDropdownMetrics;
      if (mx >= m.boxX && mx <= m.boxX + m.boxW && my >= m.listTop && my <= m.listTop + m.listH) {
        ballDragActive = true;
        ballDragLastY = my;
        ballScrollVel = 0;
        if (Math.abs(ballScrollVel) < 0.8) {
          ballScrollLocked = false;
        }
        return;
      }
    }

    for (let i = hits.length - 1; i >= 0; i--) {
      const h = hits[i];
      if (!h.fn) continue;
      if (mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h) {
        hitBtn = true;
        if (!h.noTapSelect) {
          h.fn();
        }
        return;
      }
    }

    if (st === 'menu' && ballMenuOpen) {
      ballMenuOpen = false;
      ballScrollLocked = false;
      return;
    }

    if (e.pointerType !== 'mouse' && st === 'aim' && canLocalControl() && my > 560 && my < 705) {
      swipeMode = true;
      swipeStartY = my;
      swipeStartX = mx;
      swipeTime = performance.now();
    }

    if (e.pointerType === 'mouse' && !(st === 'menu' && ballMenuOpen)) {
      ptr(true);
      action();
    } else if (st !== 'menu') {
      ptr(false);
    }
  });

  function up(e) {
    if (!ptrDown) return;
    const wasDraggingBallList = st === 'menu' && ballMenuOpen && ballDragActive;
    const didScrollOrMove = ballDragMoved || ballScrollLocked || Math.hypot(mx - sx, my - sy) > 14;
    ptrDown = false;
    ballDragActive = false;

    if (st === 'menu' && ballMenuOpen) {
      swipeMode = false;
      if (wasDraggingBallList && !didScrollOrMove) {
        for (let i = hits.length - 1; i >= 0; i--) {
          const h = hits[i];
          if (!h.fn || !h.noTapSelect) continue;
          if (mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h) {
            h.fn();
            break;
          }
        }
      }
      if (!didScrollOrMove) {
        ballScrollLocked = false;
      }
      return;
    }

    if (e.type === 'pointerup' && e.pointerType !== 'mouse' && !hitBtn) {
      if (swipeMode && st === 'aim' && canLocalControl()) {
        const dy = swipeStartY - my;
        const dx = mx - swipeStartX;
        const dt = Math.max(40, performance.now() - swipeTime);
        if (dy > 55) {
          aimA = clamp((dx / 190) * 0.42, -0.42, 0.42);
          const speed = dy / dt;
          power = clamp(0.45 + speed * 0.42, 0.4, 0.99);
          aimLock = 1;
          launch();
          swipeMode = false;
          steerOn = false;
          return;
        }
      }
      if (!moved) {
        action();
      }
    }
    swipeMode = false;
    if (e.pointerType !== 'mouse') steerOn = false;
  }

  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);

  window.addEventListener('keydown', e => {
    if (document.activeElement === nickInputEl) {
      if (e.code === 'Enter') nickInputEl.blur();
      return;
    }
    if (document.activeElement === roomInputEl) {
      if (e.code === 'Enter') joinRoomSubmit();
      return;
    }
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) {
      e.preventDefault();
    }
    if (e.code === 'Space' || e.code === 'Enter') {
      if (!e.repeat) action();
    }
    if (e.key === 'm' || e.key === 'M') {
      initAudio();
      mute = !mute;
    }
    if (e.key === 'Escape') {
      if (ballMenuOpen) { ballMenuOpen = false; return; }
      if (st === 'stats') st = 'menu';
      else if (st === 'online') { closeNetwork(); st = 'menu'; }
      else quit();
    }
    if (st === 'menu' && !e.repeat) {
      if (ballMenuOpen) {
        if (e.key === 'ArrowUp') ballScrollPx = clamp(ballScrollPx - 56, 0, lastDropdownMetrics.maxScroll);
        if (e.key === 'ArrowDown') ballScrollPx = clamp(ballScrollPx + 56, 0, lastDropdownMetrics.maxScroll);
        return;
      }
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') mrow = 1 - mrow;
      const d = (e.key === 'ArrowRight') - (e.key === 'ArrowLeft');
      if (d) {
        if (mrow === 0) mode = (mode + d + 3) % 3;
        else {
          const types = ['solo', 'bot', 'local', 'online'];
          const idx = (types.indexOf(playType) + d + 4) % 4;
          playType = types[idx];
          if (playType === 'solo') np = 1;
          else if (playType === 'bot') np = 2;
          else if (playType === 'local') np = localPlayers;
          else np = onlineCapacity;
        }
        tone(520, 0.06);
      }
    }
    keys[e.key] = true;
  });

  window.addEventListener('keyup', e => { keys[e.key] = false; });
  window.addEventListener('blur', () => {
    keys = {};
    ptrDown = false;
    steerOn = false;
    swipeMode = false;
    ballDragActive = false;
  });

  buildStaticLaneCache();
  ['oathnet', 'coralens', 'nebula', 'lava', 'ice', 'france', 'mexique', 'pologne', 'bretagne', 'rennes', 'nc'].forEach(t => {
    getSpecialBallSprite(t, false);
  });

  rack();
  newBall();
  ball.x = -100;

  let last = performance.now();
  let acc = 0;

  function loop(now) {
    const dt = Math.min(now - last, 50);
    acc += dt;
    last = now;
    let steps = 0;
    const maxSteps = isTouchDevice ? 2 : 3;
    while (acc >= 16.667 && steps < maxSteps) {
      update();
      acc -= 16.667;
      steps++;
    }
    if (steps >= maxSteps) acc = 0;
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
