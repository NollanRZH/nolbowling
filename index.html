<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04010c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NolBowling</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100dvh;
    background: #04010c;
    overflow: hidden;
    font-family: 'Press Start 2P', monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    height: 100dvh;
    width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 35%, #230754 0%, #09021c 55%, #03000a 100%);
  }
  #stage {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    box-shadow: 0 0 50px rgba(255, 0, 255, 0.35), 0 0 0 3px #ff00ff, 0 0 0 6px rgba(0, 255, 255, 0.28);
    border-radius: 16px;
    cursor: pointer;
  }
  #crt {
    position: absolute;
    inset: 0;
    pointer-events: none;
    border-radius: 16px;
    background:
      radial-gradient(circle at center, transparent 62%, rgba(0, 0, 0, 0.42) 100%),
      repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.16) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }
  .arcade-input {
    display: none;
    position: absolute;
    left: 50%;
    transform: translate(-50%, -50%);
    background: #0b0428;
    border-radius: 8px;
    font-family: 'Press Start 2P', monospace;
    text-align: center;
    text-transform: uppercase;
    outline: none;
    z-index: 30;
    user-select: text;
    -webkit-user-select: text;
    touch-action: manipulation;
    padding: 0 8px;
  }
  .arcade-input::placeholder {
    color: rgba(255, 255, 255, 0.32);
  }
  .arcade-input:focus {
    background: #140842;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="crt"></div>
    <input id="nickInput" class="arcade-input" type="text" maxlength="10" placeholder="TON PSEUDO"
      autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="done"
      style="top:21.5%;width:72%;max-width:260px;height:42px;border:2px solid #ff00ff;color:#00ffff;font-size:13px;box-shadow:0 0 18px rgba(255,0,255,0.45);">
    <input id="roomInput" class="arcade-input" type="text" maxlength="4" placeholder="CODE"
      autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" enterkeyhint="go"
      style="top:46%;width:52%;max-width:190px;height:46px;border:2px solid #00ffff;color:#ffff00;font-size:18px;box-shadow:0 0 20px rgba(0,255,255,0.45);">
  </div>
</div>
<script>
(() => {
  'use strict';

  /* ==========================================================================
     1. INITIALISATION & CONSTANTES
     ========================================================================== */
  const DB_URL = 'https://nolbowling-default-rtdb.europe-west1.firebasedatabase.app';
  const PEER_CFG = {
    config: {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    }
  };

  const stage = document.getElementById('stage');
  const cv = document.getElementById('c');
  const g = cv.getContext('2d', { alpha: false, desynchronized: true });
  const W = 480, H = 800;
  const Q = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
  cv.width = W * Q;
  cv.height = H * Q;

  function fit() {
    const vw = window.visualViewport ? window.visualViewport.width : window.innerWidth;
    const vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    const s = Math.min(vw / W, vh / H) * 0.97;
    stage.style.width = Math.max(240, Math.floor(W * s)) + 'px';
    stage.style.height = Math.max(400, Math.floor(H * s)) + 'px';
  }
  window.addEventListener('resize', fit);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', fit);
  fit();
  try { document.fonts.load("10px 'Press Start 2P'"); } catch (e) {}

  const LL = 90, LR = 390, BR = 16, PR = 12;
  const FONT = "'Press Start 2P', monospace";
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const MODES = [
    { n: 'INFINI', f: 0, d: 'SANS FIN • NIVEAUX • RECORD' },
    { n: '5 FRAMES', f: 5, d: 'PARTIE RAPIDE EN 5 FRAMES' },
    { n: '10 FRAMES', f: 10, d: 'REGLES OFFICIELLES • 10 FRAMES' }
  ];

  const SKINS = [
    { id: 'cyan', name: 'CYBER CYAN', c1: '#ffffff', c2: '#00ffff', c3: '#6600ff', glow: '#00ffff', trail: '#00ffff', req: 0 },
    { id: 'magenta', name: 'PLASMA PINK', c1: '#ffffff', c2: '#ff22ee', c3: '#660044', glow: '#ff00ff', trail: '#ff44ff', req: 0 },
    { id: 'gold', name: 'SOLAR GOLD', c1: '#ffffdd', c2: '#ffcc00', c3: '#cc4400', glow: '#ffaa00', trail: '#ffdd00', req: 3 },
    { id: 'matrix', name: 'VOID MATRIX', c1: '#ccffcc', c2: '#00ff66', c3: '#003311', glow: '#00ff88', trail: '#00ff66', req: 10 }
  ];

  const BOT_LEVELS = [
    { n: 'ROOKIE', desc: 'IA DEBUTANTE • ERREURS FREQUENTES', errPos: 34, errAng: 0.16, errPow: 0.24, spinSkill: 0.25 },
    { n: 'PRO', desc: 'IA EQUILIBREE • VISE LES SPARES', errPos: 14, errAng: 0.065, errPow: 0.09, spinSkill: 0.65 },
    { n: 'CYBER PRO', desc: 'IA EXPERTE • POCHE 1-3 & EFFET', errPos: 5, errAng: 0.022, errPow: 0.035, spinSkill: 0.92 }
  ];

  const PLAYER_COLORS = ['#00ffff', '#ff00ff', '#ffff00', '#00ff88'];

  let stats = {
    best: 0,
    strikes: 0,
    spares: 0,
    maxStreak: 0,
    games: 0,
    skin: 0,
    nick: ''
  };
  try {
    const saved = JSON.parse(localStorage.getItem('nb_stats_v2') || 'null');
    if (saved) stats = { ...stats, ...saved };
    else {
      const oldBest = +localStorage.getItem('nb_best') || 0;
      if (oldBest > 0) stats.best = oldBest;
    }
  } catch (e) {}

  function saveStats() {
    try { localStorage.setItem('nb_stats_v2', JSON.stringify(stats)); } catch (e) {}
  }

  const STARS = Array.from({ length: 38 }, () => ({
    x: Math.random() * W,
    y: 88 + Math.random() * 135,
    s: Math.random() * 1.7 + 0.6,
    ph: Math.random() * 6.28
  }));

  /* ==========================================================================
     2. ETAT DU JEU, PSEUDOS, FIREBASE REALTIME & P2P (1-4 JOUEURS)
     ========================================================================== */
  let st = 'menu';
  let tk = 0;
  let mode = 0, np = 1, mrow = 0;
  let playType = 'solo';
  let localPlayers = 2;
  let onlineCapacity = 2;
  let botDiff = 1;

  function cleanNickChars(raw) {
    return String(raw || '')
      .normalize('NFD')
      .replace(/[\u0300-\u036f]/g, '')
      .toUpperCase()
      .replace(/[^A-Z0-9_-]/g, '')
      .slice(0, 10);
  }

  function sanitizeNick(raw, fallback = 'JOUEUR') {
    const clean = cleanNickChars(raw);
    return clean.length > 0 ? clean : fallback;
  }

  let myNick = sanitizeNick(stats.nick, 'JOUEUR');
  let onlineCount = 1;
  const publicRooms = new Map(); // code -> { code, host, count, max, mode, ts }
  const mySessionId = 'nb_' + Math.random().toString(36).slice(2, 11);
  let lastPublishedRoomCode = '';

  const nickInputEl = document.getElementById('nickInput');
  const roomInputEl = document.getElementById('roomInput');

  nickInputEl.value = stats.nick ? myNick : '';
  nickInputEl.addEventListener('input', () => {
    const filtered = cleanNickChars(nickInputEl.value);
    if (nickInputEl.value !== filtered) {
      const pos = nickInputEl.selectionStart || filtered.length;
      nickInputEl.value = filtered;
      try { nickInputEl.setSelectionRange(pos, pos); } catch (e) {}
    }
    if (filtered.length > 0) {
      myNick = filtered;
      stats.nick = myNick;
      saveStats();
    }
  });

  nickInputEl.addEventListener('blur', () => {
    const finalNick = sanitizeNick(nickInputEl.value, 'JOUEUR');
    myNick = finalNick;
    nickInputEl.value = finalNick;
    stats.nick = finalNick;
    saveStats();
  });

  roomInputEl.addEventListener('input', () => {
    const filtered = String(roomInputEl.value || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
    if (roomInputEl.value !== filtered) roomInputEl.value = filtered;
  });

  let NF = 0, FIN = false;
  let PL = [], cp = 0, fi = 0, fr = [], sb = 10, turnChg = false, level = 1;
  let pins = [], ball = null, bumpers = [], parts = [], texts = [], trails = [];
  let shake = 0, flash = 0, flashCol = '#fff';
  let overAt = 0;
  let aimA = 0, aimPh = 0, powPh = 0, power = 0, aimLock = 0;
  let px = 240, ptrX = 240, steerOn = false, keys = {};
  let calmT = 0, settleT = 0, wait = 0;
  let msg = '', msgSub = '', msgC = '#ff0', msgT = 0;
  let gutter = false;
  let mute = false, musicOn = true;
  let hits = [], mx = -1, my = -1, ptrDown = false, sx = 0, sy = 0, moved = false, hitBtn = false;
  let swipeMode = false, swipeStartY = 0, swipeStartX = 0, swipeTime = 0;
  let copiedToast = 0;
  let botPlan = null;
  let autoStartTimer = null;
  let disconnectReturnTimer = null;

  let peer = null;
  const hostConns = [];
  let guestConn = null;
  let mySlot = 0;
  let netRole = null; // 'host' | 'guest'
  let netStatus = 'PRET A CONNECTER';
  let roomCode = '';
  let onlineSub = 'lobby'; // 'lobby' | 'hosting' | 'joining'
  let lobbyScroll = 0;
  let netSyncTimer = 0;
  let roomRoster = [];

  let sweeper = { active: false, t: 0, dur: 52, resetRack: false, cleared: false };

  function haptic(pattern = 15) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
  }

  function clearPendingTimers() {
    if (autoStartTimer) { clearTimeout(autoStartTimer); autoStartTimer = null; }
    if (disconnectReturnTimer) { clearTimeout(disconnectReturnTimer); disconnectReturnTimer = null; }
  }

  /* --------------------------------------------------------------------------
     Firebase Realtime Database : Salons & Joueurs en ligne en temps reel
     -------------------------------------------------------------------------- */
  async function fbPut(path, data) {
    try {
      await fetch(`${DB_URL}/${path}.json`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
        keepalive: true
      });
    } catch (e) {}
  }

  async function fbDelete(path) {
    try {
      await fetch(`${DB_URL}/${path}.json`, {
        method: 'DELETE',
        keepalive: true
      });
    } catch (e) {}
  }

  function publishRoomToFirebase(roomObj) {
    if (!roomObj || !roomObj.code) return;
    const payload = {
      code: roomObj.code,
      host: sanitizeNick(roomObj.host, 'HOTE'),
      count: Number(roomObj.count) || 1,
      max: Number(roomObj.max) || 2,
      mode: Number(roomObj.mode) || 0,
      ts: Date.now()
    };
    lastPublishedRoomCode = payload.code;
    publicRooms.set(payload.code, payload);
    fbPut(`rooms/${payload.code}`, payload);
  }

  function removeRoomFromFirebase(code) {
    const target = code || lastPublishedRoomCode;
    if (!target) return;
    if (target === lastPublishedRoomCode) lastPublishedRoomCode = '';
    publicRooms.delete(target);
    fbDelete(`rooms/${target}`);
  }

  async function syncFirebaseLobby() {
    const now = Date.now();
    try {
      const [roomsRes, presRes] = await Promise.all([
        fetch(`${DB_URL}/rooms.json`, { cache: 'no-store' }),
        fetch(`${DB_URL}/presence.json`, { cache: 'no-store' })
      ]);

      if (roomsRes.ok) {
        const roomsData = await roomsRes.json();
        publicRooms.clear();
        if (roomsData && typeof roomsData === 'object') {
          Object.entries(roomsData).forEach(([key, r]) => {
            if (!r || typeof r !== 'object') return;
            const age = now - (Number(r.ts) || 0);
            if (age > 25000) {
              fbDelete(`rooms/${key}`);
              return;
            }
            const code = String(r.code || key).toUpperCase();
            const count = Number(r.count) || 1;
            const max = Number(r.max) || 2;
            if (count < max) {
              publicRooms.set(code, {
                code,
                host: sanitizeNick(r.host, 'HOTE'),
                count,
                max,
                mode: Number(r.mode) || 0,
                ts: Number(r.ts) || now
              });
            }
          });
        }
      }

      if (presRes.ok) {
        const presData = await presRes.json();
        let active = 0;
        if (presData && typeof presData === 'object') {
          Object.entries(presData).forEach(([id, p]) => {
            const ts = typeof p === 'object' && p ? Number(p.ts) || 0 : Number(p) || 0;
            if (now - ts > 25000) {
              fbDelete(`presence/${id}`);
            } else {
              active++;
            }
          });
        }
        onlineCount = Math.max(1, active);
      }
    } catch (e) {}
  }

  function sendPresencePing() {
    fbPut(`presence/${mySessionId}`, {
      ts: Date.now(),
      nick: myNick
    });
  }

  function initFirebaseRealtime() {
    sendPresencePing();
    syncFirebaseLobby();

    setInterval(() => {
      sendPresencePing();
      if (netRole === 'host' && onlineSub === 'hosting' && roomCode && roomRoster.length < onlineCapacity) {
        publishRoomToFirebase({
          code: roomCode,
          host: myNick,
          count: roomRoster.length,
          max: onlineCapacity,
          mode
        });
      }
    }, 8000);

    setInterval(() => {
      if (st === 'menu' || st === 'online') {
        syncFirebaseLobby();
      }
    }, 1800);

    window.addEventListener('beforeunload', () => {
      if (netRole === 'host' && roomCode) {
        removeRoomFromFirebase(roomCode);
      } else if (lastPublishedRoomCode) {
        removeRoomFromFirebase(lastPublishedRoomCode);
      }
      fbDelete(`presence/${mySessionId}`);
    });
  }

  setTimeout(initFirebaseRealtime, 150);

  function getActivePublicRooms() {
    const now = Date.now();
    const list = [];
    publicRooms.forEach((r, code) => {
      if (!r || now - (r.ts || 0) > 25000) {
        publicRooms.delete(code);
      } else if (r.count < r.max) {
        list.push(r);
      }
    });
    list.sort((a, b) => (b.ts || 0) - (a.ts || 0));
    return list;
  }

  /* ==========================================================================
     3. AUDIO SYNTHWAVE (WEB AUDIO API)
     ========================================================================== */
  let ac = null;
  let rollNode = null, rollGain = null, rollFilter = null;
  let musicTimer = null, musicStep = 0;

  function initAudio() {
    if (!ac) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) ac = new Ctx();
    }
    if (ac && ac.state === 'suspended') {
      ac.resume().catch(() => {});
    }
    setupRollSound();
  }

  function setupRollSound() {
    if (!ac || rollNode) return;
    try {
      const bufferSize = ac.sampleRate * 2;
      const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      rollNode = ac.createBufferSource();
      rollNode.buffer = buffer;
      rollNode.loop = true;

      rollFilter = ac.createBiquadFilter();
      rollFilter.type = 'lowpass';
      rollFilter.frequency.value = 120;

      rollGain = ac.createGain();
      rollGain.gain.value = 0.0001;

      rollNode.connect(rollFilter);
      rollFilter.connect(rollGain);
      rollGain.connect(ac.destination);
      rollNode.start();
    } catch (e) {}
  }

  function updateRollAudio() {
    if (!ac || !rollGain || !rollFilter) return;
    const T = ac.currentTime;
    if (!mute && st === 'roll' && ball && ball.rolling && !gutter) {
      const sp = Math.hypot(ball.vx, ball.vy);
      const norm = clamp(sp / 16, 0, 1);
      rollGain.gain.setTargetAtTime(0.02 + norm * 0.055, T, 0.05);
      rollFilter.frequency.setTargetAtTime(90 + norm * 240, T, 0.05);
    } else {
      rollGain.gain.setTargetAtTime(0.0001, T, 0.06);
    }
  }

  function tone(f, d = 0.1, ty = 'square', v = 0.06, sl = 0) {
    if (mute) return;
    try {
      initAudio();
      if (!ac) return;
      const o = ac.createOscillator();
      const n = ac.createGain();
      const T = ac.currentTime;
      o.type = ty;
      o.frequency.setValueAtTime(f, T);
      if (sl) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + sl), T + d);
      n.gain.setValueAtTime(v, T);
      n.gain.exponentialRampToValueAtTime(0.001, T + d);
      o.connect(n);
      n.connect(ac.destination);
      o.start();
      o.stop(T + d);
    } catch (e) {}
  }

  const arp = (a, s = 65, ty = 'square', v = 0.065) =>
    a.forEach((f, i) => setTimeout(() => tone(f, 0.15, ty, v), i * s));

  const BASS_SEQ = [
    110, 110, 220, 110, 130.81, 130.81, 261.63, 130.81,
    87.31, 87.31, 174.61, 87.31, 98.00, 98.00, 196.00, 146.83
  ];
  const LEAD_SEQ = [
    440, 0, 523.25, 0, 659.25, 0, 587.33, 523.25,
    349.23, 0, 440, 0, 392.00, 0, 493.88, 0
  ];

  function startMusicLoop() {
    if (musicTimer) return;
    musicTimer = setInterval(() => {
      if (mute || !musicOn || !ac || ac.state !== 'running') return;
      const step = musicStep % 16;
      const bass = BASS_SEQ[step];
      if (bass) tone(bass, 0.14, 'sawtooth', 0.015);
      if (st !== 'roll') {
        const lead = LEAD_SEQ[step];
        if (lead && (musicStep % 32 >= 16 || step % 4 === 0)) {
          tone(lead, 0.18, 'triangle', 0.014);
        }
      }
      musicStep++;
    }, 175);
  }
  startMusicLoop();

  /* ==========================================================================
     4. REGLES DE BOWLING & CALCUL DU SCORE
     ========================================================================== */
  const f0 = v => (v === 0 ? '.' : '' + v);

  function calc(p) {
    const r = p.rolls;
    const out = [];
    let i = 0, tot = 0;

    for (let f = 0; i < r.length && (!FIN || f < NF); f++) {
      const c = { m: [], t: null };
      if (FIN && f === NF - 1) {
        const s = r.slice(i);
        const [a, b, d] = s;
        c.m = [a === 10 ? 'X' : f0(a)];
        if (b !== undefined) {
          c.m.push(a === 10 ? (b === 10 ? 'X' : f0(b)) : (a + b === 10 ? '/' : f0(b)));
        }
        if (d !== undefined) {
          c.m.push(
            a === 10
              ? (b === 10 ? (d === 10 ? 'X' : f0(d)) : (b + d === 10 ? '/' : f0(d)))
              : (d === 10 ? 'X' : f0(d))
          );
        }
        tot += s.reduce((x, y) => x + y, 0);
        c.t = tot;
        i = r.length;
      } else if (r[i] === 10) {
        c.m = ['X'];
        if (r[i + 2] !== undefined) {
          tot += 10 + r[i + 1] + r[i + 2];
          c.t = tot;
        }
        i++;
      } else if (r[i + 1] !== undefined) {
        const s = r[i] + r[i + 1];
        if (s === 10) {
          c.m = [f0(r[i]), '/'];
          if (r[i + 2] !== undefined) {
            tot += 10 + r[i + 2];
            c.t = tot;
          }
        } else {
          c.m = [f0(r[i]), f0(r[i + 1])];
          tot += s;
          c.t = tot;
        }
        i += 2;
      } else {
        c.m = [f0(r[i])];
        i++;
      }
      out.push(c);
    }
    return { fr: out, tot };
  }

  const total = p => calc(p).tot + p.bonus;

  /* ==========================================================================
     5. MULTIJOUEUR P2P (1 A 4 JOUEURS), PHYSIQUE & DEROULEMENT
     ========================================================================== */
  const isBotTurn = () => {
    if (playType === 'bot' && cp === 1) return true;
    if (playType === 'online' && roomRoster[cp] && roomRoster[cp].isBot) return true;
    return false;
  };
  const isMyNetTurn = () => {
    if (playType !== 'online') return true;
    if (roomRoster[cp] && roomRoster[cp].isBot) return netRole === 'host';
    return cp === mySlot;
  };
  const canLocalControl = () => !isBotTurn() && isMyNetTurn();

  function netBroadcastFromHost(data, excludeConn = null) {
    for (let i = 0; i < hostConns.length; i++) {
      const c = hostConns[i];
      if (c && c.open && c !== excludeConn) {
        try { c.send(data); } catch (e) {}
      }
    }
  }

  function netSend(data) {
    if (playType !== 'online') return;
    if (netRole === 'host') {
      netBroadcastFromHost(data);
    } else if (netRole === 'guest' && guestConn && guestConn.open) {
      try { guestConn.send(data); } catch (e) {}
    }
  }

  function closeNetwork() {
    clearPendingTimers();
    nickInputEl.style.display = 'none';
    roomInputEl.style.display = 'none';
    if (netRole === 'host' && roomCode) {
      removeRoomFromFirebase(roomCode);
    }
    while (hostConns.length) {
      const c = hostConns.pop();
      try { c.close(); } catch (e) {}
    }
    if (guestConn) { try { guestConn.close(); } catch (e) {} guestConn = null; }
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    netRole = null;
    mySlot = 0;
    roomCode = '';
    roomRoster = [];
    onlineSub = 'lobby';
    lobbyScroll = 0;
  }

  function genCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  function syncLobbyRoster() {
    roomRoster.forEach((p, idx) => { p.slot = idx; });
    netBroadcastFromHost({
      type: 'lobby_state',
      roster: roomRoster.map(r => ({ nick: r.nick, slot: r.slot, isBot: !!r.isBot, peerId: r.peerId })),
      max: onlineCapacity,
      mode
    });
    if (roomRoster.length >= onlineCapacity) {
      removeRoomFromFirebase(roomCode);
      if (!autoStartTimer) {
        autoStartTimer = setTimeout(() => {
          autoStartTimer = null;
          if (st === 'online' && onlineSub === 'hosting') {
            launchOnlineMatch();
          }
        }, 650);
      }
    } else {
      publishRoomToFirebase({
        code: roomCode,
        host: myNick,
        count: roomRoster.length,
        max: onlineCapacity,
        mode
      });
    }
  }

  function launchOnlineMatch() {
    if (netRole !== 'host') return;
    clearPendingTimers();
    removeRoomFromFirebase(roomCode);
    while (roomRoster.length < onlineCapacity && roomRoster.length > 1) {
      roomRoster.push({
        nick: 'BOT ' + roomRoster.length,
        slot: roomRoster.length,
        isBot: true,
        peerId: null
      });
    }
    roomRoster.forEach((p, idx) => { p.slot = idx; });
    netBroadcastFromHost({
      type: 'start',
      mode,
      roster: roomRoster.map(r => ({ nick: r.nick, slot: r.slot, isBot: !!r.isBot, peerId: r.peerId }))
    });
    startGame(true);
  }

  function bindHostClient(c) {
    c.on('open', () => {
      if (st !== 'online' || onlineSub !== 'hosting' || roomRoster.length >= onlineCapacity) {
        try { c.send({ type: 'full' }); c.close(); } catch (e) {}
        return;
      }
      hostConns.push(c);
      const slotIdx = roomRoster.length;
      roomRoster.push({ nick: 'JOUEUR ' + (slotIdx + 1), slot: slotIdx, isBot: false, peerId: c.peer });
      arp([523.25, 659.25], 55);
      haptic(20);
      syncLobbyRoster();
    });

    c.on('data', d => {
      if (!d || typeof d !== 'object') return;
      if (d.type === 'hello') {
        const item = roomRoster.find(r => r.peerId === c.peer);
        if (item && d.nick) {
          item.nick = sanitizeNick(d.nick, 'JOUEUR');
          syncLobbyRoster();
        }
      } else {
        netBroadcastFromHost(d, c);
        handleNetData(d);
      }
    });

    c.on('close', () => {
      const cIdx = hostConns.indexOf(c);
      if (cIdx !== -1) hostConns.splice(cIdx, 1);
      if (st === 'online' && onlineSub === 'hosting') {
        const rIdx = roomRoster.findIndex(r => r.peerId === c.peer);
        if (rIdx !== -1) roomRoster.splice(rIdx, 1);
        syncLobbyRoster();
      } else if (playType === 'online' && st !== 'menu' && st !== 'over') {
        say('UN JOUEUR A QUITTE', '#f35', 140, 'RETOUR AU MENU');
        if (!disconnectReturnTimer) {
          disconnectReturnTimer = setTimeout(() => {
            disconnectReturnTimer = null;
            closeNetwork();
            st = 'menu';
          }, 1800);
        }
      }
    });
  }

  function setupGuestConn(connection) {
    guestConn = connection;
    guestConn.on('open', () => {
      netStatus = 'CONNECTE AU SALON !';
      arp([523.25, 659.25, 783.99], 60);
      haptic([20, 40, 20]);
      netSend({ type: 'hello', nick: myNick });

    guestConn.on('data', d => handleNetData(d));
    guestConn.on('close', () => {
      if (playType === 'online' && st !== 'menu' && st !== 'over') {
        say('HOTE DECONNECTE', '#f35', 140, 'RETOUR AU MENU');

            disconnectReturnTimer = null;
            closeNetwork();
            st = 'menu';
          }, 1800);

  function handleNetData(d) {
    if (!d || typeof d !== 'object') return;
    if (d.type === 'full') {
      netStatus = 'SALON DEJA COMPLET !';
      onlineSub = 'lobby';
      tone(150, 0.25, 'sawtooth');
    } else if (d.type === 'lobby_state') {
      roomRoster = Array.isArray(d.roster) ? d.roster : [];
      onlineCapacity = d.max || onlineCapacity;
      if (typeof d.mode === 'number') mode = d.mode;
      const me = roomRoster.find(r => r.peerId === (peer && peer.id));
      if (me) mySlot = me.slot;
      netStatus = `SALON (${roomRoster.length}/${onlineCapacity}) - EN ATTENTE...`;
    } else if (d.type === 'start') {
      clearPendingTimers();
      roomRoster = Array.isArray(d.roster) ? d.roster : [];
      const me = roomRoster.find(r => r.peerId === (peer && peer.id));
      if (me) mySlot = me.slot;
      mode = typeof d.mode === 'number' ? d.mode : mode;
      roomInputEl.style.display = 'none';
      nickInputEl.style.display = 'none';
      startGame(true);
    } else if (d.type === 'aim') {
      if (!isMyNetTurn() && st === 'aim') {
        px = clamp(d.px, LL + BR + 4, LR - BR - 4);
        if (ball) ball.x = px;
        aimLock = d.aimLock;
        aimA = d.aimA;
        power = d.power;
      }
    } else if (d.type === 'launch') {
      if (!isMyNetTurn() && st === 'aim' && ball) {
        px = clamp(d.px, LL + BR + 4, LR - BR - 4);
        ball.x = px;
        ball.y = 735;
        ball.vx = d.vx;
        ball.vy = d.vy;
        ball.spin = d.spin || 0;
        ball.rolling = true;
        aimA = d.aimA;
        power = d.power;
        st = 'roll';
        settleT = 0;
        sb = pins.filter(p => !p.gone).length;
        tone(180, 0.35, 'sawtooth', 0.08, -100);
        if (d.perfect) {
          say('PUISSANCE PARFAITE', '#0f8', 55, !FIN ? '+25 PTS BONUS' : 'TRAJECTOIRE OPTIMALE');
          if (!FIN && PL[cp]) PL[cp].bonus += 25;
        }
      }
    } else if (d.type === 'roll_sync') {
      if (!isMyNetTurn() && st === 'roll' && ball && ball.rolling) {
        ball.x = d.bx;
        ball.y = d.by;
        ball.vx = d.vx;
        ball.vy = d.vy;
        ball.spin = d.spin;
      }
    } else if (d.type === 'throw_res') {
      if (!isMyNetTurn()) {
        if (st === 'roll') {
          endThrow(d);
        } else if (st === 'between') {
          pins.forEach((p, idx) => {
            if (d.pins && d.pins[idx]) {
              p.down = d.pins[idx].down;
              p.gone = d.pins[idx].gone;
            }
          });
        }
      }
    } else if (d.type === 'rematch') {
      startGame(true);
    }
  }

  function planBotShot() {
    const cfg = BOT_LEVELS[botDiff];
    const standing = pins.filter(p => !p.gone);
    let targetX = 240;

    if (standing.length === 10) {
      targetX = 250;
    } else if (standing.length > 0) {
      targetX = standing.reduce((acc, p) => acc + p.ox, 0) / standing.length;
    }

    const randErr = () => (Math.random() - 0.5) * 2;
    const chosenPx = clamp(targetX + randErr() * cfg.errPos * 0.6, LL + BR + 12, LR - BR - 12);
    const dx = targetX - chosenPx;
    const dy = 250 - 735;
    const idealAngle = clamp(Math.atan2(dx, -dy) + randErr() * cfg.errAng, -0.38, 0.38);
    const idealPower = clamp(0.91 + randErr() * cfg.errPow, 0.5, 0.99);
    const idealSpin = clamp((-idealAngle * 0.95 + randErr() * (1 - cfg.spinSkill) * 0.5) * cfg.spinSkill, -0.85, 0.85);

    botPlan = {
      timer: 0,
      targetPx: chosenPx,
      targetAng: idealAngle,
      targetPow: idealPower,
      targetSpin: idealSpin,
      phase: 'move'
    };
  }

  function collide(a, b, ma, mb, e) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const d = Math.hypot(dx, dy);
    const R = a.r + b.r;
    if (d >= R || d === 0) return 0;

    const nx = dx / d;
    const ny = dy / d;
    const ov = R - d;
    const tm = ma + mb;

    a.x -= nx * ov * mb / tm;
    a.y -= ny * ov * mb / tm;
    b.x += nx * ov * ma / tm;
    b.y += ny * ov * ma / tm;

    const vn = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
    if (vn > 0) {
      const j = (1 + e) * vn / (1 / ma + 1 / mb);
      a.vx -= j * nx / ma;
      a.vy -= j * ny / ma;
      b.vx += j * nx / mb;
      b.vy += j * ny / mb;
      return vn;
    }
    return 0.01;
  }

  function checkSplit(standing) {
    if (standing.length < 2 || standing.length > 4) return false;
    const headPinUp = standing.some(p => p.id === 1);
    if (headPinUp) return false;
    let maxDist = 0;
    for (let i = 0; i < standing.length; i++) {
      for (let j = i + 1; j < standing.length; j++) {
        const d = Math.hypot(standing[i].ox - standing[j].ox, standing[i].oy - standing[j].oy);
        if (d > maxDist) maxDist = d;
      }
    }
    return maxDist >= 68;
  }

  function triggerSweeper(resetRack) {

  function endThrow(netOverride = null) {
    if (netOverride && netOverride.pins) {
      pins.forEach((p, idx) => {
        if (netOverride.pins[idx]) {
          p.down = netOverride.pins[idx].down;
          p.gone = netOverride.pins[idx].gone;
        }
      });
      gutter = !!netOverride.gutter;
    } else if (playType === 'online' && isMyNetTurn()) {
      netSend({
        type: 'throw_res',
        gutter,
        pins: pins.map(p => ({ down: p.down, gone: p.gone }))
      });
    }

    const dn = pins.filter(p => p.down && !p.gone);
    const n = dn.length;
    const standing = pins.filter(p => !p.down && !p.gone);
    const left = standing.length;
    const pl = PL[cp];
    if (!pl) return;

    pl.rolls.push(n);
    fr.push(n);

    let done = false;
    let reset = false;

    if (FIN && fi === NF - 1) {
      const t = fr.length, a = fr[0];
      if (t === 1) {
        reset = a === 10;
        done = false;
      } else if (t === 2) {
        if (a === 10) {
          reset = fr[1] === 10;
          done = false;
        } else if (a + fr[1] === 10) {
          reset = true;
          done = false;
        } else {
          done = true;
        }
      } else {
        done = true;
      }
    } else {
      done = left === 0 || fr.length === 2;
    }

    const isStrike = sb === 10 && n === 10;
    const isSpare = !isStrike && sb < 10 && left === 0;

    if (isStrike) {
      pl.strikes++;
      pl.streak++;
      if (pl.streak > pl.bestStreak) pl.bestStreak = pl.streak;
      if (np === 1) {
        stats.strikes++;
        if (pl.streak > stats.maxStreak) stats.maxStreak = pl.streak;
      }

      const streakNames = ['', 'STRIKE !!!', 'DOUBLE STRIKE !!', 'TURKEY !!!', 'FOUR BAGGER !!', 'MEGA STREAK !!'];
      const title = streakNames[Math.min(pl.streak, streakNames.length - 1)];
      let sub = '';
      if (!FIN && pl.streak > 1) {
        const comboBonus = (pl.streak - 1) * 50;
        pl.bonus += comboBonus;
        sub = 'SERIE x' + pl.streak + ' (+' + comboBonus + ' PTS)';
      } else if (ball && ball.bumperHits > 0 && !FIN) {
        const bBonus = ball.bumperHits * 30;
        pl.bonus += bBonus;
        sub = 'RICOCHET BONUS +' + bBonus;
      }

      say(title, '#ff0', 115, sub);
      shake = 22;
      flash = 0.4;
      flashCol = '#ff00ff';
      haptic([40, 30, 60]);
      arp([523.25, 659.25, 783.99, 1046.5, 1318.5], 55, 'sawtooth', 0.075);
      for (let i = 0; i < 4; i++) {
        setTimeout(() => {
          burst(80 + Math.random() * 320, 150 + Math.random() * 230, 22, ['#f0f', '#0ff', '#ff0', '#0f8'][i % 4], 6);
        }, i * 110);
      }
    } else if (isSpare) {
      pl.spares++;
      pl.streak = 0;
      if (np === 1) stats.spares++;
      say('SPARE !', '#0ff', 95, 'BELLE RECUPERATION');
      shake = 10;
      flash = 0.28;
      flashCol = '#00ffff';
      haptic([25, 30, 35]);
      arp([440, 554.37, 659.25, 880], 65, 'square', 0.07);
      burst(240, 250, 24, '#0ff', 5);
    } else {
      if (done) {
        pl.streak = 0;
        pl.opens++;
      }
      if (n === 0) {
        say(gutter ? 'GOUTTIERE...' : 'RATE...', '#f35', 75, gutter ? 'GARDE LE CENTRE !' : '');
        tone(140, 0.38, 'sawtooth', 0.08, -85);
        haptic(45);
      } else if (!done && checkSplit(standing)) {
        const is710 = standing.length === 2 && standing.some(p => p.id === 7) && standing.some(p => p.id === 10);
        say(is710 ? 'SPLIT 7-10 !' : 'SPLIT !', '#ff6600', 85, n + ' QUILLE' + (n > 1 ? 'S' : '') + ' • BONNE CHANCE');
        arp([330, 293.66, 261.63], 70, 'triangle', 0.06);
      } else {
        say(n + (n > 1 ? ' QUILLES' : ' QUILLE'), '#fff', 55, left > 0 && !done ? left + ' RESTANTE' + (left > 1 ? 'S' : '') : '');
        tone(480 + n * 42, 0.12);
      }
    }

    if (n > 0) pop(240, 295, '+' + n, isStrike ? '#ff0' : '#0ff');

    if (!FIN && np === 1) {
      const t = total(pl);
      if (t > stats.best) stats.best = t;
    }
    saveStats();

    const oldL = level;
    let shouldResetRack = false;

    if (done) {
      fr = [];
      cp++;
      if (cp >= np) {
        cp = 0;
        fi++;
      }
      turnChg = playType === 'local' && np > 1;
      shouldResetRack = true;
      level = FIN ? 1 : 1 + Math.floor(fi / 2);
      setBumpers();
      if (level > oldL) {
        setTimeout(() => {
          if (st !== 'menu' && st !== 'over') {
            say('NIVEAU ' + level + ' !', '#f0f', 95, 'OBSTACLES & VITESSE +');
            arp([392, 493.88, 587.33, 783.99], 85, 'triangle', 0.075);
          }
        }, 750);
      }
    } else if (reset) {
      shouldResetRack = true;
    }

    triggerSweeper(shouldResetRack);
    if (ball) ball.x = -100;
    st = 'between';
    wait = 96;
  }

  function ballPins() {
    if (!ball || !ball.rolling || gutter) return;
    for (let i = 0; i < pins.length; i++) {
      const p = pins[i];
      if (p.gone) continue;
      const o = { x: p.x, y: p.y, r: PR, vx: p.vx, vy: p.vy };
      const v = collide(ball, o, 3.1, 1, 0.56);
      if (v) {
        p.x = o.x; p.y = o.y;
        const latBoost = clamp(ball.spin * 0.45, -0.45, 0.45);
        p.vx = o.vx * 0.86 + latBoost * v * 0.35;
        p.vy = o.vy * 0.92;
        ball.vx *= 0.94;
        ball.vy *= 0.95;

        if (v > 0.35) {
          p.imp += v * 0.85;
          p.wob = Math.min(3.5, Math.max(p.wob, v / 3.2));
          if (!p.hit) {
            p.hit = true;
            burst(p.x, p.y, 5, '#fff', 3.2);
            tone(280 + Math.random() * 480, 0.075, 'square', 0.055);
          }
          shake = Math.max(shake, Math.min(8, v * 0.95));
        }
      }
    }
  }

  function ballBumpers() {
    if (!ball || !ball.rolling || gutter) return;
    for (let i = 0; i < bumpers.length; i++) {
      const b = bumpers[i];
      if (b.hitCd > 0) b.hitCd--;
      const bo = { x: b.x, y: b.y, r: b.r, vx: 0, vy: 0 };
      const v = collide(ball, bo, 1, 100, 0.92);
      if (v > 0 && b.hitCd === 0) {
        b.hitCd = 14;
        ball.bumperHits++;
        if (ball.vy > -4.5) ball.vy = -6.5;
        burst(b.x, b.y, 14, '#f0f', 4.5);
        pop(b.x, b.y - 10, '+30', '#f0f');
        if (!FIN && PL[cp]) PL[cp].bonus += 30;
        tone(880, 0.12, 'sawtooth', 0.07, 220);
        haptic(18);
        shake = Math.max(shake, 6);
      }
    }
  }

  function pinPhysics() {
    const live = [];
    for (let i = 0; i < pins.length; i++) {
      if (!pins[i].gone) live.push(pins[i]);
    }
    for (let i = 0; i < live.length; i++) {
      for (let j = i + 1; j < live.length; j++) {
        const a = live[i], b = live[j];
        const A = { x: a.x, y: a.y, r: PR, vx: a.vx, vy: a.vy };
        const B = { x: b.x, y: b.y, r: PR, vx: b.vx, vy: b.vy };
        const v = collide(A, B, 1, 1, 0.64);
        if (v) {
          a.x = A.x; a.y = A.y; a.vx = A.vx; a.vy = A.vy;
          b.x = B.x; b.y = B.y; b.vx = B.vx; b.vy = B.vy;
          if (v > 0.35) {
            a.imp += v * 0.78;
            b.imp += v * 0.78;
            a.wob = Math.max(a.wob, Math.min(3.5, v / 3.2));
            b.wob = Math.max(b.wob, Math.min(3.5, v / 3.2));
          }
          if (v > 1.6) tone(240 + Math.random() * 420, 0.05, 'square', 0.03);
        }
      }
    }

    for (let i = 0; i < live.length; i++) {
      const p = live[i];
      p.x += p.vx / 3;
      p.y += p.vy / 3;
      if (p.x < 64) { p.x = 64; p.vx = Math.abs(p.vx) * 0.4; }
      if (p.x > 416) { p.x = 416; p.vx = -Math.abs(p.vx) * 0.4; }
      if (p.y < 46) { p.y = 46; p.vy = Math.abs(p.vy) * 0.4; }

      if (!p.down && (p.imp > 4.65 || Math.hypot(p.x - p.ox, p.y - p.oy) > 19.5)) {
        p.down = true;
        p.dir = p.vx < 0 ? -1 : 1;
        burst(p.x, p.y, 7, '#ff0', 3.2);
      }
      if (p.down) p.ang += (p.dir * 1.55 - p.ang) * 0.045;
      else p.wob *= 0.975;
    }
  }

  function update() {
    tk++;
    for (let i = 0; i < bumpers.length; i++) {
      const b = bumpers[i];
      b.x = b.cx + Math.sin((tk / 60) * b.sp + b.ph) * b.amp;
    }

    if (shake > 0) shake *= 0.9;
    if (flash > 0) flash = Math.max(0, flash - 0.025);
    if (msgT > 0) msgT--;
    if (copiedToast > 0) copiedToast--;

    if (sweeper.active) {
      sweeper.t++;
      const half = sweeper.dur / 2;
      if (sweeper.t >= half && !sweeper.cleared) {
        sweeper.cleared = true;
        for (let i = 0; i < pins.length; i++) {
          if (pins[i].down) pins[i].gone = true;
        }
        if (sweeper.resetRack) rack();
      }
      if (sweeper.t >= sweeper.dur) {
        sweeper.active = false;
      }
    }

    if (st === 'aim' && ball) {
      if (isBotTurn() && botPlan) {
        botPlan.timer++;
        if (botPlan.phase === 'move') {
          px += (botPlan.targetPx - px) * 0.14;
          ball.x = px;
          aimPh += 0.045 * spd();
          aimA = Math.sin(aimPh) * 0.42;
          if (Math.abs(px - botPlan.targetPx) < 1.5 && botPlan.timer > 32) {
            px = botPlan.targetPx;
            ball.x = px;
            botPlan.phase = 'angle';
          }
        } else if (botPlan.phase === 'angle') {
          aimPh += 0.045 * spd();
          aimA = Math.sin(aimPh) * 0.42;
          if (Math.abs(aimA - botPlan.targetAng) < 0.035 || botPlan.timer > 110) {
            aimA = botPlan.targetAng;
            aimLock = 1;
            powPh = 0;
            tone(660, 0.08, 'square', 0.07);
            botPlan.phase = 'power';
          }
        } else if (botPlan.phase === 'power') {
          powPh += 0.072 * spd();
          power = (Math.sin(powPh - 1.57) + 1) / 2;
          if (Math.abs(power - botPlan.targetPow) < 0.045 || botPlan.timer > 185) {
            power = botPlan.targetPow;
            launch();
          }
        }
        if (playType === 'online' && netRole === 'host' && tk % 3 === 0) {
          netSend({ type: 'aim', px, aimLock, aimA, power });
        }
      } else if (canLocalControl()) {
        if (aimLock === 0) {
          if (keys.ArrowLeft || keys.a || keys.A) px -= 4.2;
          if (keys.ArrowRight || keys.d || keys.D) px += 4.2;
          px = clamp(px, LL + BR + 4, LR - BR - 4);
          ball.x = px;
          aimPh += 0.045 * spd();
          aimA = Math.sin(aimPh) * 0.42;
        } else {
          powPh += 0.072 * spd();
          power = (Math.sin(powPh - 1.57) + 1) / 2;
        }
        if (playType === 'online' && tk % 3 === 0) {
          netSend({ type: 'aim', px, aimLock, aimA, power });
        }
      }
    }

    if (st === 'roll' && ball) {
      settleT++;
      let steer = 0;
      if (isBotTurn() && botPlan) {
        steer = clamp((botPlan.targetSpin - ball.spin) * 2.5, -1, 1);
      } else if (canLocalControl()) {
        const kb = (keys.ArrowRight || keys.d || keys.D ? 1 : 0) - (keys.ArrowLeft || keys.a || keys.A ? 1 : 0);
        steer = kb || (steerOn ? clamp((ptrX - ball.x) / 85, -1, 1) : 0);
      }

      if (ball.rolling && !gutter) {
        if ((ball.y > 290 && canLocalControl()) || isBotTurn()) {
          ball.spin = clamp(ball.spin + steer * 0.026, -1, 1);
        }
        ball.vx += ball.spin * (ball.y > 470 ? 0.007 : 0.085);
        ball.rot += Math.hypot(ball.vx, ball.vy) * 0.045;
      }

      if (playType === 'online' && isMyNetTurn() && ball.rolling) {
        netSyncTimer++;
        if (netSyncTimer % 3 === 0) {
          netSend({
            type: 'roll_sync',
            bx: ball.x,
            by: ball.y,
            vx: ball.vx,
            vy: ball.vy,
            spin: ball.spin
          });
        }
      }

      for (let s = 0; s < 3; s++) {
        if (ball.rolling) {
          ball.x += ball.vx / 3;
          ball.y += ball.vy / 3;

          if (!gutter && (ball.x < LL || ball.x > LR)) {
            gutter = true;
            tone(110, 0.32, 'sawtooth', 0.075, -45);
          }
          if (gutter) {
            const tx = ball.x < 240 ? LL - 17 : LR + 17;
            ball.x += ((tx - ball.x) * 0.22) / 3;
            ball.vx = 0;
            if (ball.vy > -5.5) ball.vy = -5.5;
          }
          ballBumpers();
          ballPins();
        }
        pinPhysics();
      }

      for (let i = 0; i < pins.length; i++) {
        const p = pins[i];
        const k = p.down ? 0.955 : 0.98;
        p.vx *= k;
        p.vy *= k;
        p.imp *= 0.985;
      }

      ball.vx *= 0.9975;
      ball.vy *= 0.9975;
      const sp = Math.hypot(ball.vx, ball.vy);

      if (ball.rolling && (ball.y < 28 || sp < 0.4)) {
        ball.rolling = false;
        ball.x = -100;
        ball.vx = ball.vy = 0;
      }

      const calm = pins.every(p => p.gone || Math.hypot(p.vx, p.vy) < 0.15);
      if (!ball.rolling && calm) calmT++;
      else calmT = 0;

      if (playType === 'online' && !isMyNetTurn()) {
        if (settleT > 760) endThrow();
      } else if (calmT > 24 || settleT > 700) {
        endThrow();
      }
    }

    if (st === 'between') {
      wait--;
      if (wait <= 0) {
        if (FIN && fi >= NF) {
          if (np === 1) stats.games++;
          saveStats();
          st = 'over';
          overAt = tk;
          arp([523.25, 659.25, 783.99, 1046.5], 105, 'triangle', 0.08);
        } else if (turnChg) {
          turnChg = false;
          st = 'pass';
          tone(440, 0.15, 'triangle', 0.07);
        } else {
          newThrow();
        }
      }
    }

    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.06;
      p.l--;
      if (p.l <= 0) parts.splice(i, 1);
    }

    for (let i = texts.length - 1; i >= 0; i--) {
      const t = texts[i];
      t.y -= 0.75;
      t.l--;
      if (t.l <= 0) texts.splice(i, 1);
    }

    if (ball && ball.rolling) {
      const sk = SKINS[stats.skin] || SKINS[0];
      if (tk % 2 === 0) {
        trails.push({ x: ball.x, y: ball.y, r: ball.r, l: 14, c: gutter ? '#f35' : sk.trail });
        if (trails.length > 10) trails.shift();
        if (parts.length < 120) {
          parts.push({
            x: ball.x + (Math.random() - 0.5) * 8,
            y: ball.y + 8,
            vx: (Math.random() - 0.5) * 0.8,
            vy: 0.6,
            l: 16,
            c: gutter ? '#f35' : sk.trail,
            s: 2.6
          });
        }
      }
    }

    for (let i = trails.length - 1; i >= 0; i--) {
      trails[i].l--;
      if (trails[i].l <= 0) trails.splice(i, 1);
    }

    updateRollAudio();
  }

  /* ==========================================================================
     6. RENDU OPTIMISE & ECRANS
     ========================================================================== */
  const VS = 1.25, S0 = 1 / 2.2;
  function P(x, y) {
    const T = clamp((y - 40) / 700, 0, 1.05);
    const s = 1 / (1 + 1.2 * (1 - T));
    return [240 + (x - 240) * s * VS, 92 + 608 * (s - S0) / (1 - S0), s * VS];
  }

  function txt(s, x, y, size, col, al = 'center', glow = false, out = false) {
    g.font = size + 'px ' + FONT;
    g.textAlign = al;
    if (out) {
      g.lineWidth = 5;
      g.strokeStyle = '#05010f';
      g.lineJoin = 'round';
      g.strokeText(s, x, y);
    }
    g.fillStyle = col;
    if (glow) {
      g.shadowColor = col;
      g.shadowBlur = 10;
    }
    g.fillText(s, x, y);
    if (glow) g.shadowBlur = 0;
  }

  function quad(a, fill) {
    g.beginPath();
    a.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])));
    g.closePath();
    g.fillStyle = fill;
    g.fill();
  }

  function line(a, b, col, w, blur = 0) {
    g.strokeStyle = col;
    g.lineWidth = w;
    if (blur) {
      g.shadowColor = col;
      g.shadowBlur = blur;
    }
    g.beginPath();
    g.moveTo(a[0], a[1]);
    g.lineTo(b[0], b[1]);
    g.stroke();
    if (blur) g.shadowBlur = 0;
  }

  function btn(x, y, w, h, l, sel, fn, sz = 9, c = '#0ff', locked = false) {
    hits.push({ x, y, w, h, fn });
    const hv = mx >= x && mx <= x + w && my >= y && my <= y + h;
    g.fillStyle = locked ? '#ffffff08' : (sel ? c : (hv ? '#ffffff2c' : '#ffffff12'));
    g.fillRect(x, y, w, h);
    g.strokeStyle = locked ? '#666' : c;
    g.lineWidth = hv || sel ? 2.5 : 1.5;
    g.strokeRect(x, y, w, h);
    txt(l, x + w / 2, y + h / 2 + sz / 2 - 1, sz, locked ? '#777' : (sel ? '#05010f' : '#fff'), 'center', false);
  }

  function drawSynthSun() {
    const cx = 240, cy = 145, R = 68;
    g.save();
    g.beginPath();
    g.arc(cx, cy, R, Math.PI, 0);
    g.closePath();
    g.clip();

    const sunGr = g.createLinearGradient(0, cy - R, 0, cy);
    sunGr.addColorStop(0, '#ffff44');
    sunGr.addColorStop(0.5, '#ff44aa');
    sunGr.addColorStop(1, '#aa00ff');
    g.fillStyle = sunGr;
    g.fillRect(cx - R, cy - R, R * 2, R);

    g.fillStyle = '#180542';
    for (let i = 0; i < 6; i++) {
      const y = cy - 6 - i * 10 + ((tk * 0.15) % 10);
      g.fillRect(cx - R, y, R * 2, 1.5 + i * 0.45);
    }
    g.restore();
  }

  function drawLane() {
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0e032e');
    bg.addColorStop(0.28, '#2b0963');
    bg.addColorStop(0.55, '#190542');
    bg.addColorStop(1, '#060117');
    g.fillStyle = bg;
    g.fillRect(0, 0, W, H);

    for (let i = 0; i < STARS.length; i++) {
      const stStar = STARS[i];
      const a = 0.35 + 0.65 * Math.abs(Math.sin(tk * 0.04 + stStar.ph));
      g.fillStyle = `rgba(255, 255, 255, ${a.toFixed(2)})`;
      g.fillRect(stStar.x, stStar.y, stStar.s, stStar.s);
    }

    drawSynthSun();

    g.strokeStyle = '#ff00ff44';
    g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(0, 148); g.lineTo(45, 118); g.lineTo(95, 142); g.lineTo(140, 124); g.lineTo(175, 148);
    g.moveTo(305, 148); g.lineTo(345, 122); g.lineTo(395, 140); g.lineTo(440, 114); g.lineTo(480, 148);
    g.stroke();

    quad([P(LL - 34, 40), P(LL, 40), P(LL, 740), P(LL - 34, 740)], '#04010d');
    quad([P(LR, 40), P(LR + 34, 40), P(LR + 34, 740), P(LR, 740)], '#04010d');

    g.strokeStyle = gutter ? '#ff2244cc' : '#ff00ff88';
    g.lineWidth = 2;
    for (let k = 0; k < 14; k++) {
      const y = 740 - ((k * 50 + tk * 3.2) % 700);
      if (y < 60) continue;
      [LL - 17, LR + 17].forEach(x => {
        const a = P(x - 9, y + 8), b = P(x, y), c = P(x + 9, y + 8);
        g.beginPath();
        g.moveTo(a[0], a[1]);
        g.lineTo(b[0], b[1]);
        g.lineTo(c[0], c[1]);
        g.stroke();
      });
    }

    const gr = g.createLinearGradient(0, 92, 0, 700);
    gr.addColorStop(0, '#180747');
    gr.addColorStop(0.45, '#3b1485');
    gr.addColorStop(1, '#5d21c2');
    quad([P(LL, 40), P(LR, 40), P(LR, 740), P(LL, 740)], gr);

    const oilGr = g.createLinearGradient(0, 260, 0, 740);
    oilGr.addColorStop(0, 'rgba(0, 255, 255, 0.02)');
    oilGr.addColorStop(0.5, 'rgba(0, 255, 255, 0.09)');
    oilGr.addColorStop(1, 'rgba(255, 0, 255, 0.14)');
    quad([P(LL + 35, 470), P(LR - 35, 470), P(LR - 25, 740), P(LL + 25, 740)], oilGr);

    for (let i = 1; i < 6; i++) {
      line(P(LL + i * 50, 40), P(LL + i * 50, 740), '#ffffff18', 1);
    }
    for (let k = 0; k < 7; k++) {
      const y = 40 + ((tk * 2.4 + k * 100) % 700);
      line(P(LL, y), P(LR, y), '#ffffff0e', 2);
    }

    g.fillStyle = '#ff0c';
    for (let i = 0; i < 7; i++) {
      const [x, y, s] = P(LL + 37.5 * (i + 1), 470 + Math.abs(i - 3) * 16);
      const z = 7 * s;
      g.beginPath();
      g.moveTo(x, y - z * 1.7);
      g.lineTo(x - z, y + z * 0.5);
      g.lineTo(x + z, y + z * 0.5);
      g.closePath();
      g.fill();
    }

    g.fillStyle = '#fff9';
    [1, 2, 3, 4, 5].forEach(i => {
      const [x, y, s] = P(LL + i * 50, 590);
      g.beginPath();
      g.arc(x, y, 2.3 * s, 0, 7);
      g.fill();
    });

    line(P(LL, 40), P(LL, 740), '#0ff', 4, 8);
    line(P(LR, 40), P(LR, 740), '#0ff', 4, 8);
    line(P(LL, 690), P(LR, 690), '#f0f', 4, 8);
    quad([P(LL, 470), P(LR, 470), P(LR, 740), P(LL, 740)], '#ffffff09');

    const a = P(LL - 34, 40), b = P(LR + 34, 40);
    g.fillStyle = '#07021a';
    g.fillRect(a[0], 86, b[0] - a[0], a[1] - 86);
    g.strokeStyle = '#ff00ff88';
    g.lineWidth = 2;
    g.strokeRect(a[0], 86, b[0] - a[0], a[1] - 86);
  }

  function drawSweeper() {
    if (!sweeper.active) return;
    const prog = Math.sin((sweeper.t / sweeper.dur) * Math.PI);
    const wy = 160 + prog * 135;
    const left = P(LL - 10, wy);
    const right = P(LR + 10, wy);
    const h = 16 * left[2];

    g.fillStyle = '#120536';
    g.strokeStyle = '#00ffff';
    g.lineWidth = 2.5;
    g.fillRect(left[0], left[1] - h, right[0] - left[0], h);
    g.strokeRect(left[0], left[1] - h, right[0] - left[0], h);

    g.fillStyle = '#ff00ff';
    const seg = (right[0] - left[0]) / 8;
    for (let i = 0; i < 8; i += 2) {
      g.fillRect(left[0] + i * seg + 4, left[1] - h + 3, seg - 8, h - 6);
    }
  }

  function drawPin(p) {
    const [x0, y0, s] = P(p.x, p.y);
    const r = PR * s;

    g.fillStyle = 'rgba(0, 0, 0, 0.5)';
    g.beginPath();
    g.ellipse(x0, y0 + r * 0.25, r * 1.15, r * 0.45, 0, 0, 7);
    g.fill();

    g.save();
    g.translate(x0, y0);
    g.rotate(p.down ? p.ang : Math.sin(tk * 0.6) * p.wob * 0.12);
    if (p.down) g.globalAlpha = 0.88;

    const h = r * 3.45;
    const gr = g.createLinearGradient(-r, 0, r, 0);
    gr.addColorStop(0, '#c8d6e5');
    gr.addColorStop(0.4, '#ffffff');
    gr.addColorStop(1, '#8395a7');
    g.fillStyle = gr;

    g.beginPath();
    g.ellipse(0, -h * 0.34, r * 0.9, h * 0.34, 0, 0, 7);
    g.fill();
    g.beginPath();
    g.arc(0, -h * 0.84, r * 0.5, 0, 7);
    g.fill();

    g.fillStyle = '#ff1e56';
    g.beginPath();
    g.ellipse(0, -h * 0.66, r * 0.7, r * 0.2, 0, 0, 7);
    g.fill();
    g.beginPath();
    g.ellipse(0, -h * 0.58, r * 0.8, r * 0.14, 0, 0, 7);
    g.fill();

    g.restore();
  }

  function drawBumper(b) {
    const [x, y, s] = P(b.x, b.y);
    const r = b.r * s;
    const pulse = b.hitCd > 0 ? 1.25 : 1 + Math.sin(tk * 0.15) * 0.06;

    g.fillStyle = 'rgba(0,0,0,0.5)';
    g.beginPath();
    g.ellipse(x, y + r * 0.6, r * 1.15, r * 0.45, 0, 0, 7);
    g.fill();

    const gr = g.createRadialGradient(x - r * 0.3, y - r * 0.5, 2, x, y - r * 0.3, r * 1.15 * pulse);
    gr.addColorStop(0, '#ffffff');
    gr.addColorStop(0.35, b.hitCd > 0 ? '#ffff00' : '#ff44ff');
    gr.addColorStop(1, '#8800aa');
    g.fillStyle = gr;
    g.beginPath();
    g.arc(x, y - r * 0.3, r * pulse, 0, 7);
    g.fill();

    g.strokeStyle = '#fff';
    g.lineWidth = 1.5;
    g.stroke();
  }

  function drawBall() {
    if (!ball || !isFinite(ball.x) || !isFinite(ball.y) || ball.x < 0) return;
    const sk = SKINS[stats.skin] || SKINS[0];

    for (let i = 0; i < trails.length; i++) {
      const tr = trails[i];
      const [tx, ty, ts] = P(tr.x, tr.y);
      const rad = tr.r * ts * (tr.l / 14) * 0.85;
      g.globalAlpha = (tr.l / 14) * 0.32;
      g.fillStyle = tr.c;
      g.beginPath();
      g.arc(tx, ty - rad * 0.3, rad, 0, 7);
      g.fill();
    }
    g.globalAlpha = 1;

    const [x, y, s] = P(ball.x, ball.y);
    const r = BR * s;

    g.fillStyle = 'rgba(0, 0, 0, 0.55)';
    g.beginPath();
    g.ellipse(x, y + r * 0.7, r * 1.15, r * 0.45, 0, 0, 7);
    g.fill();

    const gr = g.createRadialGradient(x - r * 0.35, y - r * 0.8, 2, x, y - r * 0.3, r * 1.2);
    gr.addColorStop(0, sk.c1);
    gr.addColorStop(0.32, sk.c2);
    gr.addColorStop(1, sk.c3);
    g.fillStyle = gr;
    g.beginPath();
    g.arc(x, y - r * 0.3, r, 0, 7);
    g.fill();

    g.save();
    g.translate(x, y - r * 0.3);
    g.rotate(ball.rot + ball.spin * 0.6);
    g.fillStyle = 'rgba(5, 1, 15, 0.65)';
    [[-0.25, -0.35], [0.22, -0.4], [-0.02, -0.05]].forEach(([hx, hy]) => {
      g.beginPath();
      g.arc(hx * r, hy * r, r * 0.13, 0, 7);
      g.fill();
    });
    g.restore();
  }

  function drawAim() {
    if (!ball) return;
    const dx = Math.sin(aimA), dy = -Math.cos(aimA);
    const col = aimLock ? '#ff0' : '#0f8';
    const pts = [];

    g.fillStyle = col;
    for (let i = 1; i <= 14; i++) {
      const wy = ball.y + dy * i * 22;
      if (wy < 60) break;
      const [x, y, s] = P(ball.x + dx * i * 22, wy);
      pts.push([x, y - 4]);
      if (i < 14) {
        g.beginPath();
        g.arc(x, y - 4, Math.max(1.5, (3.6 - i * 0.1) * s * 1.1), 0, 7);
        g.fill();
      }
    }

    if (pts.length > 2) {
      const a = pts[pts.length - 2];
      const b = pts[pts.length - 1];
      const an = Math.atan2(b[1] - a[1], b[0] - a[0]);
      g.save();
      g.translate(b[0], b[1]);
      g.rotate(an);
      g.beginPath();
      g.moveTo(10, 0);
      g.lineTo(-5, -7);
      g.lineTo(-5, 7);
      g.closePath();
      g.fill();
      g.restore();
    }
  }

      txt(`SALON ${roomRoster.length}/${onlineCapacity} • ${MODES[mode].n}`, W / 2, 226, 8.5, '#ff0', 'center', false);

      for (let i = 0; i < onlineCapacity; i++) {
        const sy = 244 + i * 44;
        const p = roomRoster[i];
        const col = PLAYER_COLORS[i % PLAYER_COLORS.length];
        g.fillStyle = p ? '#140842' : '#ffffff08';
        g.fillRect(50, sy, W - 100, 36);
        g.strokeStyle = p ? col : '#ffffff33';
        g.lineWidth = 1.5;
        g.strokeRect(50, sy, W - 100, 36);

        txt('J' + (i + 1), 64, sy + 23, 8, col, 'left', false);
        if (p) {
          txt(p.nick + (i === 0 ? ' (HOTE)' : ''), 105, sy + 23, 8, '#fff', 'left', false);
          txt('PRET', W - 64, sy + 23, 7, '#0f8', 'right', false);
        } else {
          txt('EN ATTENTE...', 105, sy + 23, 7.5, '#fff6', 'left', false);
        }
      }

      const codeY = 250 + onlineCapacity * 44;
      txt('CODE SALON : ' + (roomCode || '....'), W / 2, codeY + 14, 11, '#0ff', 'center', false);
      btn(110, codeY + 26, 260, 34, copiedToast > 0 ? 'CODE COPIE !' : 'COPIER LE CODE', false, copyRoomCode, 8, '#0f8');

      if (roomRoster.length >= 2 && roomRoster.length < onlineCapacity) {
        btn(70, codeY + 70, 340, 42, 'LANCER MAINTENANT', true, launchOnlineMatch, 9.5, '#ff0');
      } else {
        txt('DEMARRAGE AUTO DES QUE COMPLET !', W / 2, codeY + 86, 6.8, '#0f8', 'center', false);
      }
    } else if (onlineSub === 'joining') {
      txt('SAISIS LE CODE DU SALON :', W / 2, 315, 9, '#fff', 'center', false);
      btn(110, 425, 260, 48, 'CONNECTER', true, joinRoomSubmit, 12, '#0f8');
      txt(netStatus, W / 2, 505, 8, '#ff0', 'center', false);
    }

    btn(110, 668, 260, 44, 'RETOUR MENU', false, () => {
      closeNetwork();
      st = 'menu';
      tone(440, 0.06);
    }, 10, '#f0f');
  }

  function drawStats() {
    overlay(0.92);
    txt('STATISTIQUES', W / 2, 130, 22, '#0ff', 'center', true);
    txt('CARRIERE ARCADE', W / 2, 162, 9, '#f0f', 'center', false);

    const rows = [
      ['RECORD MODE INFINI', String(stats.best).padStart(5, '0'), '#ff0'],
      ['TOTAL STRIKES (X)', String(stats.strikes), '#f0f'],
      ['TOTAL SPARES (/)', String(stats.spares), '#0ff'],
      ['MEILLEURE SERIE X', String(stats.maxStreak), '#0f8'],
      ['PARTIES TERMINEES', String(stats.games), '#fff']
    ];

    rows.forEach(([label, val, col], i) => {
      const y = 235 + i * 68;
      g.fillStyle = '#ffffff0d';
      g.fillRect(36, y - 24, W - 72, 48);
      g.strokeStyle = col + '66';
      g.lineWidth = 1.5;
      g.strokeRect(36, y - 24, W - 72, 48);
      txt(label, 52, y + 4, 8, '#ddd', 'left', false);
      txt(val, W - 52, y + 6, 13, col, 'right', false);
    });

    txt('DEBLOQUE DES BOULES EN FAISANT DES STRIKES !', W / 2, 600, 7, '#ff0', 'center', false);
    btn(110, 650, 260, 50, 'RETOUR MENU', true, () => { st = 'menu'; tone(440, 0.06); }, 11, '#0ff');
  }

  function drawPass() {
    overlay(0.84);
    const col = PLAYER_COLORS[cp % PLAYER_COLORS.length];
    txt('JOUEUR ' + (cp + 1), W / 2, 320, 36, col, 'center', true);
    txt('A TOI DE JOUER !', W / 2, 376, 12, '#ff0', 'center', false);
    txt('PASSE L APPAREIL AU JOUEUR ' + (cp + 1), W / 2, 420, 8, '#fff', 'center', false);
    if (Math.floor(tk / 28) % 2 === 0) {
      txt('TOUCHE OU ESPACE POUR LANCER', W / 2, 500, 9.5, '#0ff', 'center', false);
    }
  }

  function shareScore(scoreVal) {
    const modeName = MODES[mode].n;
    const text = `NolBowling (${modeName}) : ${scoreVal} pts ! Peux-tu battre mon score ?`;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(() => {});
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }
    copiedToast = 110;
    tone(880, 0.1, 'triangle', 0.07);
    haptic(15);
  }

  function drawOver() {
    overlay(0.91);
    txt(FIN && fi >= NF ? 'PARTIE TERMINEE' : 'FIN DE PARTIE', W / 2, 82, 20, '#ff0', 'center', true);

    const tt = PL.length ? PL.map(total) : [0];
    const top = Math.max(...tt);
    const compact = np > 2;
    const cardH = compact ? 66 : 96;
    const gap = compact ? 74 : 114;
    const startY = compact ? 132 : 175;

    PL.forEach((p, i) => {
      const y = startY + i * gap;
      const win = np > 1 && tt[i] === top && tt.filter(v => v === top).length === 1;
      const col = PLAYER_COLORS[i % PLAYER_COLORS.length];

      g.fillStyle = '#ffffff0c';
      g.fillRect(36, y - 18, W - 72, cardH);
      g.strokeStyle = win ? '#ff0' : col + '88';
      g.lineWidth = win ? 2.5 : 1.5;
      g.strokeRect(36, y - 18, W - 72, cardH);

      if (compact) {
        txt(playerLabel(i, false), 52, y + 4, 8.5, col, 'left', false);
        txt(String(tt[i]), W - 52, y + 8, 16, win ? '#ff0' : '#fff', 'right', true);
        txt(`STRIKES: ${p.strikes} • SPARES: ${p.spares} • SERIE: ${p.bestStreak}`, 52, y + 30, 6, '#ccc', 'left', false);
      } else {
        txt(playerLabel(i, false), W / 2, y + 2, 9.5, col, 'center', false);
        txt(String(tt[i]), W / 2, y + 36, 24, win || np === 1 ? '#ff0' : '#fff', 'center', true);
        txt(`STRIKES: ${p.strikes}  •  SPARES: ${p.spares}  •  SERIE: ${p.bestStreak}`, W / 2, y + 62, 6.8, '#ccc', 'center', false);
      }
    });

    const bannerY = Math.min(510, startY + PL.length * gap + 4);
    if (np > 1) {
      let w = '';
      if (tt.filter(v => v === top).length > 1) {
        w = 'EGALITE PARFAITE !';
      } else {
        const winIdx = tt.indexOf(top);
        w = playerLabel(winIdx, false) + ' GAGNE !';
      }
      txt(w, W / 2, bannerY, 9.5, '#0f8', 'center', false);
    } else if (!FIN && total(PL[0]) >= stats.best && stats.best > 0) {
      txt('* NOUVEAU RECORD PERSONNEL ! *', W / 2, bannerY, 9, '#0f8', 'center', false);
    }

    const btnBaseY = Math.max(525, bannerY + 22);
    btn(90, btnBaseY, 300, 48, 'REJOUER', Math.floor(tk / 28) % 2 === 0, () => startGame(false), 14, '#ff0');
    btn(90, btnBaseY + 58, 300, 40, copiedToast > 0 ? 'SCORE COPIE !' : 'COPIER LE SCORE', false, () => shareScore(top), 9.5, '#0f8');
    btn(90, btnBaseY + 108, 300, 40, 'MENU PRINCIPAL', false, () => {
      if (playType === 'online') closeNetwork();
      st = 'menu';
    }, 10, '#0ff');
  }

  function draw() {
    g.setTransform(Q, 0, 0, Q, 0, 0);
    hits = [];
    g.save();

    if (shake > 0.5) {
      g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    drawLane();
    if (st === 'aim') drawAim();

    const items = [];
    for (let i = 0; i < pins.length; i++) {
      const p = pins[i];
      if (!p.gone) items.push([p.y, () => drawPin(p)]);
    }
    for (let i = 0; i < bumpers.length; i++) {
      const b = bumpers[i];
      items.push([b.y, () => drawBumper(b)]);
    }
    if (ball) items.push([ball.y, drawBall]);
    items.sort((a, b) => a[0] - b[0]);
    for (let i = 0; i < items.length; i++) items[i][1]();

    drawSweeper();

    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      const [x, y, s] = P(p.x, p.y);
      g.globalAlpha = clamp(p.l / 22, 0, 1);
      g.fillStyle = p.c;
      g.fillRect(x, y - 8 * s, p.s * s * 1.5, p.s * s * 1.5);
    }
    g.globalAlpha = 1;

    for (let i = 0; i < texts.length; i++) {
      const t = texts[i];
      const [x, y] = P(t.x, t.y);
      g.globalAlpha = clamp(t.l / 22, 0, 1);
      txt(t.t, x, y - 30, 13, t.c, 'center', false, true);
    }
    g.globalAlpha = 1;

    if (flash > 0) {
      g.fillStyle = flashCol;
      g.globalAlpha = flash * 0.35;
      g.fillRect(0, 0, W, H);
      g.globalAlpha = 1;
    }

    g.restore();

    if (st !== 'menu' && st !== 'stats' && st !== 'online') {
      hud();
      drawPinRadar();
    }

    if (msgT > 0 && st !== 'over') {
      const sc = 1 + Math.sin(msgT / 4) * 0.04 + (msgT > 85 ? (msgT - 85) * 0.025 : 0);
      g.save();
      g.translate(W / 2, 375);
      g.scale(sc, sc);
      g.globalAlpha = clamp(msgT / 18, 0, 1);
      const sz = msg.length > 10 ? (msg.length > 15 ? 15 : 20) : 28;
      txt(msg, 0, 0, sz, msgC, 'center', false, true);
      if (msgSub) {
        txt(msgSub, 0, 26, 8.5, '#fff', 'center', false, true);
      }
      g.restore();
    }

    if (st === 'menu') drawMenu();
    if (st === 'stats') drawStats();
    if (st === 'online') drawOnline();
    if (st === 'pass') drawPass();
    if (st === 'over') drawOver();
  }

  /* ==========================================================================
     7. CONTROLES PC & MOBILE (CLIC/TAP + SWIPE TACTILE) & BOUCLE
     ========================================================================== */
  function cpos(e) {
    const r = cv.getBoundingClientRect();
    if (!r.width || !r.height) return;
    mx = ((e.clientX - r.left) / r.width) * W;
    my = ((e.clientY - r.top) / r.height) * H;
  }

  function ptr(move) {
    if (!canLocalControl()) return;
    const k = P(240, ball ? ball.y : 735)[2];
    ptrX = 240 + (mx - 240) / k;
    if (move && st === 'aim' && aimLock === 0) {
      px = clamp(ptrX, LL + BR + 4, LR - BR - 4);
      if (ball) ball.x = px;
    }
    if (st === 'roll') steerOn = true;
  }

  cv.addEventListener('pointermove', e => {
    cpos(e);
    if (Math.abs(mx - sx) > 10 || Math.abs(my - sy) > 10) moved = true;
    if (e.pointerType === 'mouse' || ptrDown) {
      if (!swipeMode) ptr(true);
    }
  });

  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    initAudio();
    cpos(e);
    ptrDown = true;
    sx = mx;
    sy = my;
    moved = false;
    hitBtn = false;
    swipeMode = false;

    for (let i = 0; i < hits.length; i++) {
      const h = hits[i];
      if (mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h) {
        hitBtn = true;
        h.fn();
        return;
      }
    }

    if (e.pointerType !== 'mouse' && st === 'aim' && canLocalControl() && my > 560 && my < 705) {
      swipeMode = true;
      swipeStartY = my;
      swipeStartX = mx;
      swipeTime = performance.now();
    }

    if (e.pointerType === 'mouse') {
      ptr(true);
      action();
    } else {
      ptr(false);
    }
  });

  function up(e) {
    if (!ptrDown) return;
    ptrDown = false;
    if (e.type === 'pointerup' && e.pointerType !== 'mouse' && !hitBtn) {
      if (swipeMode && st === 'aim' && canLocalControl()) {
        const dy = swipeStartY - my;
        const dx = mx - swipeStartX;
        const dt = Math.max(40, performance.now() - swipeTime);
        if (dy > 55) {
          aimA = clamp((dx / 190) * 0.42, -0.42, 0.42);
          const speed = dy / dt;
          power = clamp(0.45 + speed * 0.42, 0.4, 0.99);
          aimLock = 1;
          launch();
          swipeMode = false;
          steerOn = false;
          return;
        }
      }
      if (!moved) {
        action();
      }
    }
    swipeMode = false;
    if (e.pointerType !== 'mouse') steerOn = false;
  }

  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);

  window.addEventListener('keydown', e => {
    if (document.activeElement === nickInputEl) {
      if (e.code === 'Enter') nickInputEl.blur();
      return;
    }
    if (document.activeElement === roomInputEl) {
      if (e.code === 'Enter') joinRoomSubmit();
      return;
    }
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) {
      e.preventDefault();
    }
    if (e.code === 'Space' || e.code === 'Enter') {
      if (!e.repeat) action();
    }
    if (e.key === 'm' || e.key === 'M') {
      initAudio();
      mute = !mute;
    }
    if (e.key === 'Escape') {
      if (st === 'stats') st = 'menu';
      else if (st === 'online') { closeNetwork(); st = 'menu'; }
      else quit();
    }
    if (st === 'menu' && !e.repeat) {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') mrow = 1 - mrow;
      const d = (e.key === 'ArrowRight') - (e.key === 'ArrowLeft');
      if (d) {
        if (mrow === 0) mode = (mode + d + 3) % 3;
        else {
          const types = ['solo', 'bot', 'local', 'online'];
          const idx = (types.indexOf(playType) + d + 4) % 4;
          playType = types[idx];
          if (playType === 'solo') np = 1;
          else if (playType === 'bot') np = 2;
          else if (playType === 'local') np = localPlayers;
          else np = onlineCapacity;
        }
        tone(520, 0.06);
      }
    }
    keys[e.key] = true;
  });

  window.addEventListener('keyup', e => { keys[e.key] = false; });
  window.addEventListener('blur', () => {
    keys = {};
    ptrDown = false;
    steerOn = false;
    swipeMode = false;
  });

  rack();
  newBall();
  ball.x = -100;

  let last = performance.now();
  let acc = 0;

  function loop(now) {
    acc += Math.min(now - last, 50);
    last = now;
    let steps = 0;
    while (acc >= 16.667 && steps < 3) {
      update();
      acc -= 16.667;
      steps++;
    }
    if (steps === 3) acc = 0;
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
