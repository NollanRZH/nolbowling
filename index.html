<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NolBowling</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #04010c;
    overflow: hidden;
    font-family: 'Press Start 2P', monospace;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 35%, #230754 0%, #09021c 55%, #03000a 100%);
  }
  canvas {
    display: block;
    box-shadow: 0 0 60px rgba(255, 0, 255, 0.45), 0 0 0 3px #ff00ff, 0 0 0 7px rgba(0, 255, 255, 0.35);
    border-radius: 16px;
    cursor: pointer;
  }
  #crt {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at center, transparent 60%, rgba(0, 0, 0, 0.45) 100%),
      repeating-linear-gradient(0deg, rgba(0, 0, 0, 0.2) 0 1px, transparent 1px 3px);
    mix-blend-mode: multiply;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c"></canvas>
  <div id="crt"></div>
  <!-- Champ de saisie flottant pour le code du salon P2P -->
  <input id="roomInput" type="text" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false"
    style="display:none;position:absolute;top:46%;left:50%;transform:translate(-50%,-50%);width:170px;height:44px;background:#0b0428;border:2px solid #00ffff;border-radius:8px;color:#ffff00;font-family:'Press Start 2P',monospace;font-size:18px;text-align:center;text-transform:uppercase;outline:none;box-shadow:0 0 20px #00ffff66;z-index:20;">
</div>
<script>
(() => {
  'use strict';

  /* ==========================================================================
     1. CONFIGURATION & ÉTAT GLOBAL
     ========================================================================== */
  const cv = document.getElementById('c');
  const g = cv.getContext('2d');
  const W = 480, H = 800;
  const Q = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
  cv.width = W * Q;
  cv.height = H * Q;

  function fit() {
    const s = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.98;
    cv.style.width = (W * s) + 'px';
    cv.style.height = (H * s) + 'px';
  }
  window.addEventListener('resize', fit);
  fit();
  try { document.fonts.load("10px 'Press Start 2P'"); } catch (e) {}

  const LL = 90, LR = 390, BR = 16, PR = 12;
  const FONT = "'Press Start 2P', monospace";
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  const MODES = [
    { n: 'INFINI', f: 0, d: 'SANS FIN • OBSTACLES • RECORD' },
    { n: '5 FRAMES', f: 5, d: 'PARTIE RAPIDE EN 5 FRAMES' },
    { n: '10 FRAMES', f: 10, d: 'RÈGLES OFFICIELLES • 10 FRAMES' }
  ];

  const SKINS = [
    { id: 'cyan', name: 'CYBER CYAN', c1: '#ffffff', c2: '#00ffff', c3: '#6600ff', glow: '#00ffff', trail: '#00ffff', req: 0 },
    { id: 'magenta', name: 'PLASMA PINK', c1: '#ffffff', c2: '#ff22ee', c3: '#660044', glow: '#ff00ff', trail: '#ff44ff', req: 0 },
    { id: 'gold', name: 'SOLAR GOLD', c1: '#ffffdd', c2: '#ffcc00', c3: '#cc4400', glow: '#ffaa00', trail: '#ffdd00', req: 3 },
    { id: 'matrix', name: 'VOID MATRIX', c1: '#ccffcc', c2: '#00ff66', c3: '#003311', glow: '#00ff88', trail: '#00ff66', req: 10 }
  ];

  // Sauvegarde locale persistante
  let stats = {
    best: 0,
    strikes: 0,
    spares: 0,
    maxStreak: 0,
    games: 0,
    skin: 0
  };
  try {
    const saved = JSON.parse(localStorage.getItem('nb_stats_v2') || 'null');
    if (saved) stats = { ...stats, ...saved };
    else {
      const oldBest = +localStorage.getItem('nb_best') || 0;
      if (oldBest > 0) stats.best = oldBest;
    }
  } catch (e) {}

  function saveStats() {
    try { localStorage.setItem('nb_stats_v2', JSON.stringify(stats)); } catch (e) {}
  }

  // Étoiles de fond synthwave
  const STARS = Array.from({ length: 42 }, () => ({
    x: Math.random() * W,
    y: 88 + Math.random() * 140,
    s: Math.random() * 1.8 + 0.6,
    ph: Math.random() * 6.28
  }));

  // Variables d'état du jeu
  let st = 'menu'; // 'menu' | 'stats' | 'online' | 'aim' | 'roll' | 'between' | 'pass' | 'over'
  let tk = 0;
  let mode = 0, np = 1, mrow = 0;
  let playType = 'solo'; // 'solo' | 'bot' | 'local' | 'online'
  let botDiff = 1; // 0: ROOKIE, 1: PRO, 2: CYBER-PRO
  const BOT_LEVELS = [
    { n: 'ROOKIE', desc: 'IA DÉBUTANTE • FAIT DES ERREURS', errPos: 34, errAng: 0.16, errPow: 0.24, spinSkill: 0.2 },
    { n: 'PRO', desc: 'IA ÉQUILIBRÉE • VISE LES SPARES', errPos: 14, errAng: 0.065, errPow: 0.09, spinSkill: 0.65 },
    { n: 'CYBER-PRO', desc: 'IA EXPERTE • POCHE 1-3 & EFFET', errPos: 4, errAng: 0.02, errPow: 0.03, spinSkill: 0.95 }
  ];

  let NF = 0, FIN = false;
  let PL = [], cp = 0, fi = 0, fr = [], sb = 10, turnChg = false, level = 1;
  let pins = [], ball = null, bumpers = [], parts = [], texts = [], trails = [];
  let shake = 0, flash = 0, flashCol = '#fff';
  let overAt = 0;
  let aimA = 0, aimPh = 0, powPh = 0, power = 0, aimLock = 0;
  let px = 240, ptrX = 240, steerOn = false, keys = {};
  let calmT = 0, settleT = 0, wait = 0;
  let msg = '', msgSub = '', msgC = '#ff0', msgT = 0;
  let gutter = false;
  let mute = false, musicOn = true;
  let hits = [], mx = -1, my = -1, ptrDown = false, sx = 0, moved = false, hitBtn = false;
  let copiedToast = 0;

  // État de l'IA (Bot)
  let botPlan = null;

  // État Multijoueur P2P (PeerJS / WebRTC)
  let peer = null, conn = null;
  let netRole = null; // 'host' (J1) | 'guest' (J2)
  let netStatus = 'PRÊT À CONNECTER';
  let roomCode = '';
  let onlineSub = 'choice'; // 'choice' | 'hosting' | 'joining'
  let netSyncTimer = 0;
  let remoteEndPending = null;
  const roomInputEl = document.getElementById('roomInput');

  // Animation de la balayeuse mécanique (Pinsetter)
  let sweeper = { active: false, t: 0, dur: 54, resetRack: false, cleared: false };

  /* ==========================================================================
     2. AUDIO SYNTHWAVE & SOUND DESIGN (WEB AUDIO API)
     ========================================================================== */
  let ac = null;
  let rollNode = null, rollGain = null, rollFilter = null;
  let musicTimer = null, musicStep = 0;

  function initAudio() {
    if (!ac) {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (Ctx) ac = new Ctx();
    }
    if (ac && ac.state === 'suspended') ac.resume();
    setupRollSound();
  }

  function setupRollSound() {
    if (!ac || rollNode) return;
    try {
      const bufferSize = ac.sampleRate * 2;
      const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

      rollNode = ac.createBufferSource();
      rollNode.buffer = buffer;
      rollNode.loop = true;

      rollFilter = ac.createBiquadFilter();
      rollFilter.type = 'lowpass';
      rollFilter.frequency.value = 120;

      rollGain = ac.createGain();
      rollGain.gain.value = 0.0001;

      rollNode.connect(rollFilter);
      rollFilter.connect(rollGain);
      rollGain.connect(ac.destination);
      rollNode.start();
    } catch (e) {}
  }

  function updateRollAudio() {
    if (!ac || !rollGain || !rollFilter) return;
    const T = ac.currentTime;
    if (!mute && st === 'roll' && ball && ball.rolling && !gutter) {
      const sp = Math.hypot(ball.vx, ball.vy);
      const norm = clamp(sp / 16, 0, 1);
      rollGain.gain.setTargetAtTime(0.02 + norm * 0.055, T, 0.05);
      rollFilter.frequency.setTargetAtTime(90 + norm * 240, T, 0.05);
    } else {
      rollGain.gain.setTargetAtTime(0.0001, T, 0.06);
    }
  }

  function tone(f, d = 0.1, ty = 'square', v = 0.06, sl = 0) {
    if (mute) return;
    try {
      initAudio();
      if (!ac) return;
      const o = ac.createOscillator();
      const n = ac.createGain();
      const T = ac.currentTime;
      o.type = ty;
      o.frequency.setValueAtTime(f, T);
      if (sl) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + sl), T + d);
      n.gain.setValueAtTime(v, T);
      n.gain.exponentialRampToValueAtTime(0.001, T + d);
      o.connect(n);
      n.connect(ac.destination);
      o.start();
      o.stop(T + d);
    } catch (e) {}
  }

  const arp = (a, s = 65, ty = 'square', v = 0.065) =>
    a.forEach((f, i) => setTimeout(() => tone(f, 0.15, ty, v), i * s));

  // Séquenceur Synthwave léger en arrière-plan
  const BASS_SEQ = [
    110, 110, 220, 110, 130.81, 130.81, 261.63, 130.81,
    87.31, 87.31, 174.61, 87.31, 98.00, 98.00, 196.00, 146.83
  ];
  const LEAD_SEQ = [
    440, 0, 523.25, 0, 659.25, 0, 587.33, 523.25,
    349.23, 0, 440, 0, 392.00, 0, 493.88, 0
  ];

  function startMusicLoop() {
    if (musicTimer) return;
    musicTimer = setInterval(() => {
      if (mute || !musicOn || !ac || ac.state !== 'running') return;
      const step = musicStep % 16;
      const bass = BASS_SEQ[step];
      if (bass) tone(bass, 0.14, 'sawtooth', 0.018);
      if (st !== 'roll') {
        const lead = LEAD_SEQ[step];
        if (lead && (musicStep % 32 >= 16 || step % 4 === 0)) {
          tone(lead, 0.18, 'triangle', 0.016);
        }
      }
      musicStep++;
    }, 175);
  }
  startMusicLoop();

  /* ==========================================================================
     3. RÈGLES OFFICIELLES DE BOWLING & CALCUL DU SCORE
     ========================================================================== */
  const f0 = v => (v === 0 ? '-' : '' + v);

  function calc(p) {
    const r = p.rolls;
    const out = [];
    let i = 0, tot = 0;

    for (let f = 0; i < r.length && (!FIN || f < NF); f++) {
      const c = { m: [], t: null };
      if (FIN && f === NF - 1) {
        const s = r.slice(i);
        const [a, b, d] = s;
        c.m = [a === 10 ? 'X' : f0(a)];
        if (b !== undefined) {
          c.m.push(a === 10 ? (b === 10 ? 'X' : f0(b)) : (a + b === 10 ? '/' : f0(b)));
        }
        if (d !== undefined) {
          c.m.push(
            a === 10
              ? (b === 10 ? (d === 10 ? 'X' : f0(d)) : (b + d === 10 ? '/' : f0(d)))
              : (d === 10 ? 'X' : f0(d))
          );
        }
        tot += s.reduce((x, y) => x + y, 0);
        c.t = tot;
        i = r.length;
      } else if (r[i] === 10) {
        c.m = ['X'];
        if (r[i + 2] !== undefined) {
          tot += 10 + r[i + 1] + r[i + 2];
          c.t = tot;
        }
        i++;
      } else if (r[i + 1] !== undefined) {
        const s = r[i] + r[i + 1];
        if (s === 10) {
          c.m = [f0(r[i]), '/'];
          if (r[i + 2] !== undefined) {
            tot += 10 + r[i + 2];
            c.t = tot;
          }
        } else {
          c.m = [f0(r[i]), f0(r[i + 1])];
          tot += s;
          c.t = tot;
        }
        i += 2;
      } else {
        c.m = [f0(r[i])];
        i++;
      }
      out.push(c);
    }
    return { fr: out, tot };
  }

  const total = p => calc(p).tot + p.bonus;

  /* ==========================================================================
     4. LOGIQUE DU JEU, PHYSIQUE & OBSTACLES
     ========================================================================== */
  const isBotTurn = () => playType === 'bot' && cp === 1;
  const isMyNetTurn = () => playType !== 'online' || (netRole === 'host' && cp === 0) || (netRole === 'guest' && cp === 1);
  const canLocalControl = () => !isBotTurn() && isMyNetTurn();

  function netSend(data) {
    if (playType === 'online' && conn && conn.open) {
      try { conn.send(data); } catch (e) {}
    }
  }

  function closeNetwork() {
    roomInputEl.style.display = 'none';
    if (conn) { try { conn.close(); } catch (e) {} conn = null; }
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    netRole = null;
    roomCode = '';
    onlineSub = 'choice';
  }

  function genCode() {
    const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    let s = '';
    for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
    return s;
  }

  function setupConn(connection) {
    conn = connection;
    conn.on('open', () => {
      netStatus = 'CONNECTÉ !';
      arp([523.25, 659.25, 783.99], 60);
      if (netRole === 'host') {
        netSend({ type: 'start', mode, seed: Date.now() });
        startGame(true);
      }
    });
    conn.on('data', d => handleNetData(d));
    conn.on('close', () => {
      if (playType === 'online' && st !== 'menu' && st !== 'over') {
        say('ADVERSAIRE DÉCONNECTÉ', '#f35', 140, 'RETOUR AU MENU');
        setTimeout(() => { closeNetwork(); st = 'menu'; }, 1800);
      }
      netStatus = 'CONNEXION FERMÉE';
    });
    conn.on('error', () => {
      netStatus = 'ERREUR RÉSEAU';
    });
  }

  function hostRoom() {
    closeNetwork();
    if (typeof Peer === 'undefined') {
      netStatus = 'PEERJS INDISPONIBLE';
      return;
    }
    netRole = 'host';
    onlineSub = 'hosting';
    roomCode = genCode();
    netStatus = 'CRÉATION DU SALON...';
    peer = new Peer('nolbowl-' + roomCode);
    peer.on('open', () => {
      netStatus = 'EN ATTENTE D\'UN AMI...';
    });
    peer.on('connection', c => {
      setupConn(c);
    });
    peer.on('error', err => {
      if (err && err.type === 'unavailable-id') {
        hostRoom();
      } else {
        netStatus = 'ERREUR : ' + (err.type || 'RÉSEAU');
      }
    });
  }

  function openJoinRoom() {
    closeNetwork();
    netRole = 'guest';
    onlineSub = 'joining';
    netStatus = 'ENTRE LE CODE À 4 LETTRES';
    roomInputEl.value = '';
    roomInputEl.style.display = 'block';
    setTimeout(() => roomInputEl.focus(), 50);
  }

  function joinRoomSubmit() {
    const code = roomInputEl.value.trim().toUpperCase();
    if (code.length !== 4) {
      netStatus = 'CODE INVALIDE (4 CAR.)';
      tone(150, 0.2, 'sawtooth');
      return;
    }
    if (typeof Peer === 'undefined') {
      netStatus = 'PEERJS INDISPONIBLE';
      return;
    }
    roomInputEl.style.display = 'none';
    roomCode = code;
    netStatus = 'CONNEXION À NOL-' + code + '...';
    peer = new Peer();
    peer.on('open', () => {
      const c = peer.connect('nolbowl-' + code, { reliable: true });
      setupConn(c);
    });
    peer.on('error', () => {
      netStatus = 'SALON INTROUVABLE';
      tone(150, 0.25, 'sawtooth');
    });
  }

  function handleNetData(d) {
    if (!d || typeof d !== 'object') return;
    if (d.type === 'start') {
      mode = d.mode;
      roomInputEl.style.display = 'none';
      startGame(true);
    } else if (d.type === 'aim') {
      if (!isMyNetTurn() && st === 'aim') {
        px = d.px;
        if (ball) ball.x = px;
        aimLock = d.aimLock;
        aimA = d.aimA;
        power = d.power;
      }
    } else if (d.type === 'launch') {
      if (!isMyNetTurn() && st === 'aim') {
        px = d.px;
        ball.x = d.px;
        ball.y = 735;
        ball.vx = d.vx;
        ball.vy = d.vy;
        ball.spin = d.spin || 0;
        ball.rolling = true;
        aimA = d.aimA;
        power = d.power;
        st = 'roll';
        settleT = 0;
        sb = pins.filter(p => !p.gone).length;
        tone(180, 0.35, 'sawtooth', 0.08, -100);
        if (d.perfect) {
          say('PUISSANCE PARFAITE', '#0f8', 55, !FIN ? '+25 PTS BONUS' : 'TRAJECTOIRE OPTIMALE');
          if (!FIN) PL[cp].bonus += 25;
        }
      }
    } else if (d.type === 'roll_sync') {
      if (!isMyNetTurn() && st === 'roll' && ball && ball.rolling) {
        ball.x = d.bx;
        ball.y = d.by;
        ball.vx = d.vx;
        ball.vy = d.vy;
        ball.spin = d.spin;
      }
    } else if (d.type === 'throw_res') {
      // Synchronisation autoritaire des quilles tombées pour éviter toute divergence P2P
      if (!isMyNetTurn()) {
        if (st === 'roll') {
          remoteEndPending = d;
          endThrow(d);
        } else if (st === 'between') {
          // Correction éventuelle si déjà passé à between
          pins.forEach((p, idx) => {
            if (d.pins[idx]) {
              p.down = d.pins[idx].down;
              p.gone = d.pins[idx].gone;
            }
          });
        }
      }
    } else if (d.type === 'rematch') {
      startGame(true);
    }
  }

  function rack() {
    pins = [];
    let num = 1;
    // Disposition officielle des 10 quilles (1 devant, 7-8-9-10 au fond)
    for (let i = 0; i < 4; i++) {
      for (let j = 0; j <= i; j++) {
        const x = 240 + (j - i / 2) * 36;
        const y = 275 - i * 30;
        pins.push({
          id: num++,
          row: i,
          col: j,
          x, y, ox: x, oy: y,
          vx: 0, vy: 0,
          down: false,
          gone: false,
          hit: false,
          imp: 0,
          ang: 0,
          dir: 1,
          wob: 0
        });
      }
    }
  }

  function setBumpers() {
    bumpers = [];
    if (FIN || level < 2) return;
    // Ajout progressif de bumpers néon mobiles en mode Infini
    const count = Math.min(3, Math.floor(level / 2));
    for (let i = 0; i < count; i++) {
      const y = 415 - i * 52;
      const amp = 65 + (i % 2) * 25;
      bumpers.push({
        cx: 240,
        x: 240,
        y,
        r: 13,
        amp,
        sp: 1.3 + level * 0.14 + i * 0.25,
        ph: i * 2.1,
        hitCd: 0
      });
    }
  }

  function newBall() {
    ball = {
      x: px,
      y: 735,
      vx: 0,
      vy: 0,
      r: BR,
      rolling: false,
      spin: 0,
      rot: 0,
      bumperHits: 0
    };
    gutter = false;
    trails = [];
  }

  function newThrow() {
    st = 'aim';
    aimLock = 0;
    power = 0;
    powPh = 0;
    calmT = 0;
    settleT = 0;
    remoteEndPending = null;
    newBall();
    if (isBotTurn()) {
      planBotShot();
    } else {
      botPlan = null;
    }
  }

  // Planification intelligente du lancer du Bot selon la difficulté et les quilles restantes
  function planBotShot() {
    const cfg = BOT_LEVELS[botDiff];
    const standing = pins.filter(p => !p.gone);
    let targetX = 240;

    if (standing.length === 10) {
      // 1er lancer : vise la poche 1-3 (légèrement à droite du centre) avec un léger effet
      targetX = 248;
    } else if (standing.length > 0) {
      // 2e lancer : vise le barycentre des quilles restantes
      const avgX = standing.reduce((acc, p) => acc + p.ox, 0) / standing.length;
      targetX = avgX;
    }

    // Erreur contrôlée selon le niveau du Bot
    const randErr = () => (Math.random() - 0.5) * 2;
    const chosenPx = clamp(targetX + randErr() * cfg.errPos * 0.6, LL + BR + 12, LR - BR - 12);
    const dx = targetX - chosenPx;
    const dy = 250 - 735;
    const idealAngle = clamp(Math.atan2(dx, -dy) + randErr() * cfg.errAng, -0.38, 0.38);
    const idealPower = clamp(0.88 + randErr() * cfg.errPow, 0.45, 0.99);
    const idealSpin = clamp((-idealAngle * 0.8 + randErr() * (1 - cfg.spinSkill) * 0.5) * cfg.spinSkill, -0.75, 0.75);

    botPlan = {
      timer: 0,
      targetPx: chosenPx,
      targetAng: idealAngle,
      targetPow: idealPower,
      targetSpin: idealSpin,
      phase: 'move' // 'move' -> 'angle' -> 'power'
    };
  }

  function startGame(fromNet = false) {
    initAudio();
    roomInputEl.style.display = 'none';
    if (playType === 'online' && !fromNet) {
      netSend({ type: 'rematch' });
    }
    const m = MODES[mode];
    NF = m.f;
    FIN = NF > 0;
    np = playType === 'solo' ? 1 : 2;
    PL = [];
    for (let i = 0; i < np; i++) {
      PL.push({
        rolls: [],
        bonus: 0,
        strikes: 0,
        spares: 0,
        streak: 0,
        bestStreak: 0,
        opens: 0
      });
    }
    cp = 0;
    fi = 0;
    fr = [];
    level = 1;
    px = 240;
    texts = [];
    parts = [];
    trails = [];
    msgT = 0;
    turnChg = false;
    sweeper.active = false;
    rack();
    setBumpers();
    newThrow();
    arp([392, 523.25, 659.25, 783.99], 75);
  }

  const spd = () => (FIN ? 1 : Math.min(1.95, 1 + (level - 1) * 0.08));

  function say(m, c = '#ff0', t = 95, sub = '') {
    msg = m;
    msgSub = sub;
    msgC = c;
    msgT = t;
  }

  function burst(x, y, n, col, s = 4) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.283;
      const v = Math.random() * s + 0.6;
      parts.push({
        x, y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v,
        l: 28 + Math.random() * 28,
        c: col,
        s: Math.random() * 3.2 + 1.2
      });
    }
  }

  function pop(x, y, t, c = '#0ff') {
    texts.push({ x, y, t, c, l: 64 });
  }

  function quit() {
    if (st === 'menu' || st === 'stats' || st === 'online' || st === 'over') return;
    if (playType === 'online') closeNetwork();
    st = 'over';
    overAt = tk;
    if (ball) ball.x = -100;
  }

  function action() {
    initAudio();
    if (st === 'over' && tk - overAt < 65) return;
    if (st === 'menu') {
      if (playType === 'online') {
        st = 'online';
        onlineSub = 'choice';
        netStatus = 'PRÊT À CONNECTER';
      } else {
        startGame();
      }
      return;
    }
    if (st === 'stats') { st = 'menu'; return; }
    if (st === 'over') { startGame(); return; }
    if (st === 'pass') { newThrow(); return; }
    if (st === 'aim') {
      if (!canLocalControl()) return;
      if (aimLock === 0) {
        aimLock = 1;
        powPh = 0;
        tone(660, 0.08, 'square', 0.07);
        netSend({ type: 'aim', px, aimLock, aimA, power });
      } else {
        launch();
      }
    }
  }

  function launch() {
    const s = 7.2 + power * 9.2;
    ball.vx = Math.sin(aimA) * s;
    ball.vy = -Math.cos(aimA) * s;
    ball.rolling = true;
    st = 'roll';
    settleT = 0;
    steerOn = false;
    sb = pins.filter(p => !p.gone).length;
    tone(180, 0.35, 'sawtooth', 0.08, -100);

    const isPerfect = power > 0.86 && power < 0.98;
    // Zone verte (86% - 98%) : puissance parfaite
    if (isPerfect) {
      say('PUISSANCE PARFAITE', '#0f8', 55, !FIN ? '+25 PTS BONUS' : 'TRAJECTOIRE OPTIMALE');
      if (!FIN) PL[cp].bonus += 25;
      flash = 0.25;
      flashCol = '#00ff88';
      tone(987.77, 0.12, 'triangle', 0.08);
    }

    if (playType === 'online' && isMyNetTurn()) {
      netSend({
        type: 'launch',
        px: ball.x,
        vx: ball.vx,
        vy: ball.vy,
        spin: ball.spin,
        aimA,
        power,
        perfect: isPerfect
      });
    }
  }

  function collide(a, b, ma, mb, e) {
    const dx = b.x - a.x;
    const dy = b.y - a.y;
    const d = Math.hypot(dx, dy);
    const R = a.r + b.r;
    if (d >= R || d === 0) return 0;

    const nx = dx / d;
    const ny = dy / d;
    const ov = R - d;
    const tm = ma + mb;

    a.x -= nx * ov * mb / tm;
    a.y -= ny * ov * mb / tm;
    b.x += nx * ov * ma / tm;
    b.y += ny * ov * ma / tm;

    const vn = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
    if (vn > 0) {
      const j = (1 + e) * vn / (1 / ma + 1 / mb);
      a.vx -= j * nx / ma;
      a.vy -= j * ny / ma;
      b.vx += j * nx / mb;
      b.vy += j * ny / mb;
      return vn;
    }
    return 0.01;
  }

  // Détection d'un Split (quille 1 tombée et quilles restantes espacées)
  function checkSplit(standing) {
    if (standing.length < 2 || standing.length > 4) return false;
    const headPinUp = standing.some(p => p.id === 1);
    if (headPinUp) return false;
    let maxDist = 0;
    for (let i = 0; i < standing.length; i++) {
      for (let j = i + 1; j < standing.length; j++) {
        const d = Math.hypot(standing[i].ox - standing[j].ox, standing[i].oy - standing[j].oy);
        if (d > maxDist) maxDist = d;
      }
    }
    return maxDist >= 68;
  }

  function triggerSweeper(resetRack) {
    sweeper.active = true;
    sweeper.t = 0;
    sweeper.resetRack = resetRack;
    sweeper.cleared = false;
  }

  function endThrow(netOverride = null) {
    if (netOverride && netOverride.pins) {
      pins.forEach((p, idx) => {
        if (netOverride.pins[idx]) {
          p.down = netOverride.pins[idx].down;
          p.gone = netOverride.pins[idx].gone;
        }
      });
      gutter = !!netOverride.gutter;
    } else if (playType === 'online' && isMyNetTurn()) {
      netSend({
        type: 'throw_res',
        gutter,
        pins: pins.map(p => ({ down: p.down, gone: p.gone }))
      });
    }

    const dn = pins.filter(p => p.down && !p.gone);
    const n = dn.length;
    const standing = pins.filter(p => !p.down && !p.gone);
    const left = standing.length;
    const pl = PL[cp];

    pl.rolls.push(n);
    fr.push(n);

    let done = false;
    let reset = false;

    if (FIN && fi === NF - 1) {
      const t = fr.length, a = fr[0];
      if (t === 1) {
        reset = a === 10;
        done = false;
      } else if (t === 2) {
        if (a === 10) {
          reset = fr[1] === 10;
          done = false;
        } else if (a + fr[1] === 10) {
          reset = true;
          done = false;
        } else {
          done = true;
        }
      } else {
        done = true;
      }
    } else {
      done = left === 0 || fr.length === 2;
    }

    // Gestion des annonces, séries, stats et effets
    const isStrike = sb === 10 && n === 10;
    const isSpare = !isStrike && sb < 10 && left === 0;

    if (isStrike) {
      pl.strikes++;
      pl.streak++;
      if (pl.streak > pl.bestStreak) pl.bestStreak = pl.streak;
      if (np === 1) {
        stats.strikes++;
        if (pl.streak > stats.maxStreak) stats.maxStreak = pl.streak;
      }

      const streakNames = ['', 'STRIKE !!!', 'DOUBLE STRIKE !!', 'TURKEY !!!', 'FOUR-BAGGER !!', 'MEGA STREAK !!'];
      const title = streakNames[Math.min(pl.streak, streakNames.length - 1)];
      let sub = '';
      if (!FIN && pl.streak > 1) {
        const comboBonus = (pl.streak - 1) * 50;
        pl.bonus += comboBonus;
        sub = 'SÉRIE x' + pl.streak + ' (+' + comboBonus + ' PTS)';
      } else if (ball.bumperHits > 0 && !FIN) {
        const bBonus = ball.bumperHits * 30;
        pl.bonus += bBonus;
        sub = 'RICOCHET BONUS +' + bBonus;
      }

      say(title, '#ff0', 115, sub);
      shake = 24;
      flash = 0.45;
      flashCol = '#ff00ff';
      arp([523.25, 659.25, 783.99, 1046.5, 1318.5], 55, 'sawtooth', 0.075);
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          burst(80 + Math.random() * 320, 150 + Math.random() * 230, 38, ['#f0f', '#0ff', '#ff0', '#0f8'][i % 4], 6.5);
        }, i * 110);
      }
    } else if (isSpare) {
      pl.spares++;
      pl.streak = 0;
      if (np === 1) stats.spares++;
      say('SPARE !', '#0ff', 95, 'BELLE RÉCUPÉRATION');
      shake = 11;
      flash = 0.3;
      flashCol = '#00ffff';
      arp([440, 554.37, 659.25, 880], 65, 'square', 0.07);
      burst(240, 250, 55, '#0ff', 5.5);
    } else {
      if (done) {
        pl.streak = 0;
        pl.opens++;
      }
      if (n === 0) {
        say(gutter ? 'GOUTTIÈRE...' : 'RATÉ...', '#f35', 75, gutter ? 'GARDE LE CENTRE !' : '');
        tone(140, 0.38, 'sawtooth', 0.08, -85);
      } else if (!done && checkSplit(standing)) {
        const is710 = standing.length === 2 && standing.some(p => p.id === 7) && standing.some(p => p.id === 10);
        say(is710 ? 'SPLIT 7-10 !' : 'SPLIT !', '#ff6600', 85, n + ' QUILLE' + (n > 1 ? 'S' : '') + ' • BONNE CHANCE');
        arp([330, 293.66, 261.63], 70, 'triangle', 0.06);
      } else {
        say(n + (n > 1 ? ' QUILLES' : ' QUILLE'), '#fff', 55, left > 0 && !done ? left + ' RESTANTE' + (left > 1 ? 'S' : '') : '');
        tone(480 + n * 42, 0.12);
      }
    }

    if (n > 0) pop(240, 295, '+' + n, isStrike ? '#ff0' : '#0ff');

    if (!FIN && np === 1) {
      const t = total(pl);
      if (t > stats.best) stats.best = t;
    }
    saveStats();

    const oldL = level;
    let shouldResetRack = false;

    if (done) {
      fr = [];
      cp++;
      if (cp >= np) {
        cp = 0;
        fi++;
      }
      turnChg = playType === 'local' && np > 1;
      shouldResetRack = true;
      level = FIN ? 1 : 1 + Math.floor(fi / 2);
      setBumpers();
      if (level > oldL) {
        setTimeout(() => {
          if (st !== 'menu' && st !== 'over') {
            say('NIVEAU ' + level + ' !', '#f0f', 95, 'OBSTACLES & VITESSE +');
            arp([392, 493.88, 587.33, 783.99], 85, 'triangle', 0.075);
          }
        }, 750);
      }
    } else if (reset) {
      shouldResetRack = true;
    }

    // Déclenche la balayeuse mécanique néon pour nettoyer les quilles tombées
    triggerSweeper(shouldResetRack);

    ball.x = -100;
    st = 'between';
    wait = 96;
  }

  function ballPins() {
    if (!ball.rolling || gutter) return;
    for (const p of pins) {
      if (p.gone) continue;
      const o = { x: p.x, y: p.y, r: PR, vx: p.vx, vy: p.vy };
      const v = collide(ball, o, 5.2, 1, 0.68);
      if (v) {
        p.x = o.x; p.y = o.y; p.vx = o.vx; p.vy = o.vy;
        if (v > 0.25) {
          p.imp += v;
          p.wob = Math.min(3.5, Math.max(p.wob, v / 2.8));
          if (!p.hit) {
            p.hit = true;
            burst(p.x, p.y, 7, '#fff', 3.5);
            tone(280 + Math.random() * 480, 0.075, 'square', 0.055);
          }
          shake = Math.max(shake, Math.min(9, v * 1.1));
        }
      }
    }
  }

  function ballBumpers() {
    if (!ball.rolling || gutter) return;
    for (const b of bumpers) {
      if (b.hitCd > 0) b.hitCd--;
      const bo = { x: b.x, y: b.y, r: b.r, vx: 0, vy: 0 };
      const v = collide(ball, bo, 1, 100, 0.92);
      if (v > 0 && b.hitCd === 0) {
        b.hitCd = 14;
        ball.bumperHits++;
        // Assure que la boule continue toujours vers les quilles
        if (ball.vy > -4.5) ball.vy = -6.5;
        burst(b.x, b.y, 16, '#f0f', 4.5);
        pop(b.x, b.y - 10, '+30', '#f0f');
        if (!FIN) PL[cp].bonus += 30;
        tone(880, 0.12, 'sawtooth', 0.07, 220);
        shake = Math.max(shake, 6);
      }
    }
  }

  function pinPhysics() {
    const live = pins.filter(p => !p.gone);
    for (let i = 0; i < live.length; i++) {
      for (let j = i + 1; j < live.length; j++) {
        const a = live[i], b = live[j];
        const A = { x: a.x, y: a.y, r: PR, vx: a.vx, vy: a.vy };
        const B = { x: b.x, y: b.y, r: PR, vx: b.vx, vy: b.vy };
        const v = collide(A, B, 1, 1, 0.78);
        if (v) {
          a.x = A.x; a.y = A.y; a.vx = A.vx; a.vy = A.vy;
          b.x = B.x; b.y = B.y; b.vx = B.vx; b.vy = B.vy;
          if (v > 0.3) {
            a.imp += v;
            b.imp += v;
            a.wob = Math.max(a.wob, Math.min(3.5, v / 2.8));
            b.wob = Math.max(b.wob, Math.min(3.5, v / 2.8));
          }
          if (v > 1.4) tone(240 + Math.random() * 420, 0.05, 'square', 0.032);
        }
      }
    }

    live.forEach(p => {
      p.x += p.vx / 3;
      p.y += p.vy / 3;
      if (p.x < 64) { p.x = 64; p.vx = Math.abs(p.vx) * 0.45; }
      if (p.x > 416) { p.x = 416; p.vx = -Math.abs(p.vx) * 0.45; }
      if (p.y < 46) { p.y = 46; p.vy = Math.abs(p.vy) * 0.45; }

      if (!p.down && (p.imp > 3.1 || Math.hypot(p.x - p.ox, p.y - p.oy) > 14.5)) {
        p.down = true;
        p.dir = p.vx < 0 ? -1 : 1;
        burst(p.x, p.y, 9, '#ff0', 3.4);
      }
      if (p.down) p.ang += (p.dir * 1.55 - p.ang) * 0.045;
      else p.wob *= 0.985;
    });
  }

  function update() {
    tk++;
    bumpers.forEach(b => {
      b.x = b.cx + Math.sin((tk / 60) * b.sp + b.ph) * b.amp;
    });

    if (shake > 0) shake *= 0.9;
    if (flash > 0) flash = Math.max(0, flash - 0.025);
    if (msgT > 0) msgT--;
    if (copiedToast > 0) copiedToast--;

    // Mise à jour de la balayeuse mécanique
    if (sweeper.active) {
      sweeper.t++;
      const half = sweeper.dur / 2;
      if (sweeper.t >= half && !sweeper.cleared) {
        sweeper.cleared = true;
        pins.forEach(p => { if (p.down) p.gone = true; });
        if (sweeper.resetRack) rack();
      }
      if (sweeper.t >= sweeper.dur) {
        sweeper.active = false;
      }
    }

    if (st === 'aim') {
      if (isBotTurn() && botPlan) {
        // Exécution fluide des décisions du Bot
        botPlan.timer++;
        if (botPlan.phase === 'move') {
          px += (botPlan.targetPx - px) * 0.14;
          ball.x = px;
          aimPh += 0.045 * spd();
          aimA = Math.sin(aimPh) * 0.42;
          if (Math.abs(px - botPlan.targetPx) < 1.5 && botPlan.timer > 32) {
            px = botPlan.targetPx;
            ball.x = px;
            botPlan.phase = 'angle';
          }
        } else if (botPlan.phase === 'angle') {
          aimPh += 0.045 * spd();
          aimA = Math.sin(aimPh) * 0.42;
          if (Math.abs(aimA - botPlan.targetAng) < 0.035 || botPlan.timer > 110) {
            aimA = botPlan.targetAng;
            aimLock = 1;
            powPh = 0;
            tone(660, 0.08, 'square', 0.07);
            botPlan.phase = 'power';
          }
        } else if (botPlan.phase === 'power') {
          powPh += 0.072 * spd();
          power = (Math.sin(powPh - 1.57) + 1) / 2;
          if (Math.abs(power - botPlan.targetPow) < 0.045 || botPlan.timer > 185) {
            power = botPlan.targetPow;
            launch();
          }
        }
      } else if (canLocalControl()) {
        if (aimLock === 0) {
          if (keys.ArrowLeft || keys.a || keys.A) px -= 4.2;
          if (keys.ArrowRight || keys.d || keys.D) px += 4.2;
          px = clamp(px, LL + BR + 4, LR - BR - 4);
          ball.x = px;
          aimPh += 0.045 * spd();
          aimA = Math.sin(aimPh) * 0.42;
        } else {
          powPh += 0.072 * spd();
          power = (Math.sin(powPh - 1.57) + 1) / 2;
        }
        // Envoi régulier de la visée en mode En Ligne P2P
        if (playType === 'online' && tk % 3 === 0) {
          netSend({ type: 'aim', px, aimLock, aimA, power });
        }
      }
    }

    if (st === 'roll') {
      settleT++;
      let steer = 0;
      if (isBotTurn() && botPlan) {
        steer = clamp((botPlan.targetSpin - ball.spin) * 2.5, -1, 1);
      } else if (canLocalControl()) {
        const kb = (keys.ArrowRight || keys.d || keys.D ? 1 : 0) - (keys.ArrowLeft || keys.a || keys.A ? 1 : 0);
        steer = kb || (steerOn ? clamp((ptrX - ball.x) / 85, -1, 1) : 0);
      }

      if (ball.rolling && !gutter) {
        if (ball.y > 290 && canLocalControl() || isBotTurn()) {
          ball.spin = clamp(ball.spin + steer * 0.028, -1, 1);
        }
        // Zone huilée (y > 470) : glisse plus douce ; zone sèche (y <= 470) : l'effet accroche fort !
        ball.vx += ball.spin * (ball.y > 470 ? 0.008 : 0.078);
        ball.rot += Math.hypot(ball.vx, ball.vy) * 0.045;
      }

      if (playType === 'online' && isMyNetTurn() && ball.rolling) {
        netSyncTimer++;
        if (netSyncTimer % 3 === 0) {
          netSend({
            type: 'roll_sync',
            bx: ball.x,
            by: ball.y,
            vx: ball.vx,
            vy: ball.vy,
            spin: ball.spin
          });
        }
      }

      for (let s = 0; s < 3; s++) {
        if (ball.rolling) {
          ball.x += ball.vx / 3;
          ball.y += ball.vy / 3;

          if (!gutter && (ball.x < LL || ball.x > LR)) {
            gutter = true;
            tone(110, 0.32, 'sawtooth', 0.075, -45);
          }
          if (gutter) {
            const tx = ball.x < 240 ? LL - 17 : LR + 17;
            ball.x += ((tx - ball.x) * 0.22) / 3;
            ball.vx = 0;
            if (ball.vy > -5.5) ball.vy = -5.5;
          }
          ballBumpers();
          ballPins();
        }
        pinPhysics();
      }

      pins.forEach(p => {
        const k = p.down ? 0.96 : 0.985;
        p.vx *= k;
        p.vy *= k;
        p.imp *= 0.995;
      });

      ball.vx *= 0.998;
      ball.vy *= 0.998;
      const sp = Math.hypot(ball.vx, ball.vy);

      if (ball.rolling && (ball.y < 28 || sp < 0.4)) {
        ball.rolling = false;
        ball.x = -100;
        ball.vx = ball.vy = 0;
      }

      const calm = pins.every(p => p.gone || Math.hypot(p.vx, p.vy) < 0.15);
      if (!ball.rolling && calm) calmT++;
      else calmT = 0;

      // En ligne, seul le joueur actif valide la fin de lancer (avec sécurité timeout)
      if (playType === 'online' && !isMyNetTurn()) {
        if (settleT > 760) endThrow();
      } else if (calmT > 24 || settleT > 700) {
        endThrow();
      }
    }

    if (st === 'between') {
      wait--;
      if (wait <= 0) {
        if (FIN && fi >= NF) {
          if (np === 1) stats.games++;
          saveStats();
          st = 'over';
          overAt = tk;
          arp([523.25, 659.25, 783.99, 1046.5], 105, 'triangle', 0.08);
        } else if (turnChg) {
          turnChg = false;
          st = 'pass';
          tone(440, 0.15, 'triangle', 0.07);
        } else {
          newThrow();
        }
      }
    }

    // Particules & traînée de la boule
    parts.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.06;
      p.l--;
    });
    parts = parts.filter(p => p.l > 0);

    texts.forEach(t => {
      t.y -= 0.75;
      t.l--;
    });
    texts = texts.filter(t => t.l > 0);

    if (ball && ball.rolling) {
      const sk = SKINS[stats.skin] || SKINS[0];
      trails.push({ x: ball.x, y: ball.y, r: ball.r, l: 16, c: gutter ? '#f35' : sk.trail });
      if (tk % 2 === 0) {
        parts.push({
          x: ball.x + (Math.random() - 0.5) * 8,
          y: ball.y + 8,
          vx: (Math.random() - 0.5) * 0.8,
          vy: 0.6,
          l: 18,
          c: gutter ? '#f35' : sk.trail,
          s: 2.8
        });
      }
    }
    trails.forEach(t => t.l--);
    trails = trails.filter(t => t.l > 0);

    updateRollAudio();
  }

  /* ==========================================================================
     5. RENDU GRAPHIQUE (PSEUDO-3D SYNTHWAVE)
     ========================================================================== */
  const VS = 1.25, S0 = 1 / 2.2;
  function P(x, y) {
    const T = clamp((y - 40) / 700, 0, 1.05);
    const s = 1 / (1 + 1.2 * (1 - T));
    return [240 + (x - 240) * s * VS, 92 + 608 * (s - S0) / (1 - S0), s * VS];
  }

  function txt(s, x, y, size, col, al = 'center', glow = true, out = false) {
    g.font = size + 'px ' + FONT;
    g.textAlign = al;
    if (out) {
      g.lineWidth = 6;
      g.strokeStyle = '#05010f';
      g.lineJoin = 'round';
      g.strokeText(s, x, y);
    }
    g.fillStyle = col;
    if (glow) {
      g.shadowColor = col;
      g.shadowBlur = 12;
    }
    g.fillText(s, x, y);
    g.shadowBlur = 0;
  }

  function quad(a, fill) {
    g.beginPath();
    a.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])));
    g.closePath();
    g.fillStyle = fill;
    g.fill();
  }

  function line(a, b, col, w, blur = 0) {
    g.strokeStyle = col;
    g.lineWidth = w;
    g.shadowColor = col;
    g.shadowBlur = blur;
    g.beginPath();
    g.moveTo(a[0], a[1]);
    g.lineTo(b[0], b[1]);
    g.stroke();
    g.shadowBlur = 0;
  }

  function btn(x, y, w, h, l, sel, fn, sz = 9, c = '#0ff', locked = false) {
    hits.push({ x, y, w, h, fn });
    const hv = mx >= x && mx <= x + w && my >= y && my <= y + h;
    g.fillStyle = locked ? '#ffffff08' : (sel ? c : (hv ? '#ffffff2c' : '#ffffff12'));
    g.fillRect(x, y, w, h);
    g.strokeStyle = locked ? '#666' : c;
    g.lineWidth = hv || sel ? 2.5 : 1.5;
    g.shadowColor = locked ? 'transparent' : c;
    g.shadowBlur = sel || hv ? 14 : 0;
    g.strokeRect(x, y, w, h);
    g.shadowBlur = 0;
    txt(l, x + w / 2, y + h / 2 + sz / 2 - 1, sz, locked ? '#777' : (sel ? '#05010f' : '#fff'), 'center', false);
  }

  function drawSynthSun() {
    const cx = 240, cy = 145, R = 68;
    g.save();
    // Halo autour du soleil
    const halo = g.createRadialGradient(cx, cy, 10, cx, cy, 180);
    halo.addColorStop(0, 'rgba(255, 0, 200, 0.45)');
    halo.addColorStop(0.5, 'rgba(130, 0, 255, 0.15)');
    halo.addColorStop(1, 'rgba(0, 0, 0, 0)');
    g.fillStyle = halo;
    g.fillRect(0, 86, W, 220);

    // Disque solaire avec bandes synthwave
    g.beginPath();
    g.arc(cx, cy, R, Math.PI, 0);
    g.closePath();
    g.clip();

    const sunGr = g.createLinearGradient(0, cy - R, 0, cy);
    sunGr.addColorStop(0, '#ffff44');
    sunGr.addColorStop(0.5, '#ff44aa');
    sunGr.addColorStop(1, '#aa00ff');
    g.fillStyle = sunGr;
    g.fillRect(cx - R, cy - R, R * 2, R);

    // Découpes horizontales animées dans le soleil
    g.fillStyle = '#180542';
    for (let i = 0; i < 6; i++) {
      const y = cy - 6 - i * 10 + ((tk * 0.15) % 10);
      const h = 1.5 + i * 0.45;
      g.fillRect(cx - R, y, R * 2, h);
    }
    g.restore();
  }

  function drawLane() {
    // Ciel synthwave
    const bg = g.createLinearGradient(0, 0, 0, H);
    bg.addColorStop(0, '#0e032e');
    bg.addColorStop(0.28, '#2b0963');
    bg.addColorStop(0.55, '#190542');
    bg.addColorStop(1, '#060117');
    g.fillStyle = bg;
    g.fillRect(0, 0, W, H);

    // Étoiles scintillantes
    STARS.forEach(st => {
      const a = 0.35 + 0.65 * Math.abs(Math.sin(tk * 0.04 + st.ph));
      g.fillStyle = `rgba(255, 255, 255, ${a.toFixed(2)})`;
      g.fillRect(st.x, st.y, st.s, st.s);
    });

    // Soleil rétro au fond de l'horizon
    drawSynthSun();

    // Montagnes wireframe minimalistes sur les côtés
    g.strokeStyle = '#ff00ff44';
    g.lineWidth = 1.5;
    g.beginPath();
    g.moveTo(0, 148); g.lineTo(45, 118); g.lineTo(95, 142); g.lineTo(140, 124); g.lineTo(175, 148);
    g.moveTo(305, 148); g.lineTo(345, 122); g.lineTo(395, 140); g.lineTo(440, 114); g.lineTo(480, 148);
    g.stroke();

    // Gouttières latérales
    quad([P(LL - 34, 40), P(LL, 40), P(LL, 740), P(LL - 34, 740)], '#04010d');
    quad([P(LR, 40), P(LR + 34, 40), P(LR + 34, 740), P(LR, 740)], '#04010d');

    // Chevrons lumineux animés dans les gouttières
    g.strokeStyle = gutter ? '#ff2244cc' : '#ff00ff88';
    g.lineWidth = 2;
    for (let k = 0; k < 14; k++) {
      const y = 740 - ((k * 50 + tk * 3.2) % 700);
      if (y < 60) continue;
      [LL - 17, LR + 17].forEach(x => {
        const a = P(x - 9, y + 8), b = P(x, y), c = P(x + 9, y + 8);
        g.beginPath();
        g.moveTo(a[0], a[1]);
        g.lineTo(b[0], b[1]);
        g.lineTo(c[0], c[1]);
        g.stroke();
      });
    }

    // Surface de la piste
    const gr = g.createLinearGradient(0, 92, 0, 700);
    gr.addColorStop(0, '#180747');
    gr.addColorStop(0.45, '#3b1485');
    gr.addColorStop(1, '#5d21c2');
    quad([P(LL, 40), P(LR, 40), P(LR, 740), P(LL, 740)], gr);

    // Reflet central (zone huilée jusqu'à y = 470)
    const oilGr = g.createLinearGradient(0, 260, 0, 740);
    oilGr.addColorStop(0, 'rgba(0, 255, 255, 0.02)');
    oilGr.addColorStop(0.5, 'rgba(0, 255, 255, 0.09)');
    oilGr.addColorStop(1, 'rgba(255, 0, 255, 0.14)');
    quad([P(LL + 35, 470), P(LR - 35, 470), P(LR - 25, 740), P(LL + 25, 740)], oilGr);

    // Lattes du parquet
    for (let i = 1; i < 6; i++) {
      line(P(LL + i * 50, 40), P(LL + i * 50, 740), '#ffffff18', 1);
    }
    // Ondes de vitesse sur la piste
    for (let k = 0; k < 7; k++) {
      const y = 40 + ((tk * 2.4 + k * 100) % 700);
      line(P(LL, y), P(LR, y), '#ffffff0e', 2);
    }

    // 7 flèches de visée en V sur la piste
    g.fillStyle = '#ff0c';
    g.shadowColor = '#ff0';
    g.shadowBlur = 8;
    for (let i = 0; i < 7; i++) {
      const [x, y, s] = P(LL + 37.5 * (i + 1), 470 + Math.abs(i - 3) * 16);
      const z = 7 * s;
      g.beginPath();
      g.moveTo(x, y - z * 1.7);
      g.lineTo(x - z, y + z * 0.5);
      g.lineTo(x + z, y + z * 0.5);
      g.closePath();
      g.fill();
    }
    g.shadowBlur = 0;

    // Points de repérage
    g.fillStyle = '#fff9';
    [1, 2, 3, 4, 5].forEach(i => {
      const [x, y, s] = P(LL + i * 50, 590);
      g.beginPath();
      g.arc(x, y, 2.3 * s, 0, 7);
      g.fill();
    });

    // Bordures néon cyan & ligne de faute magenta
    line(P(LL, 40), P(LL, 740), '#0ff', 4, 16);
    line(P(LR, 40), P(LR, 740), '#0ff', 4, 16);
    line(P(LL, 690), P(LR, 690), '#f0f', 4, 14);
    quad([P(LL, 470), P(LR, 470), P(LR, 740), P(LL, 740)], '#ffffff09');

    // Portique fond de piste (Pin Deck)
    const a = P(LL - 34, 40), b = P(LR + 34, 40);
    g.fillStyle = '#07021a';
    g.fillRect(a[0], 86, b[0] - a[0], a[1] - 86);
    g.strokeStyle = '#ff00ff88';
    g.lineWidth = 2;
    g.strokeRect(a[0], 86, b[0] - a[0], a[1] - 86);
  }

  function drawSweeper() {
    if (!sweeper.active) return;
    // Descente puis remontée de la barre balayeuse
    const prog = Math.sin((sweeper.t / sweeper.dur) * Math.PI);
    const wy = 160 + prog * 135;
    const left = P(LL - 10, wy);
    const right = P(LR + 10, wy);
    const h = 16 * left[2];

    g.save();
    g.fillStyle = '#120536';
    g.strokeStyle = '#00ffff';
    g.lineWidth = 2.5;
    g.shadowColor = '#00ffff';
    g.shadowBlur = 16;
    g.fillRect(left[0], left[1] - h, right[0] - left[0], h);
    g.strokeRect(left[0], left[1] - h, right[0] - left[0], h);

    // Bandes de danger néon sur la balayeuse
    g.fillStyle = '#ff00ff';
    const seg = (right[0] - left[0]) / 8;
    for (let i = 0; i < 8; i += 2) {
      g.fillRect(left[0] + i * seg + 4, left[1] - h + 3, seg - 8, h - 6);
    }
    g.restore();
  }

  function drawPin(p) {
    const [x0, y0, s] = P(p.x, p.y);
    const r = PR * s;

    // Ombre portée
    g.fillStyle = 'rgba(0, 0, 0, 0.5)';
    g.beginPath();
    g.ellipse(x0, y0 + r * 0.25, r * 1.15, r * 0.45, 0, 0, 7);
    g.fill();

    g.save();
    g.translate(x0, y0);
    g.rotate(p.down ? p.ang : Math.sin(tk * 0.6) * p.wob * 0.12);
    if (p.down) g.globalAlpha = 0.88;

    const h = r * 3.45;
    const gr = g.createLinearGradient(-r, 0, r, 0);
    gr.addColorStop(0, '#c8d6e5');
    gr.addColorStop(0.4, '#ffffff');
    gr.addColorStop(1, '#8395a7');

    g.shadowColor = p.down ? '#ff0' : '#fff';
    g.shadowBlur = p.down ? 10 : 7;
    g.fillStyle = gr;

    // Corps & tête de la quille
    g.beginPath();
    g.ellipse(0, -h * 0.34, r * 0.9, h * 0.34, 0, 0, 7);
    g.fill();
    g.beginPath();
    g.arc(0, -h * 0.84, r * 0.5, 0, 7);
    g.fill();
    g.shadowBlur = 0;

    // Colliers rouges néon
    g.fillStyle = '#ff1e56';
    g.beginPath();
    g.ellipse(0, -h * 0.66, r * 0.7, r * 0.2, 0, 0, 7);
    g.fill();
    g.beginPath();
    g.ellipse(0, -h * 0.58, r * 0.8, r * 0.14, 0, 0, 7);
    g.fill();

    g.restore();
  }

  function drawBumper(b) {
    const [x, y, s] = P(b.x, b.y);
    const r = b.r * s;
    const pulse = b.hitCd > 0 ? 1.25 : 1 + Math.sin(tk * 0.15) * 0.06;

    g.fillStyle = 'rgba(0,0,0,0.5)';
    g.beginPath();
    g.ellipse(x, y + r * 0.6, r * 1.15, r * 0.45, 0, 0, 7);
    g.fill();

    const gr = g.createRadialGradient(x - r * 0.3, y - r * 0.5, 2, x, y - r * 0.3, r * 1.15 * pulse);
    gr.addColorStop(0, '#ffffff');
    gr.addColorStop(0.35, b.hitCd > 0 ? '#ffff00' : '#ff44ff');
    gr.addColorStop(1, '#8800aa');

    g.shadowColor = b.hitCd > 0 ? '#ff0' : '#f0f';
    g.shadowBlur = 20;
    g.fillStyle = gr;
    g.beginPath();
    g.arc(x, y - r * 0.3, r * pulse, 0, 7);
    g.fill();

    g.strokeStyle = '#fff';
    g.lineWidth = 1.5;
    g.stroke();
    g.shadowBlur = 0;
  }

  function drawBall() {
    if (!ball || !isFinite(ball.x) || !isFinite(ball.y) || ball.x < 0) return;
    const sk = SKINS[stats.skin] || SKINS[0];

    // Traînée lumineuse derrière la boule
    trails.forEach(tr => {
      const [tx, ty, ts] = P(tr.x, tr.y);
      const rad = tr.r * ts * (tr.l / 16) * 0.85;
      g.globalAlpha = (tr.l / 16) * 0.35;
      g.fillStyle = tr.c;
      g.beginPath();
      g.arc(tx, ty - rad * 0.3, rad, 0, 7);
      g.fill();
    });
    g.globalAlpha = 1;

    const [x, y, s] = P(ball.x, ball.y);
    const r = BR * s;

    // Ombre
    g.fillStyle = 'rgba(0, 0, 0, 0.55)';
    g.beginPath();
    g.ellipse(x, y + r * 0.7, r * 1.15, r * 0.45, 0, 0, 7);
    g.fill();

    // Sphère de la boule
    const gr = g.createRadialGradient(x - r * 0.35, y - r * 0.8, 2, x, y - r * 0.3, r * 1.2);
    gr.addColorStop(0, sk.c1);
    gr.addColorStop(0.32, sk.c2);
    gr.addColorStop(1, sk.c3);

    g.shadowColor = sk.glow;
    g.shadowBlur = 22;
    g.fillStyle = gr;
    g.beginPath();
    g.arc(x, y - r * 0.3, r, 0, 7);
    g.fill();
    g.shadowBlur = 0;

    // Trous de doigts animés avec la rotation
    g.save();
    g.translate(x, y - r * 0.3);
    g.rotate(ball.rot + ball.spin * 0.6);
    g.fillStyle = 'rgba(5, 1, 15, 0.65)';
    [[-0.25, -0.35], [0.22, -0.4], [-0.02, -0.05]].forEach(([hx, hy]) => {
      g.beginPath();
      g.arc(hx * r, hy * r, r * 0.13, 0, 7);
      g.fill();
    });
    g.restore();
  }

  function drawAim() {
    const dx = Math.sin(aimA), dy = -Math.cos(aimA);
    const col = aimLock ? '#ff0' : '#0f8';
    const pts = [];

    g.fillStyle = col;
    g.shadowColor = col;
    g.shadowBlur = 10;

    for (let i = 1; i <= 14; i++) {
      const wy = ball.y + dy * i * 22;
      if (wy < 60) break;
      const [x, y, s] = P(ball.x + dx * i * 22, wy);
      pts.push([x, y - 4]);
      if (i < 14) {
        g.beginPath();
        g.arc(x, y - 4, Math.max(1.5, (3.6 - i * 0.1) * s * 1.1), 0, 7);
        g.fill();
      }
    }

    if (pts.length > 2) {
      const a = pts[pts.length - 2];
      const b = pts[pts.length - 1];
      const an = Math.atan2(b[1] - a[1], b[0] - a[0]);
      g.save();
      g.translate(b[0], b[1]);
      g.rotate(an);
      g.beginPath();
      g.moveTo(10, 0);
      g.lineTo(-5, -7);
      g.lineTo(-5, 7);
      g.closePath();
      g.fill();
      g.restore();
    }
    g.shadowBlur = 0;
  }

  // Mini-radar des quilles restantes en haut à droite pendant la visée
  function drawPinRadar() {
    if (st !== 'aim') return;
    const rx = 420, ry = 102, rw = 52, rh = 56;
    g.fillStyle = 'rgba(11, 4, 40, 0.82)';
    g.fillRect(rx, ry, rw, rh);
    g.strokeStyle = '#0ff8';
    g.lineWidth = 1.5;
    g.strokeRect(rx, ry, rw, rh);

    pins.forEach(p => {
      const px = rx + rw / 2 + (p.ox - 240) * 0.36;
      const py = ry + rh - 10 - (275 - p.oy) * 0.38;
      g.beginPath();
      g.arc(px, py, 3.2, 0, 7);
      if (p.gone) {
        g.fillStyle = '#ffffff22';
        g.fill();
      } else {
        g.fillStyle = p.id === 1 ? '#ff0' : '#0ff';
        g.fill();
      }
    });
  }

  function playerLabel(idx, short = false) {
    if (playType === 'solo') return short ? 'SCORE' : 'SCORE FINAL';
    if (playType === 'bot') return idx === 0 ? (short ? 'TOI' : 'JOUEUR (TOI)') : (short ? 'BOT' : 'BOT ' + BOT_LEVELS[botDiff].n);
    if (playType === 'online') {
      const isMe = (netRole === 'host' && idx === 0) || (netRole === 'guest' && idx === 1);
      return isMe ? (short ? 'TOI' : 'TOI (J' + (idx + 1) + ')') : (short ? 'AMI' : 'AMI (J' + (idx + 1) + ')');
    }
    return short ? 'J' + (idx + 1) : 'JOUEUR ' + (idx + 1);
  }

  function drawBoard() {
    g.fillStyle = '#0b0428';
    g.fillRect(0, 0, W, 90);
    const V = FIN ? NF : 6;
    const cw = 400 / V;
    const s0 = FIN ? 0 : Math.max(0, fi - V + 2);
    const rh = np > 1 ? 38 : 60;
    const y0 = np > 1 ? 5 : 14;

    PL.forEach((p, i) => {
      const y = y0 + i * (rh + 5);
      const a = calc(p);
      const on = i === cp;
      const col = i ? '#f0f' : '#0ff';

      txt(playerLabel(i, true), 6, y + 14, 7.5, on ? '#ff0' : col, 'left', false);
      txt(String(a.tot + p.bonus).padStart(5, '0'), 6, y + rh - 8, 9, '#fff', 'left', false);

      for (let k = 0; k < V; k++) {
        const idx = s0 + k;
        const x = 72 + k * cw;
        const c = a.fr[idx];
        const cur = on && idx === fi && st !== 'over';

        g.fillStyle = cur ? '#ffffff28' : '#ffffff0a';
        g.fillRect(x + 1, y, cw - 2, rh);
        g.strokeStyle = cur ? '#ff0' : col + '66';
        g.lineWidth = cur ? 2 : 1;
        g.strokeRect(x + 1, y, cw - 2, rh);

        txt(String(idx + 1), x + 4, y + 9, 6, '#fff6', 'left', false);

        const m = c ? c.m : [];
        const bw = Math.min(16, cw / 3.2);
        const mh = Math.round(rh * 0.4);
        m.forEach((v, j) => {
          const bx = x + cw - 3 - (m.length - j) * bw;
          g.strokeStyle = '#fff5';
          g.lineWidth = 1;
          g.strokeRect(bx, y + 3, bw, mh);
          txt(v, bx + bw / 2, y + 3 + mh / 2 + 4, 8, v === 'X' ? '#f0f' : (v === '/' ? '#0ff' : '#fff'), 'center', false);
        });

        if (c && c.t !== null) {
          txt(String(c.t), x + cw / 2, y + rh - 5, rh > 40 ? 10 : 8, '#ff0', 'center', false);
        }
      }
    });
    line([0, 90], [W, 90], '#0ff', 3, 10);
  }

        } else {
          tone(160, 0.15, 'sawtooth');
          say('BLOQUÉ', '#f35', 55, sk.req + ' STRIKES REQUIS');
        }
      }, 7, sk.glow, !unlocked);

      const cx = bx + 51.5, cy = 507, r = 10.5;
      const gr = g.createRadialGradient(cx - 3, cy - 3, 1, cx, cy, r);
      gr.addColorStop(0, unlocked ? sk.c1 : '#666');
      gr.addColorStop(0.4, unlocked ? sk.c2 : '#444');
      gr.addColorStop(1, unlocked ? sk.c3 : '#222');
      g.fillStyle = gr;
      g.beginPath();
      g.arc(cx, cy, r, 0, 7);
      g.fill();

      txt(unlocked ? sk.name.split(' ')[1] : sk.req + 'X', cx, 531, 6.5, sel ? '#05010f' : (unlocked ? '#fff' : '#888'), 'center', false);
    });

    // Boutons d'action principaux
    const mainLabel = playType === 'online' ? 'SALON EN LIGNE' : 'JOUER';
    btn(90, 558, 300, 52, mainLabel, Math.floor(tk / 28) % 2 === 0, () => {
      if (playType === 'online') {
        st = 'online';
        onlineSub = 'choice';
        netStatus = 'PRÊT À CONNECTER';
        tone(620, 0.08);
      } else {
        startGame();
      }
    }, 15, '#ff0');

    btn(90, 622, 142, 34, 'RECORDS', false, () => { st = 'stats'; tone(580, 0.07); }, 8, '#0ff');
    btn(248, 622, 142, 34, mute ? 'SON : OFF' : 'SON : ON', false, () => {
      initAudio();
      mute = !mute;
    }, 8, '#f0f');

    // Mini guide rapide
    [
      '1. PLACE LA BOULE • 2. BLOQUE L\'ANGLE',
      '3. VISE LE VERT • 4. EFFET EN VOL < >'
    ].forEach((s, i) => txt(s, W / 2, 690 + i * 20, 7, '#fff9', 'center', false));

    txt('RECORD INFINI : ' + String(stats.best).padStart(5, '0'), W / 2, 768, 8.5, '#ff0', 'center', true);
  }

  function copyRoomCode() {
    const ta = document.createElement('textarea');
    ta.value = roomCode;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    copiedToast = 110;
    tone(880, 0.1, 'triangle', 0.07);
  }

  function drawOnline() {
    overlay(0.92);
    txt('MULTIJOUEUR P2P', W / 2, 130, 20, '#0f8');
    txt('DIRECT WEBRTC • SANS SERVEUR', W / 2, 162, 8, '#0ff');

    if (onlineSub === 'choice') {
      txt('MODE SÉLECTIONNÉ : ' + MODES[mode].n, W / 2, 220, 8, '#ff0');
      btn(70, 270, 340, 58, 'CRÉER UN SALON', true, hostRoom, 12, '#0ff');
      txt('OBTIENS UN CODE À PARTAGER', W / 2, 346, 7, '#fff9', 'center', false);

      btn(70, 390, 340, 58, 'REJOINDRE UN SALON', false, openJoinRoom, 12, '#f0f');
      txt('ENTRE LE CODE DE TON AMI', W / 2, 466, 7, '#fff9', 'center', false);
    } else if (onlineSub === 'hosting') {
      txt('PARTAGE CE CODE À TON AMI :', W / 2, 230, 8.5, '#fff');

      g.fillStyle = '#ffffff12';
      g.fillRect(90, 255, 300, 68);
      g.strokeStyle = '#0ff';
      g.lineWidth = 2.5;
      g.strokeRect(90, 255, 300, 68);
      txt(roomCode || '....', W / 2, 302, 28, '#ff0');

      btn(110, 342, 260, 40, copiedToast > 0 ? 'CODE COPIÉ !' : 'COPIER LE CODE', false, copyRoomCode, 9, '#0f8');
      txt(netStatus, W / 2, 425, 8.5, '#0ff');
      if (Math.floor(tk / 25) % 2 === 0) {
        txt('EN ATTENTE DU JOUEUR 2...', W / 2, 455, 7.5, '#f0f');
      }
    } else if (onlineSub === 'joining') {
      txt('SAISIS LE CODE DU SALON :', W / 2, 240, 9, '#fff');
      // Le champ HTML #roomInput est positionné juste ici (top: 46%)
      btn(110, 420, 260, 48, 'CONNECTER', true, joinRoomSubmit, 12, '#0f8');
      txt(netStatus, W / 2, 505, 8, '#ff0');
    }

    btn(110, 640, 260, 48, 'RETOUR MENU', false, () => {
      closeNetwork();
      st = 'menu';
      tone(440, 0.06);
    }, 11, '#f0f');
  }

  function drawStats() {
    overlay(0.92);
    txt('STATISTIQUES', W / 2, 130, 22, '#0ff');
    txt('CARRIÈRE ARCADE', W / 2, 162, 9, '#f0f');

    const rows = [
      ['RECORD MODE INFINI', String(stats.best).padStart(5, '0'), '#ff0'],
      ['TOTAL STRIKES (X)', String(stats.strikes), '#f0f'],
      ['TOTAL SPARES (/)', String(stats.spares), '#0ff'],
      ['MEILLEURE SÉRIE X', String(stats.maxStreak), '#0f8'],
      ['PARTIES TERMINÉES', String(stats.games), '#fff']
    ];

    rows.forEach(([label, val, col], i) => {
      const y = 235 + i * 68;
      g.fillStyle = '#ffffff0d';
      g.fillRect(36, y - 24, W - 72, 48);
      g.strokeStyle = col + '66';
      g.lineWidth = 1.5;
      g.strokeRect(36, y - 24, W - 72, 48);
      txt(label, 52, y + 4, 8, '#ddd', 'left', false);
      txt(val, W - 52, y + 6, 13, col, 'right', true);
    });

    txt('DÉBLOQUE DES BOULES EN FAISANT DES STRIKES !', W / 2, 600, 7, '#ff0', 'center', false);
    btn(110, 650, 260, 50, 'RETOUR MENU', true, () => { st = 'menu'; tone(440, 0.06); }, 11, '#0ff');
  }

  function drawPass() {
    overlay(0.84);
    txt('JOUEUR ' + (cp + 1), W / 2, 320, 36, cp ? '#f0f' : '#0ff');
    txt('À TOI DE JOUER !', W / 2, 376, 12, '#ff0');
    txt('PASSE L\'APPAREIL AU JOUEUR ' + (cp + 1), W / 2, 420, 8, '#fff', 'center', false);
    if (Math.floor(tk / 28) % 2 === 0) {
      txt('TOUCHE OU ESPACE POUR LANCER', W / 2, 500, 9.5, '#0ff');
    }
  }

  function shareScore(scoreVal) {
    const modeName = MODES[mode].n;
    const text = `🎳 NolBowling (${modeName}) : ${scoreVal} pts ! Peux-tu battre mon score ?`;
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    copiedToast = 110;
    tone(880, 0.1, 'triangle', 0.07);
  }

  function drawOver() {
    overlay(0.91);
    txt(FIN && fi >= NF ? 'PARTIE TERMINÉE' : 'FIN DE PARTIE', W / 2, 130, 20, '#ff0');

    const tt = PL.map(total);
    const top = Math.max(...tt);

    PL.forEach((p, i) => {
      const y = 210 + i * 135;
      const win = np > 1 && tt[i] === top && tt.filter(v => v === top).length === 1;
      const col = i ? '#f0f' : '#0ff';

      g.fillStyle = '#ffffff0c';
      g.fillRect(36, y - 26, W - 72, 112);
      g.strokeStyle = win ? '#ff0' : col + '88';
      g.lineWidth = win ? 2.5 : 1.5;
      g.strokeRect(36, y - 26, W - 72, 112);

      txt(playerLabel(i, false), W / 2, y, 10, col);
      txt(String(tt[i]), W / 2, y + 40, 28, win || np === 1 ? '#ff0' : '#fff');
      txt(`STRIKES: ${p.strikes}  •  SPARES: ${p.spares}  •  SÉRIE: ${p.bestStreak}`, W / 2, y + 70, 7, '#ccc', 'center', false);
    });

    if (np > 1) {
      let w = '';
      if (tt.filter(v => v === top).length > 1) {
        w = 'ÉGALITÉ PARFAITE !';
      } else {
        const winIdx = tt.indexOf(top);
        w = playerLabel(winIdx, false) + ' GAGNE !';
      }
      txt(w, W / 2, 485, 10, '#0f8');
    } else if (!FIN && total(PL[0]) >= stats.best && stats.best > 0) {
      txt('★ NOUVEAU RECORD PERSONNEL ! ★', W / 2, 365, 10, '#0f8');
    }

    btn(90, 525, 300, 50, 'REJOUER', Math.floor(tk / 28) % 2 === 0, () => startGame(false), 14, '#ff0');
    btn(90, 590, 300, 42, copiedToast > 0 ? 'SCORE COPIÉ !' : 'COPIER LE SCORE', false, () => shareScore(top), 9.5, '#0f8');
    btn(90, 646, 300, 42, 'MENU PRINCIPAL', false, () => {
      if (playType === 'online') closeNetwork();
      st = 'menu';
    }, 10, '#0ff');
  }

  function draw() {
    g.setTransform(Q, 0, 0, Q, 0, 0);
    hits = [];
    g.save();

    if (shake > 0.5) {
      g.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }

    drawLane();
    if (st === 'aim') drawAim();

    // Tri en profondeur (painter's algorithm) des quilles, bumpers et boule
    const items = [];
    pins.forEach(p => { if (!p.gone) items.push([p.y, () => drawPin(p)]); });
    bumpers.forEach(b => items.push([b.y, () => drawBumper(b)]));
    if (ball) items.push([ball.y, drawBall]);
    items.sort((a, b) => a[0] - b[0]).forEach(i => i[1]());

    drawSweeper();

    // Particules & textes flottants
    parts.forEach(p => {
      const [x, y, s] = P(p.x, p.y);
      g.globalAlpha = clamp(p.l / 28, 0, 1);
      g.fillStyle = p.c;
      g.fillRect(x, y - 8 * s, p.s * s * 1.5, p.s * s * 1.5);
    });
    g.globalAlpha = 1;

    texts.forEach(t => {
      const [x, y] = P(t.x, t.y);
      g.globalAlpha = clamp(t.l / 28, 0, 1);
      txt(t.t, x, y - 30, 13, t.c, 'center', true, true);
    });
    g.globalAlpha = 1;

    // Flash lumineux lors des strikes / spares
    if (flash > 0) {
      g.fillStyle = flashCol;
      g.globalAlpha = flash * 0.35;
      g.fillRect(0, 0, W, H);
      g.globalAlpha = 1;
    }

    g.restore();

    if (st !== 'menu' && st !== 'stats' && st !== 'online') {
      hud();
      drawPinRadar();
    }

    // Annonces arcade centrales
    if (msgT > 0 && st !== 'over') {
      const sc = 1 + Math.sin(msgT / 4) * 0.04 + (msgT > 85 ? (msgT - 85) * 0.025 : 0);
      g.save();
      g.translate(W / 2, 375);
      g.scale(sc, sc);
      g.globalAlpha = clamp(msgT / 18, 0, 1);
      const sz = msg.length > 10 ? (msg.length > 15 ? 15 : 20) : 28;
      txt(msg, 0, 0, sz, msgC, 'center', true, true);
      if (msgSub) {
        txt(msgSub, 0, 26, 8.5, '#fff', 'center', true, true);
      }
      g.restore();
    }

    if (st === 'menu') drawMenu();
    if (st === 'stats') drawStats();
    if (st === 'online') drawOnline();
    if (st === 'pass') drawPass();
    if (st === 'over') drawOver();
  }

  /* ==========================================================================
     6. CONTRÔLES SOURIS, TACTILE & CLAVIER
     ========================================================================== */
  function cpos(e) {
    const r = cv.getBoundingClientRect();
    mx = ((e.clientX - r.left) / r.width) * W;
    my = ((e.clientY - r.top) / r.height) * H;
  }

  function ptr(move) {
    if (!canLocalControl()) return;
    const k = P(240, ball ? ball.y : 735)[2];
    ptrX = 240 + (mx - 240) / k;
    if (move && st === 'aim' && aimLock === 0) {
      px = clamp(ptrX, LL + BR + 4, LR - BR - 4);
    }
    if (st === 'roll') steerOn = true;
  }

  cv.addEventListener('pointermove', e => {
    cpos(e);
    if (Math.abs(mx - sx) > 12) moved = true;
    if (e.pointerType === 'mouse' || ptrDown) ptr(true);
  });

  cv.addEventListener('pointerdown', e => {
    e.preventDefault();
    initAudio();
    cpos(e);
    ptrDown = true;
    sx = mx;
    moved = false;
    hitBtn = false;

    for (const h of hits) {
      if (mx >= h.x && mx <= h.x + h.w && my >= h.y && my <= h.y + h.h) {
        hitBtn = true;
        h.fn();
        return;
      }
    }

    if (e.pointerType === 'mouse') {
      ptr(true);
      action();
    } else {
      ptr(false);
    }
  });

  function up(e) {
    if (!ptrDown) return;
    ptrDown = false;
    if (e.type === 'pointerup' && e.pointerType !== 'mouse' && !hitBtn && !moved) {
      action();
    }
    if (e.pointerType !== 'mouse') steerOn = false;
  }

  cv.addEventListener('pointerup', up);
  cv.addEventListener('pointercancel', up);

  window.addEventListener('keydown', e => {
    if (document.activeElement === roomInputEl) {
      if (e.code === 'Enter') joinRoomSubmit();
      return;
    }
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'].includes(e.code)) {
      e.preventDefault();
    }
    if (e.code === 'Space' || e.code === 'Enter') {
      if (!e.repeat) action();
    }
    if (e.key === 'm' || e.key === 'M') {
      initAudio();
      mute = !mute;
    }
    if (e.key === 'Escape') {
      if (st === 'stats') st = 'menu';
      else if (st === 'online') { closeNetwork(); st = 'menu'; }
      else quit();
    }
    if (st === 'menu' && !e.repeat) {
      if (e.key === 'ArrowUp' || e.key === 'ArrowDown') mrow = 1 - mrow;
      const d = (e.key === 'ArrowRight') - (e.key === 'ArrowLeft');
      if (d) {
        if (mrow === 0) mode = (mode + d + 3) % 3;
        else {
          const types = ['solo', 'bot', 'local', 'online'];
          const idx = (types.indexOf(playType) + d + 4) % 4;
          playType = types[idx];
          np = playType === 'solo' ? 1 : 2;
        }
        tone(520, 0.06);
      }
    }
    keys[e.key] = true;
  });

  window.addEventListener('keyup', e => { keys[e.key] = false; });
  window.addEventListener('blur', () => {
    keys = {};
    ptrDown = false;
    steerOn = false;
  });

  /* ==========================================================================
     7. BOUCLE PRINCIPALE
     ========================================================================== */
  rack();
  newBall();
  ball.x = -100;

  let last = performance.now();
  let acc = 0;

  function loop(now) {
    acc += Math.min(now - last, 100);
    last = now;
    while (acc >= 16.667) {
      update();
      acc -= 16.667;
    }
    draw();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
